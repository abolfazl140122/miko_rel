<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثبت‌نام در همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.4);
            --error-color: #ff4d4d;
            --success-color: #28a745;
            --input-bg: #0d1117;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            background-image: radial-gradient(circle at top left, #1a202c 0%, var(--background-color) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- کانتینر اصلی --- */
        .register-container {
            width: 100%;
            max-width: 480px;
            perspective: 1000px;
        }

        .register-card {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            animation: cardEntry 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- هدر --- */
        .header-text {
            text-align: center;
            margin-bottom: 25px;
        }
        .header-text h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 0 0 15px var(--primary-glow);
        }
        .header-text p {
            margin: 8px 0 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* --- آپلودر پروفایل --- */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .profile-uploader {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px dashed var(--border-color);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--input-bg);
        }
        
        .profile-uploader:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .profile-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .upload-icon-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35px;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 0.8rem;
            transition: transform 0.3s;
            transform: translateY(100%);
        }
        
        .profile-uploader:hover .upload-icon-overlay {
            transform: translateY(0);
        }

        .upload-label-text {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        .upload-progress {
            width: 100px;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .upload-progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        /* --- فرم --- */
        .register-form {
            width: 100%;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 45px 12px 15px; /* فضای خالی برای آیکون راست */
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .input-field select {
            appearance: none;
            -webkit-appearance: none;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 163, 255, 0.15);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.3s;
            width: 20px;
            height: 20px;
        }

        .input-field:focus + .input-icon {
            color: var(--primary-color);
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .input-group {
            flex: 1;
        }

        /* --- پیام خطا زیر اینپوت --- */
        .field-error-text {
            color: var(--error-color);
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .input-field.error {
            border-color: var(--error-color);
        }

        /* --- چک باکس قوانین --- */
        .terms-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 20px;
        }
        
        .terms-group input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .terms-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .terms-group a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s;
        }
        .terms-group a:hover {
            color: #4dc3ff;
            text-decoration: underline;
        }

        /* --- دکمه ثبت نام --- */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 163, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #0091e6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 163, 255, 0.4);
        }

        .submit-btn:disabled {
            background-color: var(--secondary-hover);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- پیام وضعیت کلی --- */
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .status-message.error {
            background-color: rgba(255, 77, 77, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(255, 77, 77, 0.3);
        }
        .status-message.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- فوتر --- */
        .form-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            width: 100%;
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            transition: text-shadow 0.3s;
        }

        .form-footer a:hover {
            text-shadow: 0 0 8px var(--primary-glow);
        }

    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            
            <div class="header-text">
                <h1>ایجاد حساب</h1>
                <p>به همیار بپیوندید و دوستان جدید پیدا کنید</p>
            </div>

            <form id="register-form" class="register-form" novalidate>
                
                <!-- آپلود عکس -->
                <div class="profile-section">
                    <label for="profilePicInput" class="profile-uploader">
                        <img id="profile-preview" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM4Yjk0OWUiIHN0cm9rZS13aWR0aD0iMS41IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0yMCAyMXYtMS4zNGMwLTEuMjQtMS4yMy0yLjMtMy0yLjNoLTYuMDRjLTEuNzcgMC0zIDEuMDYtMyAyLjM0VjIxIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ii8+PC9zdmc+" alt="Profile Preview" class="profile-preview">
                        <div class="upload-icon-overlay">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        </div>
                    </label>
                    <div class="upload-label-text">انتخاب تصویر پروفایل</div>
                    <div class="upload-progress"><div class="upload-progress-bar"></div></div>
                    <input type="file" id="profilePicInput" accept="image/*" style="display:none;">
                </div>

                <!-- نام نمایشی -->
                <div class="input-group">
                    <label class="input-label" for="displayName">نام نمایشی</label>
                    <div class="input-wrapper">
                        <input type="text" id="displayName" class="input-field" placeholder="نامی که دیگران می‌بینند" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg>
                    </div>
                    <div class="field-error-text" id="displayName-error">این فیلد الزامی است</div>
                </div>

                <!-- نام کاربری -->
                <div class="input-group">
                    <label class="input-label" for="username">نام کاربری (انگلیسی)</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="input-field" placeholder="حروف انگلیسی، اعداد و _" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="field-error-text" id="username-error"></div>
                </div>

                <!-- موبایل -->
                <div class="input-group">
                    <label class="input-label" for="mobile">شماره موبایل</label>
                    <div class="input-wrapper">
                        <input type="tel" id="mobile" class="input-field" placeholder="مثال: 09123456789" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    </div>
                    <div class="field-error-text" id="mobile-error"></div>
                </div>

                <!-- سن و جنسیت (دو ستونه) -->
                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label" for="age">سن</label>
                        <input type="number" id="age" class="input-field" style="padding-left: 15px;" required min="18" max="99">
                        <div class="field-error-text" id="age-error"></div>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="gender">جنسیت</label>
                        <select id="gender" class="input-field" style="padding-left: 15px;" required>
                            <option value="" disabled selected>انتخاب...</option>
                            <option value="male">مرد</option>
                            <option value="female">زن</option>
                        </select>
                        <div class="field-error-text" id="gender-error"></div>
                    </div>
                </div>

                <!-- رمز عبور -->
                <div class="input-group">
                    <label class="input-label" for="password">رمز عبور</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <div class="field-error-text" id="password-error"></div>
                </div>

                <!-- تکرار رمز عبور -->
                <div class="input-group">
                    <label class="input-label" for="passwordConfirm">تکرار رمز عبور</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordConfirm" class="input-field" required>
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 5-5 4.9 4.9 0 0 1 3.3.8"></path></svg>
                    </div>
                    <div class="field-error-text" id="passwordConfirm-error"></div>
                </div>
                
                <!-- قوانین -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">با <a href="#" target="_blank">قوانین و مقررات</a> موافقم.</label>
                </div>
                <div class="field-error-text" id="terms-error"></div>
                
                <!-- دکمه ارسال -->
                <button type="submit" id="submit-btn" class="submit-btn" disabled>
                    <div class="spinner"></div>
                    <span>ایجاد حساب</span>
                </button>

                <!-- پیام وضعیت کلی -->
                <div id="form-status" class="status-message"></div>

            </form>

            <div class="form-footer">
                حساب کاربری دارید؟ <a href="login.html">وارد شوید</a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Configuration ---
        const UPLOAD_ENDPOINT = 'https://miko.freehost.io/upload_to_parspack.php';
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const SHARED_SECRET = 'miko1234';

        // --- 2. DOM Elements ---
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const formStatus = document.getElementById('form-status');
        const profilePicInput = document.getElementById('profilePicInput');
        const profilePreview = document.getElementById('profile-preview');
        const profileUploader = document.querySelector('.profile-uploader');
        const uploadProgressContainer = document.querySelector('.upload-progress');
        const uploadProgressBar = document.querySelector('.upload-progress-bar');
        
        const allInputs = {
            displayName: document.getElementById('displayName'),
            username: document.getElementById('username'),
            mobile: document.getElementById('mobile'),
            age: document.getElementById('age'),
            gender: document.getElementById('gender'),
            password: document.getElementById('password'),
            passwordConfirm: document.getElementById('passwordConfirm'),
            terms: document.getElementById('terms'),
        };

        // --- 3. State ---
        let profilePicUrl = ''; // Will hold the URL of the uploaded image

        // --- 4. Helper Functions ---
        function showError(fieldId, message) {
            const errorEl = document.getElementById(`${fieldId}-error`);
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
            const inputEl = allInputs[fieldId];
            if (inputEl) {
                inputEl.classList.add('error');
            }
        }

        function hideError(fieldId) {
            const errorEl = document.getElementById(`${fieldId}-error`);
            if (errorEl) {
                errorEl.style.display = 'none';
            }
            const inputEl = allInputs[fieldId];
            if (inputEl) {
                inputEl.classList.remove('error');
            }
        }
        
        function setFormStatus(message, type) {
            formStatus.textContent = message;
            formStatus.className = `status-message ${type}`; // 'success' or 'error'
            formStatus.style.display = 'block';
        }

        // --- 5. Image Upload Logic ---
        profileUploader.addEventListener('click', () => profilePicInput.click());

        profilePicInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // Show preview
                const reader = new FileReader();
                reader.onload = (event) => {
                    profilePreview.src = event.target.result;
                }
                reader.readAsDataURL(file);

                // Start upload
                uploadProfilePicture(file);
            }
        });

        function uploadProfilePicture(file) {
            const formData = new FormData();
            formData.append('file', file);

            uploadProgressContainer.style.display = 'block';
            uploadProgressBar.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_ENDPOINT, true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    uploadProgressBar.style.width = percentComplete + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            // Construct final URL
                            if (response.url) {
                                profilePicUrl = response.url;
                            } else if (response.file) {
                                profilePicUrl = `https://miko.freehost.io/uploads_proxy.php?file=${encodeURIComponent(response.file)}`;
                            }
                            console.log('Upload successful. URL:', profilePicUrl);
                            uploadProgressBar.style.backgroundColor = 'var(--success-color)';
                        } else {
                            throw new Error('Server reported failure.');
                        }
                    } catch (e) {
                        console.error('Error parsing upload response:', e);
                        setFormStatus('خطا در پردازش پاسخ آپلود.', 'error');
                        uploadProgressBar.style.backgroundColor = 'var(--error-color)';
                    }
                } else {
                    console.error('Upload failed with status:', xhr.status);
                    setFormStatus(`خطا در آپلود: ${xhr.statusText}`, 'error');
                    uploadProgressBar.style.backgroundColor = 'var(--error-color)';
                }
            };

            xhr.onerror = () => {
                console.error('Network error during upload.');
                setFormStatus('خطای شبکه هنگام آپلود تصویر.', 'error');
                uploadProgressBar.style.backgroundColor = 'var(--error-color)';
            };

            xhr.send(formData);
        }


        // --- 6. Validation Logic ---
        function validateField(fieldId) {
            const input = allInputs[fieldId];
            if (!input) return true; 

            hideError(fieldId);

            let isValid = true;
            const value = input.value.trim();

            if (input.required && (input.type === 'checkbox' ? !input.checked : value === '')) {
                showError(fieldId, input.type === 'checkbox' ? 'شما باید با قوانین موافقت کنید.' : 'این فیلد الزامی است.');
                isValid = false;
            } else {
                switch(fieldId) {
                    case 'username':
                        if (value && !/^[a-zA-Z0-9_]{3,15}$/.test(value)) {
                            showError(fieldId, 'نام کاربری باید 3 تا 15 کاراکتر (انگلیسی، عدد یا _) باشد.');
                            isValid = false;
                        }
                        break;
                    case 'mobile':
                        if (value && !/^09\d{9}$/.test(value)) {
                            showError(fieldId, 'فرمت شماره موبایل صحیح نیست (مثال: 09123456789).');
                            isValid = false;
                        }
                        break;
                    case 'age':
                        if (value && (+value < 18 || +value > 99)) {
                            showError(fieldId, 'سن شما باید بین 18 تا 99 سال باشد.');
                            isValid = false;
                        }
                        break;
                    case 'password':
                        if (value && value.length < 8) {
                            showError(fieldId, 'رمز عبور باید حداقل 8 کاراکتر باشد.');
                            isValid = false;
                        }
                        break;
                    case 'passwordConfirm':
                        if (value && value !== allInputs.password.value) {
                            showError(fieldId, 'رمزهای عبور با یکدیگر مطابقت ندارند.');
                            isValid = false;
                        }
                        break;
                }
            }
            return isValid;
        }

        function checkFormValidity() {
            let isFormValid = true;
            for (const key in allInputs) {
                if (!validateField(key)) {
                    isFormValid = false;
                }
            }
            submitBtn.disabled = !isFormValid;
            return isFormValid;
        }

        // --- 7. Event Listeners ---
        Object.values(allInputs).forEach(input => {
            if(!input) return;
            const eventType = ['checkbox', 'select-one'].includes(input.type) ? 'change' : 'input';
            input.addEventListener(eventType, () => validateField(input.id));
            input.addEventListener(eventType, checkFormValidity); // Check overall validity on any change
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            formStatus.style.display = 'none'; // Hide previous messages
            if (checkFormValidity()) {
                await submitRegistration();
            } else {
                console.log("Submit blocked due to validation errors.");
            }
        });


        // --- 8. Form Submission Flow ---
        async function submitRegistration() {
            submitBtn.disabled = true;
            // Add loading class to show spinner and hide text
            submitBtn.querySelector('.spinner').style.display = 'block';
            submitBtn.querySelector('span').style.display = 'none';

            const username = allInputs.username.value.trim().toLowerCase();
            const displayName = allInputs.displayName.value.trim();

            try {
                // Step 1: Get Auth Token
                const tokenResponse = await fetch(`${PROXY_URL}?auth=token`, {
                    headers: { 'X-Proxy-Secret': SHARED_SECRET }
                });
                if (!tokenResponse.ok) throw new Error('خطا در دریافت توکن احراز هویت.');
                const { token } = await tokenResponse.json();

                // Step 2: Check if username exists
                const checkUserResponse = await fetch(`${PROXY_URL}?path=users/${username}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'X-User-Username': username
                    }
                });
                if (!checkUserResponse.ok) throw new Error('خطا در بررسی نام کاربری.');
                
                const responseText = await checkUserResponse.text();
                const existingUser = responseText ? JSON.parse(responseText) : null;
                
                if (existingUser && Object.keys(existingUser).length > 0 && existingUser.username) {
                    throw new Error('این نام کاربری قبلاً استفاده شده است. لطفاً نام دیگری انتخاب کنید.');
                }
                
                // Step 3: Prepare user data (Updated for Account Types & Coins)
                const now = new Date().toISOString();
                
                // --- NEW: User Data Structure for Account Levels ---
                const userData = {
                    username: username,
                    displayName: displayName,
                    mobile: allInputs.mobile.value.trim(),
                    age: parseInt(allInputs.age.value),
                    gender: allInputs.gender.value,
                    password: allInputs.password.value, 
                    profilePicUrl: profilePicUrl || '', 
                    createdAt: now,
                    isOnline: false,
                    lastSeen: now,
                    
                    // --- فیلدهای جدید مربوط به سطح اکانت و اقتصاد ---
                    accountType: 'regular', // default: regular, special, premium
                    coins: 0,
                    subscriptionExpireAt: 0,
                    
                    // --- فیلدهای کنترل محدودیت ---
                    limits: {
                        chatsStartedThisWeek: 0,
                        lastChatReset: Date.now(), // Timestamp for weekly reset logic
                        likesToday: 0,
                        lastLikeDate: new Date().toDateString(), // e.g. "Fri Nov 28 2025" for easy daily check
                        postsThisWeek: 0,
                        lastPostReset: Date.now()
                    },
                    
                    // --- فیلدهای سیستم اعتبار و گزارش ---
                    reputationScore: 0,
                    reportCount: 0,
                    profilePicStatus: 'pending', // Regular accounts need approval
                    profilePicUploadedAt: Date.now()
                };

                // Step 4: Register the user (PUT request)
                const registerResponse = await fetch(`${PROXY_URL}?path=users/${username}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}`,
                        'X-User-Username': username
                    },
                    body: JSON.stringify(userData)
                });
                
                if (!registerResponse.ok) {
                    const errorData = await registerResponse.json().catch(() => ({}));
                    throw new Error(errorData.error || 'خطا در ثبت نهایی اطلاعات.');
                }
                
                // Step 5: Success
                localStorage.setItem('currentUser', JSON.stringify({
                    username: userData.username,
                    displayName: userData.displayName,
                    accountType: userData.accountType // Keep account type in local storage for quick UI adjustments
                }));
                
                setFormStatus('ثبت‌نام موفق بود! در حال انتقال به صفحه اصلی...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'safe_asli.html';
                }, 2000);

            } catch (error) {
                setFormStatus(error.message, 'error');
                submitBtn.disabled = false;
            } finally {
                // Remove loading state only if there was an error, otherwise we are redirecting
                if (!document.querySelector('.status-message.success')) {
                    submitBtn.querySelector('.spinner').style.display = 'none';
                    submitBtn.querySelector('span').style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
