<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پیام‌رسان همیار - پیشرفته</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');

        /* --- Variables and Basic Setup --- */
        :root {
            --background-color: #0D1117;
            --primary-color: #00A3FF;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --notification-badge: #FF4D4D;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --profile-card-bg: #1B212A;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Main App Structure --- */
        .app-container {
            width: 100%; max-width: 420px; height: 100%; margin: 0 auto;
            background-color: var(--secondary-color); display: flex; flex-direction: column;
            box-shadow: 0 0 40px var(--shadow-dark); position: relative;
            border-radius: 20px; overflow: hidden;
        }

        /* --- Header --- */
        .app-header {
            padding: 18px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); flex-shrink: 0;
            position: sticky; top: 0; z-index: 50;
        }
        .app-header h1 {
            font-size: 1.8em; margin: 0; color: var(--primary-color);
            text-shadow: 0 0 8px rgba(0, 163, 255, 0.4);
        }

        /* --- Main Content Area --- */
        main { flex-grow: 1; position: relative; overflow-y: auto; }
        .chat-list { padding: 0; }
        .chat-item {
            display: flex; align-items: center; padding: 15px 20px; cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease-out;
            border-bottom: 1px solid var(--border-color);
        }
        .chat-item:hover { background-color: var(--secondary-hover); transform: scale(1.01); }
        .profile-picture {
            width: 60px; height: 60px; border-radius: 50%; margin-left: 15px;
            object-fit: cover; flex-shrink: 0;
        }
        .chat-details { flex-grow: 1; overflow: hidden; }
        .chat-details h3 {
            margin: 0; font-size: 1.2em; font-weight: 700;
            white-space: nowrap; display: flex; align-items: center;
        }
        .last-message {
            margin: 4px 0 0; font-size: 0.95em; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .verified-tick { width: 18px; height: 18px; margin-right: 6px; }
        
        /* --- Loading and Status --- */
        .status-container {
            display: flex; justify-content: center; align-items: center; height: 100%;
            flex-direction: column; color: var(--text-secondary); text-align: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--secondary-hover);
            border-top-color: var(--primary-color); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Footer Navigation --- */
        .main-footer {
            padding: 10px 0; border-top: 1px solid var(--border-color); display: flex;
            justify-content: space-around; background-color: var(--secondary-color);
            flex-shrink: 0; z-index: 10;
        }
        .nav-btn {
            background: none; border: none; cursor: pointer; color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.2s ease;
        }
        .nav-btn.active { color: var(--primary-color); }
        
        /* --- Base Overlay & Card Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            width: 90%; max-width: 380px; background-color: var(--profile-card-bg);
            border-radius: 20px; box-shadow: 0 10px 40px var(--shadow-dark);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        /* --- Profile View Overlay --- */
        .profile-view .profile-card { overflow: hidden; display: flex; flex-direction: column; }
        .profile-view .close-btn {
            position: absolute; top: 15px; left: 15px; z-index: 10; width: 40px; height: 40px;
            border-radius: 50%; background-color: rgba(44, 47, 51, 0.8); border: none;
            cursor: pointer; color: var(--text-primary); display: flex; justify-content: center;
            align-items: center; transition: all 0.3s ease;
        }
        .profile-view .close-btn:hover { background-color: var(--primary-color); transform: rotate(90deg); }
        .profile-view .profile-header { position: relative; padding-bottom: 70px; }
        .profile-view .profile-main-pic-container {
            position: absolute; bottom: -70px; right: 50%; transform: translateX(50%); z-index: 5;
            background: var(--profile-card-bg); border-radius: 50%; padding: 5px;
        }
        .profile-view .profile-main-pic {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-color);
        }
        .profile-view .profile-content { padding: 80px 20px 20px; text-align: center; }
        .profile-view .profile-content h3 { margin: 0; font-size: 1.6em; color: var(--primary-color); }
        .profile-view .profile-content p { margin: 5px 0 20px; color: var(--text-secondary); }
        .profile-view .profile-bio { font-size: 0.95em; line-height: 1.6; color: var(--text-primary); }
        .profile-view .profile-actions {
            list-style: none; padding: 0; margin-top: 30px; background-color: var(--secondary-color);
            border-radius: 15px; overflow: hidden;
        }
        .profile-view .profile-actions li {
            display: flex; align-items: center; padding: 15px 20px; cursor: pointer;
            transition: all 0.2s ease-out; border-bottom: 1px solid var(--border-color);
        }
        .profile-view .profile-actions li:last-child { border-bottom: none; }
        .profile-view .profile-actions li:hover { background-color: var(--secondary-hover); }
        .profile-view .profile-actions li svg { margin-left: 15px; color: var(--primary-color); }
        .profile-view #logout-btn { color: var(--notification-badge); }
        .profile-view #logout-btn svg { color: var(--notification-badge); }
        
        /* --- Edit Profile Modal Styles --- */
        .edit-profile-modal .modal-card { padding: 25px; text-align: right; }
        .edit-profile-modal .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }
        .edit-profile-modal h2 { margin: 0; font-size: 1.5em; color: var(--primary-color); }
        .edit-profile-form .input-group { margin-bottom: 20px; }
        .edit-profile-form label {
            display: block; font-size: 0.9em; color: var(--text-secondary); margin-bottom: 8px;
        }
        .edit-profile-form input, .edit-profile-form textarea {
            width: 100%; background-color: var(--secondary-color); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px 15px; color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif; font-size: 1em; transition: all 0.3s;
        }
        .edit-profile-form textarea { resize: vertical; min-height: 80px; }
        .edit-profile-form input:focus, .edit-profile-form textarea:focus {
            outline: none; border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 163, 255, 0.2);
        }
        .image-uploader {
            display: flex; align-items: center; gap: 20px; margin-bottom: 25px;
        }
        .image-uploader .preview {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--border-color); cursor: pointer; transition: border-color 0.3s;
        }
        .image-uploader .preview:hover { border-color: var(--primary-color); }
        .upload-btn {
            background-color: var(--secondary-hover); color: var(--text-primary);
            border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;
            font-family: 'Vazirmatn', sans-serif; transition: background-color 0.3s;
        }
        .upload-progress {
            width: 100%; height: 5px; background-color: var(--border-color);
            border-radius: 2.5px; overflow: hidden; display: none; margin-top: 10px;
        }
        .upload-progress-bar {
            width: 0%; height: 100%; background-color: var(--success-color);
            transition: width 0.3s ease-in-out;
        }
        .username-check-container { position: relative; }
        .username-status {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 5px; font-size: 0.8em;
        }
        .username-status .spinner-small {
            width: 16px; height: 16px; border: 2px solid var(--text-secondary);
            border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .username-status.available { color: var(--success-color); }
        .username-status.taken { color: var(--notification-badge); }
        .username-status.checking { color: var(--warning-color); }
        .modal-footer { display: flex; gap: 10px; margin-top: 30px; }
        .modal-footer button {
            flex-grow: 1; padding: 12px; border: none; border-radius: 8px; font-family: 'Vazirmatn', sans-serif;
            font-size: 1em; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .modal-footer .save-btn { background-color: var(--primary-color); color: white; }
        .modal-footer .save-btn:disabled { background-color: var(--secondary-hover); cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header"><h1>همیار</h1></header>
        <main id="main-content"></main>
        <footer class="main-footer">
            <button class="nav-btn" id="nav-profile-btn"><span>پروفایل</span></button>
            <button class="nav-btn active" id="nav-chats-btn"><span>چت‌ها</span></button>
        </footer>
    </div>

    <!-- Profile View Overlay -->
    <div class="modal-overlay profile-view" id="profile-overlay">
        <div class="modal-card">
            <button class="close-btn" id="close-profile-btn">&times;</button>
            <header class="profile-header">
                <div class="profile-main-pic-container">
                    <img class="profile-main-pic" id="profile-image" src="" alt="عکس پروفایل">
                </div>
            </header>
            <main class="profile-content">
                <h3 id="profile-display-name"></h3>
                <p id="profile-username"></p>
                <p class="profile-bio" id="profile-bio"></p>
                <ul class="profile-actions">
                    <li id="open-edit-profile-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span>ویرایش پروفایل</span>
                    </li>
                     <li id="logout-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        <span>خروج از حساب</span>
                    </li>
                </ul>
            </main>
        </div>
    </div>

    <!-- Edit Profile Overlay -->
    <div class="modal-overlay edit-profile-modal" id="edit-profile-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>ویرایش پروفایل</h2>
            </div>
            <form class="edit-profile-form" id="edit-profile-form" novalidate>
                <div class="image-uploader">
                    <img id="edit-profile-pic-preview" src="" alt="Preview" class="preview">
                    <div>
                        <button type="button" class="upload-btn" id="upload-new-pic-btn">تغییر عکس</button>
                        <div class="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>
                    </div>
                </div>
                <input type="file" id="edit-profile-pic-input" accept="image/*" style="display:none;">

                <div class="input-group">
                    <label for="edit-display-name">نام نمایشی</label>
                    <input type="text" id="edit-display-name" required>
                </div>
                <div class="input-group">
                    <label for="edit-username">نام کاربری (انگلیسی)</label>
                    <div class="username-check-container">
                        <input type="text" id="edit-username" required pattern="^[a-zA-Z0-9_]{3,15}$">
                        <div class="username-status" id="username-status"></div>
                    </div>
                </div>
                 <div class="input-group">
                    <label for="edit-bio">بیوگرافی</label>
                    <textarea id="edit-bio" placeholder="کمی درباره خودتان بنویسید..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="cancel-btn" id="cancel-edit-btn">انصراف</button>
                    <button type="submit" class="save-btn" id="save-profile-btn" disabled>ذخیره تغییرات</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        // --- SECTION: App Configuration ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const UPLOAD_ENDPOINT = 'https://miko.freehost.io/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_TICK_URL = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';
        
        // --- SECTION: DOM Element References ---
        const mainContent = document.getElementById('main-content');
        // Profile View
        const profileOverlay = document.getElementById('profile-overlay');
        const openProfileBtn = document.getElementById('nav-profile-btn');
        const closeProfileBtn = document.getElementById('close-profile-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const profileImage = document.getElementById('profile-image');
        const profileDisplayName = document.getElementById('profile-display-name');
        const profileUsername = document.getElementById('profile-username');
        const profileBio = document.getElementById('profile-bio');
        // Edit Profile
        const openEditProfileBtn = document.getElementById('open-edit-profile-btn');
        const editProfileOverlay = document.getElementById('edit-profile-overlay');
        const editProfileForm = document.getElementById('edit-profile-form');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const saveProfileBtn = document.getElementById('save-profile-btn');
        const editDisplayNameInput = document.getElementById('edit-display-name');
        const editUsernameInput = document.getElementById('edit-username');
        const editBioInput = document.getElementById('edit-bio');
        const editProfilePicPreview = document.getElementById('edit-profile-pic-preview');
        const uploadNewPicBtn = document.getElementById('upload-new-pic-btn');
        const editProfilePicInput = document.getElementById('edit-profile-pic-input');
        const uploadProgressContainer = document.querySelector('.upload-progress');
        const uploadProgressBar = document.getElementById('upload-progress-bar');
        const usernameStatusEl = document.getElementById('username-status');
        
        // --- SECTION: App State ---
        let currentUser = null;
        let clientToken = null;
        let allUsers = {};
        let recentChats = [];
        let pollingIntervalId = null; 
        let newProfilePicUrl = null;
        let usernameCheckTimeout = null;
        let isUsernameAvailable = true;
        let originalFormState = {};

        // --- SECTION: Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(storedUser);

            setupEventListeners();
            await loadInitialData();
        });

        function setupEventListeners() {
            openProfileBtn.addEventListener('click', showProfile);
            closeProfileBtn.addEventListener('click', hideProfile);
            logoutBtn.addEventListener('click', () => showCustomConfirm('آیا برای خروج مطمئن هستید؟', () => {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }));
            
            openEditProfileBtn.addEventListener('click', showEditProfileModal);
            cancelEditBtn.addEventListener('click', hideEditProfileModal);
            editProfileForm.addEventListener('submit', handleProfileSaveChanges);
            uploadNewPicBtn.addEventListener('click', () => editProfilePicInput.click());
            editProfilePicInput.addEventListener('change', handleNewProfilePicSelect);
            
            // Listen for changes in form to enable/disable save button
            [editDisplayNameInput, editUsernameInput, editBioInput].forEach(input => {
                input.addEventListener('input', updateSaveButtonState);
            });
            editUsernameInput.addEventListener('input', handleUsernameInput);
        }

        async function loadInitialData() {
            showLoadingSpinner();
            try {
                await refreshClientToken();
                const [usersResponse, chatsResponse] = await Promise.all([
                    apiRequest('users'), apiRequest('pivi_chats')
                ]);

                if (usersResponse) {
                    allUsers = usersResponse;
                    if (allUsers[currentUser.username]) {
                        currentUser = { ...currentUser, ...allUsers[currentUser.username] };
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    }
                }
                if (chatsResponse) {
                    recentChats = Object.values(chatsResponse).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                }
                renderChatList();
            } catch (error) {
                showErrorMessage(`خطا در بارگذاری: ${error.message}`);
            }
        }

        // --- SECTION: API & Data Fetching ---
        async function refreshClientToken() {
            const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            if (!response.ok) throw new Error('خطا در دریافت توکن.');
            clientToken = (await response.json()).token;
        }

        async function apiRequest(path, method = 'GET', body = null) {
            const options = { method, headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username } };
            if (body) { options.headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(body); }
            const response = await fetch(`${PROXY_URL}?path=${path}`, options);
            if (!response.ok) {
                const err = await response.json().catch(() => ({ error: `خطای سرور (${response.status})` }));
                throw new Error(err.error);
            }
            if (response.status === 204 || response.headers.get("content-length") === "0") return null;
            return response.json();
        }

        // --- SECTION: UI Rendering ---
        function renderChatList() {
            const userChats = recentChats.filter(chat => chat?.members?.[currentUser.username]);
            if (userChats.length === 0) {
                mainContent.innerHTML = '<div class="status-container"><p>هنوز گفتگویی ندارید.</p></div>';
                return;
            }
            mainContent.innerHTML = `<div class="chat-list">${userChats.map(chat => {
                const partnerUsername = Object.keys(chat.members).find(m => m !== currentUser.username);
                return allUsers[partnerUsername] ? createChatItemHtml(allUsers[partnerUsername], chat.lastMessage) : '';
            }).join('')}</div>`;
            mainContent.querySelectorAll('.chat-item').forEach(item => {
                item.addEventListener('click', () => window.location.href = `pivi.html?uid=${item.dataset.uid}`);
            });
        }
        function createChatItemHtml(partnerData, lastMessage) {
            const avatarUrl = partnerData.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(partnerData.displayName)}&background=00A3FF&color=fff&size=100`;
            const verifiedTick = partnerData.verified ? `<img class="verified-tick" src="${VERIFIED_TICK_URL}">` : '';
            return `<div class="chat-item" data-uid="${partnerData.username}">
                        <img src="${avatarUrl}" class="profile-picture">
                        <div class="chat-details"><h3>${partnerData.displayName}${verifiedTick}</h3><p class="last-message">${lastMessage || ''}</p></div>
                    </div>`;
        }
        function showLoadingSpinner() { mainContent.innerHTML = `<div class="status-container"><div class="spinner"></div></div>`; }
        function showErrorMessage(message) { mainContent.innerHTML = `<div class="status-container"><p>${message}</p></div>`; }

        // --- SECTION: Profile Modals Logic ---
        function showProfile() {
            if (!currentUser) return;
            const avatarUrl = currentUser.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName)}&background=0D1117&color=fff&size=150`;
            profileImage.src = avatarUrl;
            profileDisplayName.innerHTML = `${currentUser.displayName}${currentUser.verified ? `<img class="verified-tick" src="${VERIFIED_TICK_URL}">` : ''}`;
            profileUsername.textContent = `@${currentUser.username}`;
            profileBio.textContent = currentUser.bio || 'بیوگرافی ثبت نشده است.';
            profileOverlay.classList.add('active');
        }
        function hideProfile() { profileOverlay.classList.remove('active'); }

        function showEditProfileModal() {
            hideProfile();
            const avatarUrl = currentUser.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName)}&background=0D1117&color=fff&size=150`;
            editProfilePicPreview.src = avatarUrl;
            editDisplayNameInput.value = currentUser.displayName || '';
            editUsernameInput.value = currentUser.username || '';
            editBioInput.value = currentUser.bio || '';
            
            originalFormState = {
                displayName: editDisplayNameInput.value,
                username: editUsernameInput.value,
                bio: editBioInput.value,
                profilePicUrl: currentUser.profilePicUrl || null
            };
            
            newProfilePicUrl = null;
            uploadProgressContainer.style.display = 'none';
            usernameStatusEl.innerHTML = '';
            updateSaveButtonState(); // Initially disable save button
            editProfileOverlay.classList.add('active');
        }
        function hideEditProfileModal() { editProfileOverlay.classList.remove('active'); }
        
        // --- SECTION: Edit Profile Handlers ---
        function handleUsernameInput() {
            clearTimeout(usernameCheckTimeout);
            const newUsername = editUsernameInput.value.trim().toLowerCase();
            
            if (!/^[a-zA-Z0-9_]{3,15}$/.test(newUsername)) {
                updateUsernameStatus('error', 'نام کاربری نامعتبر است.');
                isUsernameAvailable = false;
                updateSaveButtonState();
                return;
            }
            if (newUsername === currentUser.username) {
                updateUsernameStatus('info', '');
                isUsernameAvailable = true;
                updateSaveButtonState();
                return;
            }
            
            updateUsernameStatus('checking', 'در حال بررسی...');
            isUsernameAvailable = false;
            
            usernameCheckTimeout = setTimeout(async () => {
                try {
                    const result = await apiRequest(`users/${newUsername}`);
                    if (result === null) {
                        updateUsernameStatus('available', 'در دسترس است!');
                        isUsernameAvailable = true;
                    } else {
                        updateUsernameStatus('taken', 'این نام کاربری قبلا گرفته شده.');
                        isUsernameAvailable = false;
                    }
                } catch (error) {
                    updateUsernameStatus('error', 'خطا در بررسی.');
                    isUsernameAvailable = false;
                } finally {
                    updateSaveButtonState();
                }
            }, 700); // Debounce for 700ms
        }

        function updateUsernameStatus(status, message) {
            usernameStatusEl.className = `username-status ${status}`;
            let icon = '';
            if (status === 'checking') icon = '<div class="spinner-small"></div>';
            if (status === 'available') icon = '✔';
            if (status === 'taken' || status === 'error') icon = '✖';
            usernameStatusEl.innerHTML = `${icon} <span>${message}</span>`;
        }

        function handleNewProfilePicSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => { editProfilePicPreview.src = event.target.result; }
            reader.readAsDataURL(file);
            uploadNewProfilePicture(file);
        }

        function uploadNewProfilePicture(file) {
            const formData = new FormData();
            formData.append('file', file);
            uploadProgressContainer.style.display = 'block';
            uploadProgressBar.style.width = '0%';
            saveProfileBtn.disabled = true;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_ENDPOINT, true);
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) uploadProgressBar.style.width = (e.loaded / e.total) * 100 + '%';
            };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    const res = JSON.parse(xhr.responseText);
                    if (res.success && res.url) {
                        newProfilePicUrl = res.url;
                        updateSaveButtonState();
                    } else alert('خطا در آپلود.');
                } else alert(`خطا در آپلود: ${xhr.statusText}`);
            };
            xhr.onerror = () => alert('خطای شبکه.');
            xhr.onloadend = () => { if(isFormValid()) saveProfileBtn.disabled = false; };
            xhr.send(formData);
        }

        function isFormValid() {
            return editDisplayNameInput.value.trim() && isUsernameAvailable;
        }

        function updateSaveButtonState() {
            const hasChanged = editDisplayNameInput.value !== originalFormState.displayName ||
                               editUsernameInput.value !== originalFormState.username ||
                               editBioInput.value !== originalFormState.bio ||
                               (newProfilePicUrl && newProfilePicUrl !== originalFormState.profilePicUrl);
            
            saveProfileBtn.disabled = !hasChanged || !isFormValid();
        }

        async function handleProfileSaveChanges(e) {
            e.preventDefault();
            if (saveProfileBtn.disabled) return;

            const newUsername = editUsernameInput.value.trim().toLowerCase();
            const oldUsername = currentUser.username;
            const usernameChanged = newUsername !== oldUsername;

            saveProfileBtn.disabled = true;
            saveProfileBtn.textContent = 'در حال ذخیره...';

            try {
                let updatedData = {
                    displayName: editDisplayNameInput.value.trim(),
                    bio: editBioInput.value.trim(),
                    profilePicUrl: newProfilePicUrl || currentUser.profilePicUrl || ""
                };

                if (usernameChanged) {
                    // Create a full new user object, preserving original data
                    const newUserObject = { ...currentUser, ...updatedData, username: newUsername };
                    delete newUserObject.password; // Never re-write password on update

                    // 1. Write new user data
                    await apiRequest(`users/${newUsername}`, 'PUT', newUserObject);
                    // 2. Delete old user data
                    await apiRequest(`users/${oldUsername}`, 'DELETE');
                    
                    currentUser = newUserObject;
                } else {
                    // Just update existing user data
                    await apiRequest(`users/${oldUsername}`, 'PATCH', updatedData);
                    currentUser = { ...currentUser, ...updatedData };
                }

                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                allUsers[newUsername] = currentUser;
                if (usernameChanged) delete allUsers[oldUsername];
                
                hideEditProfileModal();
                showProfile();
                renderChatList();
                alert('پروفایل با موفقیت به‌روزرسانی شد!');

            } catch (error) {
                alert(`خطا در ذخیره تغییرات: ${error.message}`);
            } finally {
                saveProfileBtn.disabled = false;
                saveProfileBtn.textContent = 'ذخیره تغییرات';
            }
        }
        
        function showCustomConfirm(message, onConfirm) {
            // This function creates and shows a custom confirmation dialog.
            // (Implementation is omitted for brevity but would be here)
            if (confirm(message)) {
                onConfirm();
            }
        }
    </script>
</body>
</html>
