<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - بارگذاری هوشمند</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.6);
            --text-color: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- مدیا --- */
        .media-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            /* ویدیو/عکس همیشه هست، اما زیر لایه سیاه پنهان است */
            object-fit: cover;
            background-size: cover;
            background-position: center;
        }

        /* --- لایه دایمر (تاریک‌کننده) --- */
        #smart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 2;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out; /* باز شدن نرم */
        }

        /* گرادینت پایین */
        #text-protection-gradient {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* --- کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            width: 85%; max-width: 400px;
            z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
            transition: opacity 0.5s;
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem;
        }

        #status-text { font-weight: 500; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%; height: 8px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: width 0.2s linear;
            position: relative;
        }

        .progress-fill::after {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        /* استایل مخفی شدن لودینگ در پایان */
        body.loaded #loader-container { opacity: 0; }
        body.exiting { transition: opacity 0.8s ease; opacity: 0; }

    </style>
</head>
<body>

    <!-- کانتینر عکس (برای فایل‌های غیر ویدیویی) -->
    <div id="bg-image" class="media-background" style="display:none;"></div>
    
    <!-- کانتینر ویدیو -->
    <!-- preload="auto": به مرورگر می‌گوید تا حد امکان دانلود کن -->
    <video id="bg-video" class="media-background" muted loop playsinline preload="auto" style="display:none;"></video>
    
    <!-- لایه تاریک -->
    <div id="smart-overlay"></div>
    <div id="text-protection-gradient"></div>

    <!-- لودینگ -->
    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">برقراری ارتباط...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // تنظیمات
        // ==========================================
        const CONFIG = {
            mediaUrl: 'https://cdn.imgurl.ir/uploads/q6997_vidu-video-3053216940160551.mp4',
            stayDelay: 1500 // زمان صبر بعد از لود کامل
        };

        // --- DOM Elements ---
        const bgImage = document.getElementById('bg-image');
        const bgVideo = document.getElementById('bg-video');
        const overlay = document.getElementById('smart-overlay');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        // متغیرهای کنترلی
        let currentProgress = 0;
        let isReadyToPlay = false;
        let simulationInterval;

        // تشخیص نوع فایل
        function getMediaType(url) {
            const ext = url.split('.').pop().toLowerCase().split('?')[0];
            return ['mp4', 'webm', 'ogg', 'mov', 'm4v'].includes(ext) ? 'video' : 'image';
        }

        // ==========================================
        // شروع منطق (بدون CORS)
        // ==========================================
        function init() {
            const type = getMediaType(CONFIG.mediaUrl);
            
            // شروع شبیه‌سازی نوار پیشرفت (تا زمانی که فایل آماده شود)
            startSimulation();

            if (type === 'video') {
                setupVideo();
            } else {
                setupImage();
            }
        }

        // --- 1. تنظیمات ویدیو ---
        function setupVideo() {
            bgVideo.style.display = 'block';
            bgVideo.src = CONFIG.mediaUrl;
            bgVideo.load(); // شروع دانلود توسط مرورگر

            // رویداد: وقتی مرورگر به اندازه کافی دانلود کرد که بتواند بدون توقف پخش کند
            bgVideo.addEventListener('canplaythrough', () => {
                isReadyToPlay = true;
            });

            // رویداد: برای اطمینان بیشتر، اگر فایل کوچک بود و زود لود شد
            bgVideo.addEventListener('loadeddata', () => {
                // اگر قبلاً در کش باشد، بلافاصله آماده می‌شود
                if (bgVideo.readyState >= 3) {
                    isReadyToPlay = true;
                }
            });

            // مدیریت خطا
            bgVideo.onerror = () => {
                console.warn("ویدیو لود نشد، ادامه می‌دهیم...");
                isReadyToPlay = true; // جلوگیری از گیر کردن
            };
        }

        // --- 2. تنظیمات عکس ---
        function setupImage() {
            bgImage.style.display = 'block';
            const img = new Image();
            img.src = CONFIG.mediaUrl;
            
            img.onload = () => {
                bgImage.style.backgroundImage = `url(${CONFIG.mediaUrl})`;
                isReadyToPlay = true;
            };
            
            img.onerror = () => {
                isReadyToPlay = true;
            };
        }

        // --- 3. شبیه‌سازی هوشمند نوار پیشرفت ---
        function startSimulation() {
            simulationInterval = setInterval(() => {
                // الف: اگر هنوز فایل آماده نیست
                if (!isReadyToPlay) {
                    // نوار را تا حدود 85% به آرامی جلو ببر
                    if (currentProgress < 30) currentProgress += 2; // سرعت شروع
                    else if (currentProgress < 70) currentProgress += 0.5; // سرعت وسط
                    else if (currentProgress < 85) currentProgress += 0.1; // خیلی کند در انتها
                    
                    updateStatusText(currentProgress);
                } 
                // ب: اگر فایل آماده شد (isReadyToPlay = true)
                else {
                    // با سرعت زیاد به 100 برسان
                    currentProgress += 5;
                }

                // رسم گرافیک
                updateVisuals(currentProgress);

                // پایان کار
                if (currentProgress >= 100) {
                    clearInterval(simulationInterval);
                    finishLoading();
                }
            }, 50);
        }

        function updateStatusText(p) {
            if (p < 20) statusText.textContent = "اتصال به سرور...";
            else if (p < 50) statusText.textContent = "دریافت اطلاعات...";
            else if (p < 80) statusText.textContent = "بافرینگ ویدیو...";
            else statusText.textContent = "آماده‌سازی نهایی...";
        }

        function updateVisuals(p) {
            const safeP = Math.min(100, p);
            progressFill.style.width = `${safeP}%`;
            percentText.textContent = `${Math.floor(safeP)}%`;
        }

        // --- 4. اتمام و نمایش ---
        function finishLoading() {
            statusText.textContent = "تکمیل شد.";
            
            // پخش ویدیو
            if (bgVideo.style.display !== 'none') {
                const playPromise = bgVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("پخش خودکار مسدود شد، صدا قطع می‌شود.");
                        bgVideo.muted = true;
                        bgVideo.play();
                    });
                }
            }

            // پاک کردن لایه تاریک (Fade Out)
            setTimeout(() => {
                overlay.style.opacity = '0'; // این باعث دیده شدن ویدیو می‌شود
                document.body.classList.add('loaded'); // لودینگ بار را مخفی کن
                
                // هدایت به صفحه بعد
                setTimeout(handleNavigation, CONFIG.stayDelay);
            }, 500);
        }

        // --- 5. نویگیشن ---
        function handleNavigation() {
            statusText.textContent = "در حال ورود...";
            document.body.classList.add('exiting');
            
            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        JSON.parse(storedUser);
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html';
                    }
                } else {
                    window.location.href = 'register.html';
                }
            }, 800);
        }

        window.addEventListener('load', init);

    </script>
</body>
</html>
