<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - پخش سریع</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.6);
            --text-color: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- مدیا --- */
        .media-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            object-fit: cover;
            background-size: cover;
            background-position: center;
        }

        /* --- لایه دایمر (پرده سیاه) --- */
        #smart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); /* رنگ مشکی مطلق */
            z-index: 2;
            pointer-events: none;
            opacity: 1; /* پیش‌فرض کاملا تاریک */
            /* ترنزیشن برای افکت "تاریک به روشن" */
            transition: opacity 1.5s ease-in-out; 
        }

        /* گرادینت پایین */
        #text-protection-gradient {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
            opacity: 0; /* پیش‌فرض مخفی، فقط در حالت لودینگ روشن می‌شود */
            transition: opacity 0.5s;
        }

        /* --- کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            width: 85%; max-width: 400px;
            z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
            
            /* پیش‌فرض مخفی است تا زمانی که مطمئن شویم کش نشده */
            opacity: 0; 
            visibility: hidden;
            transition: opacity 0.5s;
        }

        /* کلاس کمکی برای نمایش لودر */
        body.show-loader #loader-container { opacity: 1; visibility: visible; }
        body.show-loader #text-protection-gradient { opacity: 1; }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem;
        }

        #status-text { font-weight: 500; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%; height: 8px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: width 0.2s linear;
            position: relative;
        }
        
        /* افکت درخشش نوار */
        .progress-fill::after {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        /* استایل خروج */
        body.exiting { transition: opacity 0.8s ease; opacity: 0; }

    </style>
</head>
<body>

    <!-- مدیاها -->
    <div id="bg-image" class="media-background" style="display:none;"></div>
    <!-- preload="auto" بسیار مهم برای کش شدن -->
    <video id="bg-video" class="media-background" muted loop playsinline preload="auto" style="display:none;"></video>
    
    <!-- لایه تاریک -->
    <div id="smart-overlay"></div>
    <div id="text-protection-gradient"></div>

    <!-- لودینگ (پیش‌فرض مخفی) -->
    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">بررسی وضعیت...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            mediaUrl: 'https://cdn.imgurl.ir/uploads/n306759_InShot_20251127_013236096.mp4',
            stayDelay: 1500 // زمان صبر قبل از ریدایرکت (فقط برای حالت لودینگ)
        };

        const bgVideo = document.getElementById('bg-video');
        const bgImage = document.getElementById('bg-image');
        const overlay = document.getElementById('smart-overlay');
        const loaderContainer = document.getElementById('loader-container');
        const progressFill = document.getElementById('progress-fill');
        const percentText = document.getElementById('percent-text');
        const statusText = document.getElementById('status-text');

        let isVideoCached = false;
        let loadProgress = 0;
        let simulationInterval;

        // تشخیص نوع فایل
        function getMediaType(url) {
            const ext = url.split('.').pop().toLowerCase().split('?')[0];
            return ['mp4', 'webm', 'ogg', 'mov', 'm4v'].includes(ext) ? 'video' : 'image';
        }

        function init() {
            const type = getMediaType(CONFIG.mediaUrl);

            if (type === 'video') {
                handleVideoLogic();
            } else {
                handleImageLogic();
            }
        }

        function handleVideoLogic() {
            bgVideo.style.display = 'block';
            bgVideo.src = CONFIG.mediaUrl;
            
            // 1. شروع بارگیری
            bgVideo.load();

            // 2. چک کردن سریع وضعیت کش (جادوی اصلی)
            // ما 150 میلی ثانیه صبر می‌کنیم. اگر ویدیو آماده شد، یعنی کش بوده.
            // اگر نشد، نوار لودینگ را نشان می‌دهیم.
            const cacheCheckTimer = setTimeout(() => {
                if (bgVideo.readyState >= 3) {
                    // ویدیو خیلی سریع آماده شد (کش است)
                    triggerInstantPlay();
                } else {
                    // ویدیو هنوز آماده نیست (دانلود نیاز دارد)
                    startNormalLoading();
                }
            }, 150);

            // لیسنر برای وقتی که ویدیو آماده پخش شد
            bgVideo.oncanplaythrough = () => {
                // اگر تایمر هنوز اجرا نشده، یعنی خیلی سریع بوده
                if (bgVideo.readyState >= 3 && !document.body.classList.contains('show-loader')) {
                    clearTimeout(cacheCheckTimer);
                    triggerInstantPlay();
                } else {
                    // اگر در حالت نرمال لودینگ هستیم، تمامش کن
                    finishNormalLoading();
                }
            };
            
            // هندل کردن پخش خودکار
            bgVideo.onplay = () => {
                // ویدیو شروع شد، پرده را بردار
                overlay.style.opacity = '0';
            };
        }

        // --- حالت 1: پخش آنی (برای وقتی کش شده) ---
        function triggerInstantPlay() {
            console.log("Mode: Cached / Instant");
            // هیچ نوار لودینگی نشان نده
            
            // پخش ویدیو
            bgVideo.play().catch(() => {
                bgVideo.muted = true;
                bgVideo.play();
            });

            // شروع ریدایرکت (با کمی تاخیر برای لذت بردن از ویدیو)
            setTimeout(handleNavigation, 2500); 
        }

        // --- حالت 2: لودینگ معمولی (برای بار اول) ---
        function startNormalLoading() {
            console.log("Mode: Downloading");
            document.body.classList.add('show-loader'); // نمایش نوار لودینگ
            
            // شبیه‌سازی پیشرفت نوار تا زمانی که ویدیو لود شود
            simulationInterval = setInterval(() => {
                if (loadProgress < 85) {
                    // تا 85 درصد برو و منتظر باش
                    loadProgress += (Math.random() * 2); 
                    updateLoaderUI(loadProgress);
                }
            }, 50);
        }

        function finishNormalLoading() {
            // وقتی دانلود تمام شد
            clearInterval(simulationInterval);
            updateLoaderUI(100); // پر کردن آنی نوار
            statusText.textContent = "تکمیل شد.";

            // پخش ویدیو
            bgVideo.play().catch(() => { bgVideo.muted = true; bgVideo.play(); });

            // مخفی کردن نوار لودینگ
            setTimeout(() => {
                loaderContainer.style.opacity = '0';
                // رفتن به صفحه بعد
                setTimeout(handleNavigation, CONFIG.stayDelay);
            }, 500);
        }

        function updateLoaderUI(percent) {
            const p = Math.min(100, percent);
            progressFill.style.width = `${p}%`;
            percentText.textContent = `${Math.floor(p)}%`;
            
            if(p < 30) statusText.textContent = "اتصال...";
            else if(p < 80) statusText.textContent = "دریافت ویدیو...";
            else if(p < 100) statusText.textContent = "آماده‌سازی...";
        }

        // --- هندل کردن عکس (ساده) ---
        function handleImageLogic() {
            bgImage.style.display = 'block';
            const img = new Image();
            img.src = CONFIG.mediaUrl;
            
            // برای عکس همیشه لودینگ نشان میدهیم (مگر اینکه خیلی سریع باشد)
            const imgTimer = setTimeout(() => startNormalLoading(), 100);

            img.onload = () => {
                clearTimeout(imgTimer);
                bgImage.style.backgroundImage = `url(${CONFIG.mediaUrl})`;
                if(document.body.classList.contains('show-loader')) {
                    finishNormalLoading();
                } else {
                    overlay.style.opacity = '0';
                    setTimeout(handleNavigation, 2000);
                }
            };
        }

        // --- نویگیشن ---
        function handleNavigation() {
            // اگر هنوز در حال خروج نیستیم
            if (!document.body.classList.contains('exiting')) {
                document.body.classList.add('exiting');
                
                setTimeout(() => {
                    const storedUser = localStorage.getItem('currentUser');
                    if (storedUser) {
                        try {
                            JSON.parse(storedUser);
                            window.location.href = 'safe_asli.html';
                        } catch (e) {
                            localStorage.removeItem('currentUser');
                            window.location.href = 'register.html';
                        }
                    } else {
                        window.location.href = 'register.html';
                    }
                }, 800);
            }
        }

        window.addEventListener('load', init);

    </script>
</body>
</html>
