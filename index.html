<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - در حال بارگذاری</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117; /* رنگ پایه مشکی/سرمه‌ای */
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.6);
            --text-color: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- 1. لایه عکس پس‌زمینه --- */
        #bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* عکس از همان ابتدا هست، اما زیر لایه تاریک پنهان است */
        }

        /* --- 2. لایه دایمر (تاریک‌کننده) هوشمند --- */
        /* این لایه روی عکس قرار می‌گیرد و شفافیتش با جاوااسکریپت کم می‌شود */
        #smart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); /* شروع با رنگ کاملا تاریک */
            z-index: 2;
            pointer-events: none;
            /* ترنزیشن نرم برای تغییر روشنایی */
            transition: opacity 0.1s linear; 
        }

        /* یک لایه گرادینت ثابت برای خوانایی متن پایین */
        #text-protection-gradient {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* --- 3. کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* سایه متن برای خوانایی بهتر روی هر عکسی */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        #status-text { font-weight: 500; opacity: 1; transition: opacity 0.3s; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%;
            height: 8px; /* کمی ضخیم‌تر */
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: width 0.1s linear; /* حرکت همزمان با روشنایی */
            position: relative;
        }

        /* افکت برق زدن نوار */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        /* استایل خروج از صفحه */
        body.exiting #loader-container { opacity: 0; transition: opacity 0.5s; }
        body.exiting #text-protection-gradient { opacity: 0; transition: opacity 0.5s; }
        body.exiting { transition: opacity 0.8s ease; }

    </style>
</head>
<body>

    <!-- عکس پس‌زمینه -->
    <div id="bg-image"></div>
    
    <!-- لایه‌ای که با پر شدن نوار، شفاف می‌شود -->
    <div id="smart-overlay"></div>
    
    <!-- گرادینت پایین برای خوانایی متن -->
    <div id="text-protection-gradient"></div>

    <!-- نوار لودینگ -->
    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">در حال راه‌اندازی...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // تنظیمات
        // ==========================================
        const CONFIG = {
            bgUrl: 'https://cdn.imgurl.ir/uploads/q9812_file_6917756f1e1d68.57033147.jpg',
            stayDelay: 1200 // مکث نهایی وقتی ۱۰۰٪ شد
        };

        // --- DOM Elements ---
        const bgDiv = document.getElementById('bg-image');
        const overlay = document.getElementById('smart-overlay');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        // متغیرهای وضعیت
        let loadProgress = 0;
        let isImageLoaded = false;
        let simulationInterval;

        // --- 1. شروع فرآیند ---
        function startLoading() {
            // شروع دانلود عکس در حافظه (بدون مشکل CORS)
            const img = new Image();
            img.src = CONFIG.bgUrl;

            // وقتی عکس کامل دانلود شد
            img.onload = () => {
                isImageLoaded = true;
                // ست کردن عکس در پس‌زمینه
                bgDiv.style.backgroundImage = `url(${CONFIG.bgUrl})`;
            };

            // هندل کردن خطا (اگر عکس نبود، صفحه مشکی نماند)
            img.onerror = () => {
                console.warn("عکس لود نشد.");
                isImageLoaded = true; // فرض می‌کنیم لود شده تا نوار گیر نکند
            };

            // شروع نوار پیشرفت
            simulateProgress();
        }

        // --- 2. موتور شبیه‌سازی و آپدیت گرافیک ---
        function simulateProgress() {
            simulationInterval = setInterval(() => {
                // اگر عکس هنوز دانلود نشده است:
                if (!isImageLoaded) {
                    // تا حدود 85% سریع برو، اما اگر عکس نیامد کند شو
                    if (loadProgress < 60) {
                        loadProgress += 2;
                    } else if (loadProgress < 85) {
                        loadProgress += 0.5;
                    } else if (loadProgress < 95) {
                        loadProgress += 0.1; // خیلی کند منتظر دانلود می‌ماند
                    }
                    
                    // تغییر متن‌ها بر اساس درصد
                    if(loadProgress < 30) statusText.textContent = "اتصال به سرور...";
                    else if(loadProgress < 70) statusText.textContent = "در حال دریافت منابع گرافیکی...";
                    else statusText.textContent = "بارگذاری تصویر...";
                } 
                // اگر عکس دانلود شده است (یا خطا داده):
                else {
                    // با سرعت زیاد به سمت ۱۰۰ برو
                    loadProgress += 4;
                }

                // بروزرسانی گرافیکی
                updateVisuals(loadProgress);

                // پایان کار
                if (loadProgress >= 100) {
                    clearInterval(simulationInterval);
                    finishLoading();
                }
            }, 40); // سرعت رفرش انیمیشن
        }

        // --- 3. بروزرسانی ویژوال (جادوی اصلی) ---
        function updateVisuals(percent) {
            // اطمینان از اینکه از ۱۰۰ رد نشود
            const safePercent = Math.min(100, Math.max(0, percent));
            
            // 1. آپدیت عرض نوار
            progressFill.style.width = `${safePercent}%`;
            
            // 2. آپدیت عدد درصد
            percentText.textContent = `${Math.floor(safePercent)}%`;

            // 3. آپدیت شفافیت لایه تاریک (نکته کلیدی درخواست شما)
            // فرمول: درصد 0 -> شفافیت 1 (سیاه)
            // فرمول: درصد 100 -> شفافیت 0 (روشن)
            const opacity = 1 - (safePercent / 100);
            overlay.style.opacity = opacity;
        }

        // --- 4. پایان بارگذاری ---
        function finishLoading() {
            // اطمینان حاصل می‌کنیم که لایه تاریک کاملاً حذف شده باشد
            overlay.style.opacity = '0';
            statusText.textContent = "تکمیل شد.";
            
            // مکث کوتاه برای لذت بردن از تصویر کامل شده
            setTimeout(() => {
                statusText.textContent = "بررسی هویت کاربر...";
                
                // هدایت به صفحه بعد
                setTimeout(handleNavigation, 800);
            }, CONFIG.stayDelay);
        }

        // --- 5. ناوبری ---
        function handleNavigation() {
            document.body.classList.add('exiting');

            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        JSON.parse(storedUser);
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html';
                    }
                } else {
                    window.location.href = 'register.html';
                }
            }, 600);
        }

        // اجرا
        window.addEventListener('load', startLoading);

    </script>
</body>
</html>
