<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - دانلود و پخش از حافظه</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.6);
            --text-color: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- مدیا (پس‌زمینه) --- */
        .media-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0; /* ابتدا مخفی است تا زمانی که دانلود تمام شود */
            transition: opacity 1s ease-in;
        }

        #bg-image {
            background-size: cover;
            background-position: center;
        }

        #bg-video {
            object-fit: cover;
        }

        /* --- لایه دایمر (پوشش تاریک) --- */
        #smart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.8s ease-out; /* ترنزیشن نرم برای محو شدن */
        }

        /* گرادینت پایین */
        #text-protection-gradient {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* --- کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 50px; left: 50%;
            transform: translateX(-50%);
            width: 85%; max-width: 400px;
            z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem;
        }

        #status-text { font-weight: 500; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%; height: 8px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        /* استایل خروج */
        body.exiting #loader-container { opacity: 0; transition: opacity 0.5s; }
        body.exiting #text-protection-gradient { opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <!-- کانتینرها -->
    <div id="bg-image" class="media-background"></div>
    <video id="bg-video" class="media-background" muted loop playsinline></video>
    
    <!-- لایه تاریک -->
    <div id="smart-overlay"></div>
    <div id="text-protection-gradient"></div>

    <!-- لودینگ -->
    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">شروع دریافت فایل...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // تنظیمات
        // ==========================================
        const CONFIG = {
            // لینک فایل (ویدیو یا عکس)
            mediaUrl: 'https://cdn.imgurl.ir/uploads/q6997_vidu-video-3053216940160551.mp4', 
            
            // زمان مکث بعد از تکمیل دانلود و قبل از رفتن به صفحه بعد
            stayDelay: 2000 
        };

        // --- DOM Elements ---
        const bgImageDiv = document.getElementById('bg-image');
        const bgVideoEl = document.getElementById('bg-video');
        const overlay = document.getElementById('smart-overlay');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        // --- 1. تشخیص نوع فایل ---
        function getMediaType(url) {
            const extension = url.split('.').pop().toLowerCase().split('?')[0];
            const videoExts = ['mp4', 'webm', 'ogg', 'mov', 'm4v'];
            return videoExts.includes(extension) ? 'video' : 'image';
        }

        // --- 2. شروع دانلود واقعی (XHR) ---
        function downloadAndCacheMedia() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', CONFIG.mediaUrl, true);
            xhr.responseType = 'blob'; // درخواست به صورت باینری (Blob)

            // الف: رویداد پیشرفت دانلود
            xhr.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    updateVisuals(percentComplete);
                } else {
                    // اگر سرور حجم فایل را نگوید، یک پیشرفت تقریبی نشان میدهیم
                    statusText.textContent = "در حال بارگیری...";
                }
            };

            // ب: اتمام دانلود
            xhr.onload = () => {
                if (xhr.status === 200) {
                    // تبدیل فایل دانلود شده به یک URL داخلی
                    const blob = xhr.response;
                    const objectUrl = URL.createObjectURL(blob);
                    
                    // پر کردن نوار تا 100%
                    updateVisuals(100);
                    
                    // نمایش فایل از حافظه
                    renderMedia(objectUrl);
                } else {
                    statusText.textContent = "خطا در دانلود فایل.";
                    statusText.style.color = "red";
                }
            };

            // ج: مدیریت خطا
            xhr.onerror = () => {
                statusText.textContent = "خطا در اتصال به اینترنت.";
            };

            xhr.send();
        }

        // --- 3. بروزرسانی گرافیک نوار ---
        function updateVisuals(percent) {
            const safePercent = Math.min(100, Math.max(0, percent));
            
            progressFill.style.width = `${safePercent}%`;
            percentText.textContent = `${Math.floor(safePercent)}%`;

            // تغییر متن بر اساس درصد
            if (safePercent < 30) statusText.textContent = "دانلود داده‌ها...";
            else if (safePercent < 70) statusText.textContent = "ذخیره در حافظه موقت...";
            else if (safePercent < 100) statusText.textContent = "پردازش نهایی...";
            else statusText.textContent = "تکمیل شد.";
            
            // نکته مهم: اینجا اوپاسیتی را کم نمیکنیم چون هنوز ویدیو آماده پخش نیست
            // ویدیو وقتی پخش شد، دایمر را برمیداریم
        }

        // --- 4. نمایش مدیا (رندر کردن از Blob) ---
        function renderMedia(blobUrl) {
            const type = getMediaType(CONFIG.mediaUrl);

            if (type === 'video') {
                bgVideoEl.src = blobUrl;
                bgVideoEl.load(); // بارگذاری از حافظه
                
                // وقتی ویدیو آماده پخش شد
                bgVideoEl.oncanplay = () => {
                    bgVideoEl.play()
                        .then(() => {
                            revealContent(bgVideoEl); // نمایش
                        })
                        .catch(err => {
                            console.log("Auto-play blocked, playing muted");
                            bgVideoEl.muted = true;
                            bgVideoEl.play();
                            revealContent(bgVideoEl);
                        });
                };
            } else {
                // اگر عکس بود
                bgImageDiv.style.backgroundImage = `url(${blobUrl})`;
                // یک تاخیر کوتاه برای رندر عکس
                setTimeout(() => {
                    revealContent(bgImageDiv);
                }, 100);
            }
        }

        // --- 5. برداشتن پرده تاریک (انیمیشن نهایی) ---
        function revealContent(elementToShow) {
            // 1. المان مدیا را مرئی کن (زیر پرده تاریک)
            elementToShow.style.opacity = '1';

            // 2. پرده تاریک را به آرامی محو کن
            overlay.style.opacity = '0';
            
            // 3. آغاز شمارش معکوس برای رفتن به صفحه بعد
            setTimeout(() => {
                statusText.textContent = "آماده‌سازی ورود...";
                setTimeout(handleNavigation, 800);
            }, CONFIG.stayDelay);
        }

        // --- 6. نویگیشن ---
        function handleNavigation() {
            document.body.classList.add('exiting');
            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        JSON.parse(storedUser);
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html';
                    }
                } else {
                    window.location.href = 'register.html';
                }
            }, 600);
        }

        // اجرا هنگام لود صفحه
        window.addEventListener('load', downloadAndCacheMedia);

    </script>
</body>
</html>
