<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - در حال بارگذاری</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            /* پالت رنگی هماهنگ با safe_asli و pivi */
            --background-dark: #0D1117;
            --background-secondary: #161B22;
            --primary-color: #00A3FF; /* آبی همیار */
            --primary-glow: rgba(0, 163, 255, 0.4);
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --progress-bg: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(22, 27, 34, 0.85);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-dark);
            color: var(--text-primary);
        }

        /* --- پس‌زمینه --- */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at top left, #1a202c 0%, var(--background-dark) 80%);
            background-size: cover;
            background-position: center;
            transition: opacity 1s ease;
        }

        /* لایه تاریک روی عکس پس‌زمینه برای خوانایی بهتر */
        #bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.4); 
            backdrop-filter: blur(2px);
        }

        /* --- کانتینر اصلی لودینگ (پایین صفحه) --- */
        #bottom-loader-area {
            position: fixed;
            bottom: 40px; /* فاصله از پایین */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0; /* در ابتدا مخفی برای انیمیشن ورود */
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.3s;
        }

        /* --- نوار پیشرفت --- */
        .progress-track {
            width: 100%;
            height: 6px;
            background-color: var(--progress-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        /* افکت براق روی نوار پیشرفت */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        /* --- متن وضعیت و درصد --- */
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            padding: 0 5px;
        }

        #status-message {
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        #percentage {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--primary-color);
            direction: ltr;
        }

        /* --- انیمیشن‌ها --- */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* کلاس برای محو شدن صفحه هنگام خروج */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

    </style>
</head>
<body>

    <!-- کانتینر پس‌زمینه -->
    <div id="bg-container">
        <div id="bg-overlay"></div>
    </div>

    <!-- بخش لودر پایین صفحه -->
    <div id="bottom-loader-area">
        <div class="status-container">
            <span id="status-message">در حال راه‌اندازی...</span>
            <span id="percentage">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        // --- تنظیمات ---
        const CONFIG = {
            redirectDelay: 800, // تاخیر کوتاه بعد از 100 درصد شدن
            bgImage: 'https://cdn.imgurl.ir/uploads/q9812_file_6917756f1e1d68.57033147.jpg' // همان تصویر پس‌زمینه دارک شما
        };

        // --- عناصر DOM ---
        const progressBar = document.getElementById('progress-bar');
        const statusMsg = document.getElementById('status-message');
        const percentText = document.getElementById('percentage');
        const bgContainer = document.getElementById('bg-container');

        // --- بارگذاری تصویر پس‌زمینه ---
        function loadBackground() {
            // اگر تصویری تعریف شده باشد آن را ست می‌کند، در غیر این صورت از گرادینت CSS استفاده می‌شود
            if (CONFIG.bgImage) {
                const img = new Image();
                img.src = CONFIG.bgImage;
                img.onload = () => {
                    bgContainer.style.backgroundImage = `url(${CONFIG.bgImage})`;
                };
            }
        }

        // --- شبیه‌سازی مراحل بارگذاری (Task Runner) ---
        async function runLoadingSequence() {
            const steps = [
                { msg: "اتصال به سرور...", duration: 600, progress: 20 },
                { msg: "بررسی هویت کاربر...", duration: 800, progress: 45 },
                { msg: "دریافت اطلاعات کاربری...", duration: 700, progress: 70 },
                { msg: "آماده‌سازی رابط کاربری...", duration: 500, progress: 90 },
                { msg: "تکمیل شد.", duration: 300, progress: 100 }
            ];

            let currentProgress = 0;

            for (const step of steps) {
                // بروزرسانی متن
                statusMsg.style.opacity = '0';
                await delay(150);
                statusMsg.textContent = step.msg;
                statusMsg.style.opacity = '1';

                // شبیه‌سازی پر شدن نرم درصد
                const increment = step.progress - currentProgress;
                const stepDuration = step.duration;
                const intervalTime = 20;
                const stepsCount = stepDuration / intervalTime;
                const valuePerStep = increment / stepsCount;

                for (let i = 0; i < stepsCount; i++) {
                    currentProgress += valuePerStep;
                    // جلوگیری از رد شدن از 100
                    if (currentProgress > 100) currentProgress = 100;
                    
                    updateUI(currentProgress);
                    await delay(intervalTime);
                }
                
                // اطمینان از فیکس شدن روی عدد نهایی مرحله
                currentProgress = step.progress;
                updateUI(currentProgress);
            }

            // اتمام پروسه
            await delay(CONFIG.redirectDelay);
            handleRedirection();
        }

        // --- توابع کمکی ---
        function updateUI(progress) {
            const rounded = Math.round(progress);
            progressBar.style.width = `${progress}%`;
            percentText.textContent = `${rounded}%`;
        }

        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // --- منطق هدایت کاربر (Logic) ---
        function handleRedirection() {
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        // چک کردن صحت جیسون
                        JSON.parse(storedUser);
                        // هدایت به صفحه اصلی (چت)
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        // دیتای خراب
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html'; 
                    }
                } else {
                    // کاربر لاگین نیست
                    window.location.href = 'register.html';
                }
            }, 500); // صبر برای انیمیشن fade-out
        }

        // --- شروع برنامه ---
        window.addEventListener('load', () => {
            loadBackground();
            // یک تاخیر خیلی کوتاه برای اینکه انیمیشن‌های CSS درست اجرا شوند
            setTimeout(() => {
                runLoadingSequence();
            }, 100);
        });

    </script>
</body>
</html>
