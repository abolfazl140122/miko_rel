<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - در حال بارگذاری</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.6);
            --text-color: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- کانتینر مدیا (مشترک برای عکس و ویدیو) --- */
        .media-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* استایل مخصوص عکس */
        #bg-image {
            background-size: cover;
            background-position: center;
            display: none; /* پیش‌فرض مخفی */
        }

        /* استایل مخصوص ویدیو */
        #bg-video {
            object-fit: cover; /* باعث می‌شود ویدیو کل صفحه را پر کند بدون دفرمه شدن */
            display: none; /* پیش‌فرض مخفی */
        }

        /* --- لایه دایمر (تاریک‌کننده) هوشمند --- */
        #smart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.1s linear; 
        }

        /* گرادینت پایین صفحه */
        #text-protection-gradient {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* --- کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        #status-text { font-weight: 500; opacity: 1; transition: opacity 0.3s; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        body.exiting #loader-container { opacity: 0; transition: opacity 0.5s; }
        body.exiting #text-protection-gradient { opacity: 0; transition: opacity 0.5s; }
        body.exiting { transition: opacity 0.8s ease; }

    </style>
</head>
<body>

    <!-- کانتینر عکس -->
    <div id="bg-image" class="media-background"></div>
    
    <!-- کانتینر ویدیو (ویژگی‌ها: بی‌صدا، پخش خودکار، تکرار) -->
    <video id="bg-video" class="media-background" muted autoplay loop playsinline>
        Your browser does not support the video tag.
    </video>
    
    <!-- لایه تاریک‌کننده -->
    <div id="smart-overlay"></div>
    
    <!-- گرادینت پایین -->
    <div id="text-protection-gradient"></div>

    <!-- نوار لودینگ -->
    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">در حال راه‌اندازی...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // تنظیمات
        // ==========================================
        const CONFIG = {
            // لینک فایل (می‌تواند عکس jpg/png یا ویدیو mp4/webm باشد)
            // لینک نمونه ویدیو شما:
            mediaUrl: 'https://cdn.imgurl.ir/uploads/q6997_vidu-video-3053216940160551.mp4', 
            
            stayDelay: 1200 // مکث نهایی وقتی ۱۰۰٪ شد (میلی‌ثانیه)
        };

        // --- DOM Elements ---
        const bgImageDiv = document.getElementById('bg-image');
        const bgVideoEl = document.getElementById('bg-video');
        const overlay = document.getElementById('smart-overlay');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        // متغیرهای وضعیت
        let loadProgress = 0;
        let isMediaLoaded = false; // آیا مدیا (عکس یا ویدیو) دانلود شده؟
        let simulationInterval;

        // --- 1. تشخیص نوع فایل (ویدیو یا عکس) ---
        function getMediaType(url) {
            const extension = url.split('.').pop().toLowerCase().split('?')[0];
            const videoExts = ['mp4', 'webm', 'ogg', 'mov', 'm4v'];
            if (videoExts.includes(extension)) {
                return 'video';
            }
            return 'image';
        }

        // --- 2. شروع فرآیند ---
        function startLoading() {
            const type = getMediaType(CONFIG.mediaUrl);
            
            if (type === 'video') {
                handleVideoLoading();
            } else {
                handleImageLoading();
            }

            // شروع نوار پیشرفت همزمان با لود شدن مدیا
            simulateProgress();
        }

        // --- الف: لود کردن ویدیو ---
        function handleVideoLoading() {
            // نمایش تگ ویدیو و مخفی کردن عکس
            bgVideoEl.style.display = 'block';
            bgImageDiv.style.display = 'none';

            bgVideoEl.src = CONFIG.mediaUrl;
            
            // وقتی دیتای کافی برای پخش ویدیو دانلود شد
            bgVideoEl.onloadeddata = () => {
                isMediaLoaded = true;
                bgVideoEl.play().catch(e => console.log("Autoplay prevented:", e));
            };

            bgVideoEl.onerror = () => {
                console.warn("خطا در بارگذاری ویدیو.");
                isMediaLoaded = true; // جلوگیری از گیر کردن نوار
            };
        }

        // --- ب: لود کردن عکس ---
        function handleImageLoading() {
            // نمایش تگ عکس و مخفی کردن ویدیو
            bgImageDiv.style.display = 'block';
            bgVideoEl.style.display = 'none';

            const img = new Image();
            img.src = CONFIG.mediaUrl;

            img.onload = () => {
                isMediaLoaded = true;
                bgImageDiv.style.backgroundImage = `url(${CONFIG.mediaUrl})`;
            };

            img.onerror = () => {
                console.warn("عکس لود نشد.");
                isMediaLoaded = true;
            };
        }

        // --- 3. موتور شبیه‌سازی و آپدیت گرافیک ---
        function simulateProgress() {
            simulationInterval = setInterval(() => {
                // اگر مدیا هنوز دانلود نشده است:
                if (!isMediaLoaded) {
                    if (loadProgress < 60) {
                        loadProgress += 2;
                    } else if (loadProgress < 85) {
                        loadProgress += 0.5;
                    } else if (loadProgress < 95) {
                        loadProgress += 0.1;
                    }
                    
                    // متن‌های وضعیت
                    if(loadProgress < 30) statusText.textContent = "اتصال به سرور...";
                    else if(loadProgress < 70) statusText.textContent = "در حال دریافت فایل گرافیکی...";
                    else statusText.textContent = "پردازش رسانه...";
                } 
                // اگر مدیا دانلود شده است:
                else {
                    loadProgress += 4;
                }

                updateVisuals(loadProgress);

                if (loadProgress >= 100) {
                    clearInterval(simulationInterval);
                    finishLoading();
                }
            }, 40);
        }

        // --- 4. بروزرسانی ویژوال ---
        function updateVisuals(percent) {
            const safePercent = Math.min(100, Math.max(0, percent));
            
            // آپدیت نوار و عدد
            progressFill.style.width = `${safePercent}%`;
            percentText.textContent = `${Math.floor(safePercent)}%`;

            // آپدیت شفافیت لایه تاریک (نکته کلیدی: هر چه درصد بیشتر، شفاف‌تر)
            const opacity = 1 - (safePercent / 100);
            overlay.style.opacity = opacity;
        }

        // --- 5. پایان بارگذاری ---
        function finishLoading() {
            overlay.style.opacity = '0';
            statusText.textContent = "تکمیل شد.";
            
            setTimeout(() => {
                statusText.textContent = "خوش آمدید";
                setTimeout(handleNavigation, 800);
            }, CONFIG.stayDelay);
        }

        // --- 6. ناوبری ---
        function handleNavigation() {
            document.body.classList.add('exiting');

            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        JSON.parse(storedUser);
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html';
                    }
                } else {
                    window.location.href = 'register.html';
                }
            }, 600);
        }

        window.addEventListener('load', startLoading);

    </script>
</body>
</html>
