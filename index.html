<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همیار - در حال بارگذاری</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0D1117;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.5);
            --text-color: #E4E6EB;
            --bar-bg: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
        }

        /* --- پس‌زمینه --- */
        #bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0; /* مخفی تا زمانی که لود شود */
            transition: opacity 1.2s ease-in-out;
            z-index: 1;
        }

        /* لایه تاریک */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(13, 17, 23, 1) 0%, rgba(13, 17, 23, 0.4) 100%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        /* --- کانتینر لودینگ --- */
        #loader-container {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.5s ease;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        #status-text { font-weight: 500; opacity: 0.9; }
        #percent-text { font-weight: 700; color: var(--primary-color); direction: ltr; }

        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--bar-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
            transition: width 0.3s ease-out; /* نرم برای حرکت */
            position: relative;
        }

        /* افکت شاین روی نوار */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: translateX(-100%);
            animation: shine 1.5s infinite;
        }

        @keyframes shine { 100% { transform: translateX(100%); } }

        /* کلاس خروج */
        body.exiting #loader-container { opacity: 0; }
        body.exiting #overlay { opacity: 0; } /* حذف لایه تاریک هنگام خروج */
        body.exiting {
            transition: opacity 0.8s ease;
        }

    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="overlay"></div>

    <div id="loader-container">
        <div class="info-row">
            <span id="status-text">اتصال به سرور...</span>
            <span id="percent-text">0%</span>
        </div>
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        // --- تنظیمات ---
        const CONFIG = {
            bgUrl: 'https://cdn.imgurl.ir/uploads/q9812_file_6917756f1e1d68.57033147.jpg',
            stayDelay: 1500 // زمان توقف روی عکس قبل از رفتن به صفحه بعد (میلی ثانیه)
        };

        // --- DOM Elements ---
        const bgDiv = document.getElementById('bg-image');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        // متغیرهای وضعیت
        let loadProgress = 0;
        let isImageLoaded = false;
        let simulationInterval;

        // --- 1. شروع بارگذاری ---
        function startLoading() {
            // الف: شروع دانلود واقعی عکس توسط مرورگر
            const img = new Image();
            img.src = CONFIG.bgUrl;

            // ب: وقتی عکس واقعاً دانلود شد
            img.onload = () => {
                isImageLoaded = true;
                // تصویر را در پس‌زمینه ست می‌کنیم (هنوز مخفی است)
                bgDiv.style.backgroundImage = `url(${CONFIG.bgUrl})`;
            };

            // ج: مدیریت خطا (اگر عکس لود نشد)
            img.onerror = () => {
                console.warn("عکس لود نشد، ادامه بدون عکس");
                isImageLoaded = true; // می‌گوییم لود شد تا برنامه گیر نکند
            };

            // د: شروع شبیه‌سازی نوار پیشرفت همزمان با دانلود
            simulateProgress();
        }

        // --- 2. شبیه‌سازی پیشرفت ---
        function simulateProgress() {
            simulationInterval = setInterval(() => {
                // اگر عکس هنوز لود نشده، تا ۹۰٪ پیش برو و صبر کن
                if (!isImageLoaded) {
                    if (loadProgress < 60) {
                        loadProgress += Math.random() * 3; // سرعت اولیه خوب
                    } else if (loadProgress < 85) {
                        loadProgress += Math.random() * 1; // کند شدن
                    } else if (loadProgress < 92) {
                        loadProgress += 0.1; // خیلی کند شدن در انتها (انتظار برای دانلود)
                    }
                    // آپدیت متن‌ها
                    if (loadProgress > 20 && loadProgress < 50) statusText.textContent = "در حال دریافت منابع...";
                    else if (loadProgress > 50) statusText.textContent = "بارگذاری تصویر پس‌زمینه...";
                } 
                // اگر عکس لود شده است (isImageLoaded == true)
                else {
                    // سرعت را زیاد کن تا به ۱۰۰ برسد
                    loadProgress += 5;
                }

                updateUI(loadProgress);

                // پایان کار
                if (loadProgress >= 100) {
                    clearInterval(simulationInterval);
                    finishLoading();
                }
            }, 50); // آپدیت هر 50 میلی‌ثانیه
        }

        function updateUI(val) {
            const p = Math.min(100, Math.round(val));
            progressFill.style.width = `${p}%`;
            percentText.textContent = `${p}%`;
        }

        // --- 3. پایان بارگذاری و نمایش ---
        function finishLoading() {
            statusText.textContent = "تکمیل شد.";
            
            // نمایش عکس پس‌زمینه (Fade In)
            bgDiv.style.opacity = '1';
            
            // مکث برای دیدن عکس
            setTimeout(() => {
                statusText.textContent = "بررسی هویت کاربر...";
                
                // هدایت به صفحه بعد
                setTimeout(handleNavigation, 800);
            }, CONFIG.stayDelay);
        }

        // --- 4. منطق هدایت (Navigation) ---
        function handleNavigation() {
            document.body.classList.add('exiting'); // انیمیشن خروج

            setTimeout(() => {
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    try {
                        JSON.parse(storedUser);
                        window.location.href = 'safe_asli.html';
                    } catch (e) {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'register.html';
                    }
                } else {
                    window.location.href = 'register.html';
                }
            }, 800);
        }

        // اجرا هنگام باز شدن صفحه
        window.addEventListener('load', startLoading);

    </script>
</body>
</html>
