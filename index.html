<?php
// =========================================================
//  بخش منطق (PHP) - کنترل امنیت و بررسی رمز عبور
// =========================================================
session_start();

// مسیر فایل پسورد (یک پوشه عقب‌تر از فایل جاری)
$password_file_path = __DIR__ . '/../password_mikorel.php';

$error_message = '';
$show_loading_page = false;

// 1. بررسی آیا کاربر قبلاً وارد شده است؟
if (isset($_SESSION['auth_granted']) && $_SESSION['auth_granted'] === true) {
    $show_loading_page = true;
} 
// 2. بررسی درخواست ورود (زمانی که دکمه فرم زده می‌شود)
else if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['app_password'])) {
    
    // بررسی وجود فایل پسورد
    if (file_exists($password_file_path)) {
        // خواندن هش از فایل بیرونی
        $real_hash = include $password_file_path;
        
        // مقایسه رمز وارد شده با هش
        if (password_verify($_POST['app_password'], $real_hash)) {
            // رمز صحیح است
            $_SESSION['auth_granted'] = true;
            // رفرش صفحه برای جلوگیری از ارسال مجدد فرم
            header("Location: " . $_SERVER['PHP_SELF']);
            exit;
        } else {
            $error_message = 'رمز عبور اشتباه است!';
        }
    } else {
        $error_message = 'خطا: فایل پسورد یافت نشد (' . $password_file_path . ')';
    }
}

// اگر کاربر لاگین نکرده باشد، کد همینجا متوقف شده و فرم ورود را نشان می‌دهد
// اگر لاگین کرده باشد، متغیر $show_loading_page true می‌شود

<body>

    <div id="loading-container">
        <img src="https://raw.githubusercontent.com/abolfazl140122/miko_rel/c767edd7cb23c2f1a0314b935c515aa6b43c1905/%D9%84%D9%88%DA%AF%D9%88%20%D8%A7%D8%B3%DA%A9%D9%88%D8%B1%D8%AA%20%DA%AF%DB%8C%D9%85%20%D8%A8%D8%AF%D9%88%D9%86%20%D9%BE%D8%B3%20%D8%B2%D9%85%DB%8C%D9%86%D9%87.png" alt="لوگو اپلیکیشن همیار" id="logo">
        <p id="status-message">در حال بررسی وضعیت ورود...</p>
        <div id="spinner" class="spinner"></div>
    </div>

    <script>
        // --- CONFIG ---
        const REDIRECT_DELAY = 2000; // 2 ثانیه تاخیر قبل از هدایت کاربر

        // --- DOM Elements ---
        const statusMessageElement = document.getElementById('status-message');
        const spinnerElement = document.getElementById('spinner');

        // --- Main Logic ---
        function checkLoginStatus() {
            // از localStorage برای بررسی وجود اطلاعات کاربر استفاده می‌کنیم
            const storedUser = localStorage.getItem('currentUser');

            if (storedUser) {
                // کاربر قبلا با موفقیت وارد شده است
                try {
                    const user = JSON.parse(storedUser);
                    
                    // پیام خوش‌آمدگویی مجدد را نمایش می‌دهیم
                    statusMessageElement.textContent = `خوش آمدید مجدد، ${user.displayName || user.username}!`;
                    spinnerElement.style.display = 'none'; // اسپینر را مخفی می‌کنیم

                    // پس از تاخیر، کاربر را به صفحه اصلی هدایت می‌کنیم
                    setTimeout(() => {
                        window.location.href = 'safe_asli.html';
                    }, REDIRECT_DELAY);

                } catch (e) {
                    // اگر اطلاعات ذخیره شده معتبر نبود، آن را پاک کرده و به صفحه ثبت‌نام هدایت می‌کنیم
                    localStorage.removeItem('currentUser');
                    redirectToRegister();
                }

            } else {
                // کاربر وارد نشده یا برای اولین بار است که اپ را باز می‌کند
                redirectToRegister();
            }
        }
        
        function redirectToRegister() {
            // پیام خوش‌آمدگویی اولیه را نمایش می‌دهیم
            statusMessageElement.textContent = 'به همیار خوش آمدید!';
            spinnerElement.style.display = 'none'; // اسپینر را مخفی می‌کنیم

            // پس از تاخیر، کاربر را به صفحه ثبت‌نام هدایت می‌کنیم
            setTimeout(() => {
                window.location.href = 'register.html'; 
            }, REDIRECT_DELAY);
        }

        // اجرای تابع پس از بارگذاری کامل صفحه
        window.onload = checkLoginStatus;
    </script>
</body>
</html>
