<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار پیشرفته - نسخه بهبود یافته</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.4);
            --like-color: #ED4956;
            --modal-bg: #1C2128;
            --skeleton-base: #161B22;
            --skeleton-highlight: #21262d;
            --danger-color: #FF4D4D;
            --gold-color: #FFD700;
            --success-color: #00D26A;
            --warning-color: #FFB800;
        }

        *, *::before, *::after { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none;
            background: radial-gradient(circle at top left, #1a202c 0%, var(--background-color) 70%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            background-color: var(--background-color);
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header-area {
            background-color: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            flex-shrink: 0;
        }
        .header-title {
            font-size: 1.5rem; 
            font-weight: 900; margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 15px var(--primary-glow);
            letter-spacing: 0.5px;
            transition: transform 0.3s ease;
        }
        .header-btn {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; padding: 8px; transition: transform 0.2s, background-color 0.2s;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .header-btn:hover { background-color: rgba(0, 163, 255, 0.1); }
        .header-btn:active { transform: scale(0.85); background-color: var(--secondary-hover); }
        .header-btn svg { width: 28px; height: 28px; stroke-width: 2.5; }

        /* --- PULL TO REFRESH --- */
        .pull-indicator {
            position: absolute; top: 70px; left: 0; right: 0; height: 50px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; transition: transform 0.2s, opacity 0.2s; z-index: 10; opacity: 0;
        }
        .pull-spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--secondary-hover); 
            border-top-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .pull-spinner.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MAIN FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; 
            padding-bottom: 20px;
            scrollbar-width: none;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0; 
            animation: feedFadeIn 0.5s ease forwards;
        }
        @keyframes feedFadeIn { to { opacity: 1; } }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; padding-bottom: 10px;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* استایل‌های جدید برای پست طلایی */
        .post-card.golden-post {
            border-right: 4px solid var(--gold-color);
            border-left: 1px solid var(--gold-color);
            border-top: 1px solid var(--gold-color);
            border-bottom: 1px solid var(--gold-color);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.15);
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.05), transparent 30%);
            position: relative;
            overflow: hidden;
        }

        .post-card.golden-post::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .golden-post .username::before {
            content: '👑';
            margin-left: 8px;
            font-size: 1rem;
            filter: drop-shadow(0 0 4px var(--gold-color));
            vertical-align: middle;
            padding-bottom: 4px;
            animation: crownGlow 2s infinite alternate;
        }

        @keyframes crownGlow {
            from { filter: drop-shadow(0 0 4px var(--gold-color)); }
            to { filter: drop-shadow(0 0 8px var(--gold-color)); }
        }

        .post-header { 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: relative;
        }
        .user-info { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: transform 0.2s ease;
        }
        .user-info:hover { transform: translateX(-5px); }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s, transform 0.3s;
            background-color: var(--secondary-hover);
        }
        .post-card:hover .user-avatar { 
            border-color: var(--primary-color); 
            transform: scale(1.05); 
        }

        .username { 
            font-weight: 700; font-size: 0.95rem; color: var(--text-primary); 
            display: flex; align-items: center; gap: 4px;
        }
        .verified-tick {
            width: 16px; height: 16px;
            filter: drop-shadow(0 0 4px var(--primary-glow));
            vertical-align: sub;
        }
        
        .post-options { 
            color: var(--text-secondary); 
            cursor: pointer; 
            padding: 8px; 
            border-radius: 50%; 
            transition: all 0.2s ease;
        }
        .post-options:hover { 
            background-color: var(--secondary-hover); 
            color: var(--text-primary); 
            transform: rotate(90deg);
        }
        .post-options:active { transform: scale(0.9) rotate(90deg); }
        .post-options.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

        /* --- MEDIA CONTAINER & LOADING BLUR --- */
        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 300px; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        .media-loader-placeholder {
            position: absolute; inset: 0;
            background-color: var(--secondary-color);
            display: flex; align-items: center; justify-content: center;
            z-index: 2; transition: opacity 0.5s ease;
        }
        .media-loader-placeholder.loaded { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .post-media { 
            width: 100%; height: auto; max-height: 580px; object-fit: contain; display: block;
            opacity: 0; transition: opacity 0.5s ease-in; 
        }
        .post-media.loaded { opacity: 1; }
        
        video.post-media { object-fit: contain; max-height: 600px; }

        /* --- VIDEO CONTROLS --- */
        .video-overlay-controls {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 6;
            transition: opacity 0.3s;
            opacity: 0.7;
        }
        .video-overlay-controls:hover { opacity: 1; }
        .control-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 6px;
            transition: all 0.2s ease;
        }
        .control-btn:hover {
            background: rgba(0,0,0,0.8);
            transform: scale(1.1);
        }
        .control-btn svg { width: 100%; height: 100%; }
        
        .play-pause-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.4); border-radius: 50%;
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            z-index: 5; pointer-events: none; opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            backdrop-filter: blur(2px);
        }
        .play-pause-overlay.visible { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .play-pause-overlay svg { width: 30px; height: 30px; fill: white; }

        /* --- HEART ANIMATION --- */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0);
            color: #fff; font-size: 90px; pointer-events: none;
            z-index: 7; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            opacity: 0;
            text-shadow: 0 0 20px rgba(237, 73, 86, 0.7);
        }
        .heart-overlay.active { animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 
            30% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; } 
            45% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
        }

        .post-actions { 
            padding: 12px 15px 8px; 
            display: flex; 
            gap: 18px; 
            align-items: center; 
        }
        .action-btn { 
            background: none; 
            border: none; 
            color: var(--text-primary); 
            cursor: pointer; 
            padding: 0; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            position: relative;
            overflow: hidden;
        }
        .action-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 163, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
        .action-btn:active::after {
            width: 100px;
            height: 100px;
        }
        .action-btn svg { 
            width: 28px; 
            height: 28px; 
            stroke-width: 1.7; 
            transition: all 0.2s; 
        }
        .action-btn:active svg { transform: scale(0.8); }
        .action-btn.liked svg { 
            fill: var(--like-color); 
            stroke: var(--like-color); 
            animation: likePulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .action-btn-text { 
            font-size: 0.9rem; 
            font-weight: 500; 
            color: var(--text-primary); 
            transition: transform 0.2s;
        }
        .action-btn:hover .action-btn-text { transform: translateX(-3px); }
        @keyframes likePulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.25); } 
            100% { transform: scale(1); } 
        }

        .post-likes { 
            padding: 0 15px; 
            font-weight: 700; 
            font-size: 0.95rem; 
            margin-bottom: 6px; 
            width: fit-content; 
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .post-likes:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }
        .post-likes.clickable { cursor: pointer; }
        .post-likes.clickable:active { opacity: 0.6; }
        .post-likes.private { cursor: default; opacity: 0.7; }

        .post-caption { 
            padding: 0 15px 5px; 
            font-size: 0.95rem; 
            line-height: 1.5; 
            word-wrap: break-word; 
            transition: opacity 0.2s;
        }
        .caption-username { 
            font-weight: 700; 
            margin-left: 5px; 
            color: var(--primary-color);
        }
        .post-time { 
            font-size: 0.75rem; 
            color: var(--text-secondary); 
            margin-top: 6px; 
            display: block; 
            padding: 0 15px; 
            letter-spacing: 0.5px; 
        }

        /* --- SKELETON LOADER --- */
        #skeleton-loader {
            position: absolute; 
            top: 60px; 
            left: 0; 
            width: 100%; 
            height: calc(100% - 60px);
            background: var(--background-color); 
            z-index: 15; 
            overflow: hidden;
            display: block;
        }
        .sk-post { 
            margin-bottom: 20px; 
            background: var(--background-color); 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--border-color); 
        }
        .sk-header { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            gap: 10px; 
        }
        .sk-avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            background: var(--skeleton-base); 
        }
        .sk-name { 
            width: 120px; 
            height: 16px; 
            border-radius: 4px; 
            background: var(--skeleton-base); 
        }
        .sk-image { 
            width: 100%; 
            height: 380px; 
            background: var(--skeleton-base); 
        }
        .sk-actions { 
            height: 20px; 
            margin: 15px; 
            width: 40%; 
            background: var(--skeleton-base); 
            border-radius: 4px; 
        }
        
        .skeleton-animate { position: relative; overflow: hidden; }
        .skeleton-animate::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-highlight), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 
            0% { transform: translateX(-100%); } 
            100% { transform: translateX(100%); } 
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.8); 
            z-index: 1000; 
            opacity: 0; 
            visibility: hidden;
            transition: all 0.3s ease-in-out; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { 
            opacity: 1; 
            visibility: visible; 
        }
        
        .bottom-sheet { align-items: flex-end; }
        .sheet-card {
            background: var(--modal-bg); 
            width: 100%; 
            max-width: 480px; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px;
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 20px 0 0 0; 
            box-shadow: 0 -5px 40px rgba(0,0,0,0.6);
            display: flex; 
            flex-direction: column;
            max-height: 85vh; 
        }
        .modal-overlay.active .sheet-card { transform: translateY(0); }

        .sheet-drag-handle { 
            width: 40px; 
            height: 4px; 
            background: var(--border-color); 
            border-radius: 2px; 
            margin: 0 auto 15px; 
            flex-shrink: 0; 
        }

        .sheet-option {
            width: 100%; 
            padding: 16px 25px; 
            text-align: right; 
            background: none; 
            border: none;
            color: var(--text-primary); 
            font-size: 1rem; 
            font-family: 'Vazirmatn';
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s, transform 0.1s;
        }
        .sheet-option:last-child { border-bottom: none; }
        .sheet-option:hover { background-color: rgba(255,255,255,0.05); }
        .sheet-option:active { 
            background-color: var(--secondary-hover); 
            transform: translateX(-5px);
        }
        .sheet-option svg { 
            width: 22px; 
            height: 22px; 
            color: var(--text-secondary); 
            transition: transform 0.2s;
        }
        .sheet-option:hover svg { transform: scale(1.1); }
        .sheet-option.danger { color: var(--danger-color); font-weight: 700; }
        .sheet-option.danger svg { color: var(--danger-color); }

        /* Toggle Switch */
        .toggle-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
        }
        .switch { 
            position: relative; 
            display: inline-block; 
            width: 46px; 
            height: 26px; 
        }
        .switch input { 
            opacity: 0; 
            width: 0; 
            height: 0; 
        }
        .slider {
            position: absolute; 
            cursor: pointer; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            background-color: var(--secondary-hover); 
            transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 26px;
            border: 1px solid var(--border-color);
        }
        .slider:before {
            position: absolute; 
            content: ""; 
            height: 20px; 
            width: 20px; 
            left: 2px; 
            bottom: 2px;
            background-color: white; 
            transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 50%;
        }
        input:checked + .slider { 
            background-color: var(--primary-color); 
            border-color: var(--primary-color); 
        }
        input:checked + .slider:before { 
            transform: translateX(20px); 
        }

        /* Create Modal - بهبود یافته */
        .modal-card {
            background: var(--modal-bg); 
            width: 90%; 
            max-width: 450px; 
            border-radius: 16px;
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            transform: scale(0.9); 
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.active .modal-card { 
            transform: scale(1); 
            opacity: 1; 
        }
        
        .modal-header {
            padding: 15px; 
            border-bottom: 1px solid var(--border-color);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
            background: rgba(255,255,255,0.02);
        }
        .modal-title { 
            font-weight: 800; 
            margin: 0; 
            font-size: 1rem; 
            color: var(--text-primary); 
        }
        .share-btn { 
            color: var(--primary-color); 
            font-weight: 700; 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.2s; 
            padding: 8px 16px;
            border-radius: 8px;
        }
        .share-btn:hover:not(:disabled) { 
            background: rgba(0, 163, 255, 0.1); 
        }
        .share-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        .close-modal { 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.5rem; 
            line-height: 1; 
            padding: 0 5px; 
            transition: transform 0.2s;
        }
        .close-modal:hover { 
            transform: rotate(90deg); 
        }
        
        .modal-body { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-height: 70vh; 
            overflow-y: auto; 
            flex-grow: 1;
        }
        .upload-area {
            border: 2px dashed var(--border-color); 
            border-radius: 12px;
            padding: 40px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s;
            background: rgba(255,255,255,0.01);
        }
        .upload-area:hover { 
            border-color: var(--primary-color); 
            background: rgba(0, 163, 255, 0.05); 
            transform: translateY(-2px);
        }
        .upload-area:active { 
            border-color: var(--primary-color); 
            background: rgba(0, 163, 255, 0.1); 
            transform: translateY(0);
        }
        .upload-area svg { 
            width: 48px; 
            height: 48px; 
            color: var(--text-secondary); 
            margin-bottom: 10px; 
        }
        
        .upload-preview { 
            width: 100%; 
            max-height: 300px; 
            object-fit: contain; 
            border-radius: 8px; 
            display: none; 
            background: #000; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        /* پیش‌نمایش بهبود یافته */
        .preview-container {
            position: relative;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        
        .preview-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .preview-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .preview-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .preview-btn:hover {
            background: var(--primary-color);
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .caption-input {
            width: 100%; 
            background: var(--secondary-color); 
            border: 1px solid var(--border-color); 
            color: var(--text-primary);
            padding: 12px; 
            border-radius: 10px; 
            font-family: 'Vazirmatn'; 
            resize: none; 
            min-height: 90px;
            transition: border-color 0.2s;
        }
        .caption-input:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 2px rgba(0, 163, 255, 0.2);
        }
        
        .progress-bar-container { 
            width: 100%; 
            height: 6px; 
            background: var(--secondary-color); 
            border-radius: 3px; 
            margin-top: 10px; 
            display: none; 
            overflow: hidden; 
        }
        .progress-bar { 
            width: 0%; 
            height: 100%;

            overflow-y: auto; 
            padding: 0; 
            flex-grow: 1; 
        }

            display: flex; 
            align-items: center; 
            padding: 12px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
        }
        .user-list-item:hover { 
            background-color: var(--secondary-hover); 
            transform: translateX(-5px);
        }
        .user-list-item:active { 
            background-color: var(--secondary-hover); 
            transform: translateX(-5px) scale(0.98);
        }
        .user-list-item img {

            height: 44px;

            font-size: 0.95rem; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            color: var(--text-primary); 
        }
        .user-list-info p { 
            margin: 3px 0 0; 
            font-size: 0.8rem; 
            color: var(--text-secondary); 
        }
        .user-list-info .verified-tick { 
            width: 14px; 
            height: 14px; 
            vertical-align: middle; 
        }

        /* --- COMMENTS MODAL STYLES --- */
        .comments-list-content {
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 0 0 70px 0;
            min-height: 200px;
        }
        .comment-item {
            display: flex; 
            gap: 12px; 
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
            position: relative;
            transition: background 0.2s;
        }
        .comment-item:hover {
            background: rgba(255,255,255,0.02);
        }
        .comment-item.pinned {
            background: rgba(255, 215, 0, 0.05);
            border-right: 3px solid var(--gold-color);
        }
        .comment-avatar {
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            object-fit: cover;
            border: 1px solid var(--border-color); 
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .comment-item:hover .comment-avatar {
            transform: scale(1.1);
        }
        .comment-content { 
            flex: 1; 
            font-size: 0.9rem; 
            line-height: 1.4; 
        }
        .comment-header { 
            margin-bottom: 2px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            flex-wrap: wrap; 
        }
        .comment-username { 
            font-weight: 700; 
            color: var(--text-primary); 
            font-size: 0.85rem; 
        }
        .comment-text { 
            color: var(--text-primary); 
            font-weight: 400; 
            font-size: 0.9rem; 
            word-break: break-word; 
        }
        .comment-time { 
            font-size: 0.7rem; 
            color: var(--text-secondary); 
            margin-top: 4px; 
            display: block; 
        }
        
        .pin-icon { 
            width: 14px; 
            height: 14px; 
            fill: var(--gold-color); 
            margin-right: 5px; 
            transform: rotate(45deg); 
        }
        
        .comment-actions-btn {
            position: absolute; 
            left: 10px; 
            top: 10px;
            background: none; 
            border: none; 
            color: var(--text-secondary);
            padding: 5px; 
            cursor: pointer;
        }
        
        /* Comment Option Sheet */
        .comment-option-menu {
            display: flex; 
            gap: 10px; 
            margin-top: 5px;
        }
        .mini-btn {
            background: none; 
            border: none; 
            font-size: 0.75rem; 
            cursor: pointer; 
            padding: 2px 6px;
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            gap: 3px;
            transition: all 0.2s;
        }
        .mini-btn:hover {
            transform: translateY(-2px);
        }
        .btn-delete { 
            color: var(--danger-color); 
            background: rgba(255, 77, 77, 0.1); 
        }
        .btn-delete:hover { 
            background: rgba(255, 77, 77, 0.2); 
        }
        .btn-pin { 
            color: var(--gold-color); 
            background: rgba(255, 215, 0, 0.1); 
        }
        .btn-pin:hover { 
            background: rgba(255, 215, 0, 0.2); 
        }
        
        /* Comment Input Area */
        .comment-input-area {
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%;
            background-color: var(--modal-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex; 
            align-items: center; 
            gap: 10px;
            z-index: 20;
        }
        .comment-input-area.disabled { 
            filter: grayscale(1); 
            opacity: 0.7; 
            pointer-events: none; 
        }
        
        .comment-input-field {
            flex-grow: 1; 
            background: var(--secondary-color); 
            border: 1px solid var(--border-color);
            color: var(--text-primary); 
            padding: 10px 15px; 
            border-radius: 20px;
            font-family: 'Vazirmatn'; 
            font-size: 0.9rem; 
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .comment-input-field:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 2px rgba(0, 163, 255, 0.2);
        }
        .send-comment-btn {
            background: none; 
            border: none; 
            color: var(--primary-color);
            font-weight: 700; 
            cursor: pointer; 
            padding: 5px;
            opacity: 0.5; 
            transition: all 0.2s;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-comment-btn:hover {
            background: rgba(0, 163, 255, 0.1);
        }
        .send-comment-btn.active { 
            opacity: 1; 
            transform: scale(1.1);
        }

            width: 24px; 
            height: 24px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2; 
            transform: rotate(180deg); 
        }

        /* Comment Skeleton */
        .comment-skeleton { 
            display: flex; 
            gap: 12px; 
            padding: 12px 15px; 
        }
        .sk-c-avatar { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            background: var(--skeleton-base); 
            flex-shrink: 0; 
        }
        .sk-c-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            justify-content: center; 
        }
        .sk-c-line1 { 
            width: 30%; 
            height: 10px; 
            background: var(--skeleton-base); 
            border-radius: 4px; 
        }
        .sk-c-line2 { 
            width: 80%; 
            height: 10px; 
            background: var(--skeleton-base); 
            border-radius: 4px; 
        }

        .empty-state { 
            text-align: center; 
            padding: 50px 20px; 
            color: var(--text-secondary); 
        }
        
        /* Toast Notification */
        .toast {
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translate(-50%, 100px);
            background: var(--text-primary); 
            color: var(--background-color); 
            padding: 12px 24px; 
            border-radius: 50px;
            font-size: 0.95rem; 
            font-weight: 700; 
            z-index: 2000; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex; 
            align-items: center; 
            gap: 8px;
            white-space: nowrap;
        }
        .toast.error { 
            background: var(--danger-color); 
            color: white; 
        }
        .toast.success { 
            background: var(--success-color); 
            color: white; 
        }
        .toast.warning { 
            background: var(--warning-color); 
            color: white; 
        }
        .toast.active { 
            transform: translate(-50%, 0); 
        }

        /* Loader اضافی */
        .fullscreen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        .fullscreen-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loader-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* آیکون‌های جدید */
        .icon-check {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* انیمیشن‌های اضافی */
        @keyframes slideInUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* اسکرول بار سفارشی */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }
        
        /* استایل‌های رسپانسیو */
        @media (max-width: 480px) {
            .modal-card {
                width: 95%;
                max-height: 90vh;
            }
            
            .sheet-card {
                max-height: 90vh;
            }
            
            .post-media {
                max-height: 500px;
            }
            
            video.post-media {
                max-height: 500px;
            }
            
            .header-title {
                font-size: 1.3rem;
            }
        }
        
        @media (max-height: 700px) {
            .modal-card {
                max-height: 85vh;
            }
            
            .sheet-card {
                max-height: 85vh;
            }
        }
    </style>
</head>
<body>

        const fileInput = document.getElementById('file-input');

        const imagePreview = document.getElementById('image-preview');

        const editCaptionInput = document.getElementById('edit-caption-input');
        const progressBarContainer = document.getElementById('upload-progress-container');
        const progressBar = document.getElementById('upload-progress');

        // --- HELPERS ---
        function preparePostsArray(data) {
             return Object.entries(data)
                .map(([key, val]) => ({ id: key, ...val }))
                .sort((a, b) => {
                    const aIsGolden = a.isGolden === true;
                    const bIsGolden = b.isGolden === true;

                    if (aIsGolden && !bIsGolden) return -1;
                    if (!aIsGolden && bIsGolden) return 1;

                    // اگر هر دو یکسان بودند، بر اساس زمان مرتب کن
                    return new Date(b.timestamp) - new Date(a.timestamp);
                });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // --- VIDEO LOGIC ---
        function initVideoObserver() {
            const options = { root: null, rootMargin: '0px', threshold: 0.5 };
            videoObserver = new IntersectionObserver((entries) => {
                // اگر مدال آپلود باز است، هیچ ویدیویی را پخش نکن
                if (isCreateModalOpen) {
                    entries.forEach(entry => {
                        const video = entry.target;
                        if (!video.paused) video.pause();
                    });
                    return;
                }
                
                entries.forEach(entry => {
                    const video = entry.target;
                    const muteBtn = document.querySelector(`.mute-btn[data-for="${video.dataset.id}"]`);
                    if (entry.isIntersecting) {
                        video.muted = isGlobalMuted;
                        updateMuteIconUI(muteBtn, isGlobalMuted);
                        if (video.paused && !video.dataset.manualPause) {
                            video.play().catch(e => { 
                                video.muted = true; 
                                video.play().catch(console.log); 
                            });
                        }
                        // توقف سایر ویدیوها
                        document.querySelectorAll('video').forEach(v => { 
                            if (v !== video && !v.paused && !v.classList.contains('upload-preview')) v.pause(); 
                        });
                    } else {
                        if (!video.paused) video.pause();
                    }
                });
            }, options);
        }

        function toggleVideoPlay(vidId) {
            const video = document.getElementById(`video-${vidId}`);
            const overlay = document.getElementById(`play-icon-${vidId}`);
            if (video.paused) { 
                video.dataset.manualPause = ""; 
                video.play().then(() => {
                    overlay.classList.remove('visible');
                }).catch(e => {
                    video.muted = true;
                    video.play().then(() => overlay.classList.remove('visible'));
                }); 
            } else { 
                video.dataset.manualPause = "true"; 
                video.pause(); 
                overlay.classList.add('visible'); 
            }
        }

        function toggleMute(vidId, btn) {
            isGlobalMuted = !isGlobalMuted;
            document.querySelectorAll('video').forEach(vid => { 
                if (!vid.classList.contains('upload-preview')) {
                    vid.muted = isGlobalMuted; 
                }
            });
            document.querySelectorAll('.mute-btn').forEach(button => { 
                updateMuteIconUI(button, isGlobalMuted); 
            });
            window.event.stopPropagation();
        }

                : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;

        // --- VIDEO MANAGEMENT ---
        function pauseAllVideos() {

                }
            });

        function playVideosInView() {
            document.querySelectorAll('video').forEach(video => {
                if (video.dataset.wasPlaying === "true") {
                    delete video.dataset.wasPlaying;
                    const rect = video.getBoundingClientRect();
                    if (rect.top >= 0 && rect.bottom <= window.innerHeight) {
                        video.play().catch(e => console.log("Auto-play failed"));
                    }
                }
            });
        }

        // --- FILE & MODAL LOGIC ---
        function handleFileSelect(file) {
            // پاکسازی URL قبلی اگر وجود دارد
            if (previewVideoUrl) {
                URL.revokeObjectURL(previewVideoUrl);
                previewVideoUrl = null;
            }
            
            selectedFile = file;
            const reader = new FileReader();
            
            // نمایش اطلاعات فایل
            const fileTypeText = file.type.startsWith('video/') ? 'ویدیو' : 
                                file.type.startsWith('image/') ? 'تصویر' : 'فایل';
            fileType.textContent = fileTypeText;
            fileSize.textContent = formatFileSize(file.size);
            
            uploadTrigger.style.display = 'none';
            previewContainer.style.display = 'flex';
            
            if (file.type.startsWith('video/')) {
                imagePreview.style.display = 'none'; 
                videoPreview.style.display = 'block';
                videoControls.style.display = 'flex';
                
                previewVideoUrl = URL.createObjectURL(file);
                videoPreview.src = previewVideoUrl;
                videoPreview.muted = previewVideoMuted;
                previewMuteBtn.textContent = previewVideoMuted ? 'صدا دار' : 'بی‌صدا';
                
                // پخش خودکار ویدیو
                videoPreview.play().catch(e => {
                    console.log("Auto-play prevented, user interaction required");
                });
            } else {
                videoPreview.style.display = 'none'; 
                videoControls.style.display = 'none';
                imagePreview.style.display = 'block';
                reader.onload = (e) => imagePreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
            
            sharePostBtn.disabled = false;
            uploadStatus.textContent = 'فایل انتخاب شد. آماده انتشار.';
            uploadStatus.style.color = 'var(--success-color)';

        // --- NETWORK CORE ---
        async function refreshClientToken() {
            try {
                const response = await fetch(`${PROXY_URL}?auth=token`, { 
                    headers: { 'X-Proxy-Secret': SHARED_SECRET } 
                });
                if (!response.ok) throw new Error('Auth Failed');
                const data = await response.json();
                clientToken = data.token;
            } catch (e) { 
                console.error("Token error", e); 
                throw e; 
            }
        }

        async function fetchUsersCache() {
            if (!clientToken) await refreshClientToken();
            try {
                const response = await fetch(`${PROXY_URL}?path=users`, {
                    headers: { 
                        'Authorization': `Bearer ${clientToken}`, 
                        'X-User-Username': currentUser.username 
                    }
                });
                if (response.ok) {
                    allUsersCache = await response.json() || {};
                }
                return allUsersCache;
            } catch (e) { 
                console.warn("User cache error", e); 
                return {}; 
            }
        }

        // --- UPLOAD & CREATE POST ---
        async function handleUploadAndPost() {
            if (isUploading) return;
            
            if (!selectedFile) { 
                showToast('لطفاً یک فایل انتخاب کنید', 'error'); 
                return; 
            }
            
            isUploading = true;
            sharePostBtn.disabled = true; 
            sharePostBtn.textContent = 'در حال آپلود...';
            uploadStatus.textContent = 'در حال آپلود فایل...';
            uploadStatus.style.color = 'var(--warning-color)';
            progressBarContainer.style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_PHP_ENDPOINT, true);
            
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    progressBar.style.width = percent + '%';
                    
                    if (percent < 100) {
                        uploadStatus.textContent = `در حال آپلود: ${Math.round(percent)}%`;
                    }
                }
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (result.success && result.url) {
                            await createPostRecord(result.url, selectedFile.type.startsWith('video/') ? 'video' : 'image');
                        } else {
                            throw new Error(result.error || 'خطا در آپلود');
                        }
                    } catch (err) { 
                        showToast(err.message, 'error'); 
                        resetUploadState();
                    }
                } else { 
                    showToast('خطای سرور در آپلود', 'error'); 
                    resetUploadState();
                }
            };
            
            xhr.onerror = () => {
                showToast('خطا در ارتباط با سرور', 'error');
                resetUploadState();
            };
            
            xhr.send(formData);
        }
        
        function resetUploadState() {
            isUploading = false;
            sharePostBtn.disabled = false;
            sharePostBtn.textContent = 'انتشار';
            uploadStatus.textContent = 'خطا در آپلود. مجدداً تلاش کنید.';
            uploadStatus.style.color = 'var(--danger-color)';
        }

        async function createPostRecord(mediaUrl, type) {
            sharePostBtn.textContent = 'در حال ذخیره...';
            uploadStatus.textContent = 'در حال ذخیره پست...';
            
            const postData = {
                sender_username: currentUser.username,
                media_url: mediaUrl,
                type: type,
                caption: captionInput.value.trim(),
                timestamp: new Date().toISOString(),
                likes: {},
                show_likes: createPrivacyToggle.checked,
                comments_disabled: !createCommentsToggle.checked
            };

            if (currentUser.accountType === 'premium') {
                postData.isGolden = true;
            }

            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${clientToken}`, 
                        'X-User-Username': currentUser.username, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(postData)
                });
                
                if (response.ok) {
                    createModal.classList.remove('active');
                    isCreateModalOpen = false;
                    await fetchPosts(true);
                    showToast('پست با موفقیت منتشر شد', 'success');
                    resetModal();
                    setTimeout(() => {
                        playVideosInView();
                    }, 300);
                } else {
                    throw new Error('خطا در ذخیره پست');
                }
            } catch (err) { 
                showToast('خطا در انتشار پست', 'error'); 
                resetUploadState();
            }
        }

        // --- FEED LOGIC ---
        async function fetchPosts(shouldRender = true) {
            const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                headers: { 
                    'Authorization': `Bearer ${clientToken}`, 
                    'X-User-Username': currentUser.username 
                }
            });
            if (!response.ok && response.status !== 404) throw new Error("Fetch posts failed");
            const data = await response.json() || {};
            postsDataCache = data;
            localStorage.setItem(CACHE_KEY_FEED, JSON.stringify(data));
            if (shouldRender) renderFeed(preparePostsArray(data));
            return data;
        }

        function renderFeed(posts) {
            // توقف و حذف ویدیوهای قبلی
            document.querySelectorAll('video').forEach(v => { 
                v.pause(); 
                v.src = ""; 
                v.load(); 
                if (v.parentNode) v.parentNode.removeChild(v);

                    </div>
                `;
            } else {
                posts.forEach(post => {
                    const isOwner = post.sender_username === currentUser.username;
                    const user = allUsersCache[post.sender_username] || { 
                        displayName: post.sender_username, 
                        username: post.sender_username 
                    };
                    const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random&color=fff`;
                    const displayName = user.displayName || post.sender_username;
                    const isLiked = post.likes && post.likes[currentUser.username];
                    const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                    const commentCount = post.comments ? Object.keys(post.comments).length : 0;
                    const verifiedHtml = user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';

                    const canOpenList = isOwner || (post.show_likes !== false); 
                    const likesText = `${likeCount} پسند`;
                    const likesClass = canOpenList ? 'clickable' : 'private';
                    const likesClickAction = canOpenList ? `onclick="showLikesList('${post.id}', ${isOwner}, ${post.show_likes !== false})"` : '';

                    let mediaHtml = '';
                    const loadingOverlay = `<div class="media-loader-placeholder" id="loader-${post.id}"><div class="loading-spinner"></div></div>`;

                    if (post.type === 'video') {
                        mediaHtml = `
                            ${loadingOverlay}
                            <video class="post-media" id="video-${post.id}" data-id="${post.id}" src="${post.media_url}" loop playsinline muted onloadeddata="document.getElementById('loader-${post.id}').classList.add('loaded'); this.classList.add('loaded')"></video>
                            <div class="play-pause-overlay" id="play-icon-${post.id}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
                            <div class="video-overlay-controls">
                                <button class="control-btn mute-btn" data-for="${post.id}" onclick="toggleMute('${post.id}', this)">${isGlobalMuted ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>'}</button>
                            </div>

        async function startRealtimeUpdates() {
            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    headers: { 
                        'Authorization': `Bearer ${clientToken}`, 
                        'X-User-Username': currentUser.username 
                    }
                });
                if (!response.ok) return;
                const newData = await response.json() || {};
                if (JSON.stringify(newData) === JSON.stringify(postsDataCache)) return;

                postsDataCache = newData;
                localStorage.setItem(CACHE_KEY_FEED, JSON.stringify(newData));

                const domPosts = document.querySelectorAll('.post-card');
                domPosts.forEach(el => {
                    const pid = el.id.replace('post-', '');
                    if (!newData[pid]) { el.remove(); return; }
                    const post = newData[pid];
                    
                    // Update Likes
                    const likeCountEl = el.querySelector('.post-likes');
                    const isOwner = post.sender_username === currentUser.username;
                    const canOpenList = isOwner || (post.show_likes !== false);
                    const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                    likeCountEl.textContent = `${likeCount} پسند`;
                    if (canOpenList) {
                        likeCountEl.classList.add('clickable'); 
                        likeCountEl.classList.remove('private');
                        likeCountEl.setAttribute('onclick', `showLikesList('${pid}', ${isOwner}, true)`);
                    } else {
                        likeCountEl.classList.remove('clickable'); 
                        likeCountEl.classList.add('private');
                        likeCountEl.removeAttribute('onclick');
                    }
                    
                    // Update Comment Count
                    const commentCount = post.comments ? Object.keys(post.comments).length : 0;
                    const commentCountEl = el.querySelector('.action-btn-text');
                    if(commentCountEl) commentCountEl.textContent = commentCount > 0 ? commentCount : '';

                    // Update Caption
                    const capEl = el.querySelector('.caption-text');
                    if (capEl.textContent !== post.caption) capEl.textContent = post.caption;
                    
                    // Update Like Button
                    const likeBtn = el.querySelector('.action-btn');
                    const isLiked = post.likes && post.likes[currentUser.username];
                    if (isLiked) {
                        likeBtn.classList.add('liked');
                        likeBtn.querySelector('svg').setAttribute('fill', 'currentColor');
                    } else {
                        likeBtn.classList.remove('liked');
                        likeBtn.querySelector('svg').setAttribute('fill', 'none');
                    }
                });
            } catch (e) { 
                console.warn("Sync error", e); 
            }
        }

        function renderComments(commentsData, isPostOwner) {
            commentsListContainer.innerHTML = '';
            
            if (!commentsData || Object.keys(commentsData).length === 0) {
                commentsListContainer.innerHTML = `
                    <div class="empty-state" style="padding-top:80px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary); margin-bottom:10px;">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <p>هنوز نظری ثبت نشده است.<br>اولین نفر باشید!</p>
                    </div>
                `;
                return;
            }

            const commentsArray = Object.entries(commentsData)
                .map(([key, val]) => ({ id: key, ...val }))
                .sort((a, b) => {
                    // Sort by pinned first, then chronological
                    if (a.is_pinned && !b.is_pinned) return -1;
                    if (!a.is_pinned && b.is_pinned) return 1;
                    return new Date(a.timestamp) - new Date(b.timestamp);
                });

            commentsArray.forEach(comment => {
                const user = allUsersCache[comment.sender_username] || { 
                    displayName: comment.sender_username, 
                    username: comment.sender_username 
                };
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${comment.sender_username}&background=random&color=fff`;
                const verifiedHtml = user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';
                const isMyComment = comment.sender_username === currentUser.username;
                const isPinned = comment.is_pinned === true;

                // Action Buttons Logic
                let actionBtns = '';
                if (isPostOwner || isMyComment) {
                    actionBtns += `<div class="comment-option-menu">`;
                    if (isPostOwner) {
                         actionBtns += `<button class="mini-btn btn-pin" onclick="togglePinComment('${currentCommentsPostId}', '${comment.id}', ${!isPinned})">${isPinned ? 'برداشتن سنجاق' : 'سنجاق کردن'}</button>`;
                    }
                    if (isMyComment || isPostOwner) {
                        actionBtns += `<button class="mini-btn btn-delete" onclick="deleteComment('${currentCommentsPostId}', '${comment.id}')">حذف</button>`;
                    }
                    actionBtns += `</div>`;
                }

                const div = document.createElement('div');
                div.className = `comment-item ${isPinned ? 'pinned' : ''}`;
                div.id = `comment-${comment.id}`;
                div.innerHTML = `
                    <img src="${avatar}" class="comment-avatar">
                    <div class="comment-content">
                        <div class="comment-header">
                            ${isPinned ? '<svg class="pin-icon" viewBox="0 0 24 24"><path d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z" /></svg>' : ''}
                            <span class="comment-username">${user.displayName || comment.sender_username} ${verifiedHtml}</span>
                            <span class="comment-text">${comment.text}</span>
                        </div>
                        ${actionBtns}
                        <span class="comment-time">${timeAgo(comment.timestamp)}</span>
                    </div>
                `;
                commentsListContainer.appendChild(div);
            });
            
            // اسکرول به پایین
            setTimeout(() => {
                commentsListContainer.scrollTop = commentsListContainer.scrollHeight;
            }, 100);
        }

        // --- PULL REFRESH & TIME ---
        function touchStart(e) { 
            if (feedContainer.scrollTop === 0) { 
                startY = e.touches[0].clientY; 
                isPulling = true; 
            } 
        }
        
        function touchMove(e) {
            if (!isPulling) return;
            const diff = e.touches[0].clientY - startY;
            if (diff > 0 && feedContainer.scrollTop === 0) {
                e.preventDefault();
                currentTranslate = Math.min(diff * 0.5, 80);
                feedContainer.style.transform = `translateY(${currentTranslate}px)`;
                pullIndicator.style.opacity = Math.min(diff / 50, 1);
                pullSpinner.style.transform = `rotate(${diff * 2}deg)`; 
            }
        }
        
        async function touchEnd() {
            if (!isPulling) return;
            isPulling = false;
            if (currentTranslate > 60) {
                pullSpinner.classList.add('spinning');
                feedContainer.style.transform = `translateY(60px)`;
                try { 
                    await Promise.all([fetchUsersCache(), fetchPosts(false)]); 
                    renderFeed(preparePostsArray(postsDataCache)); 
                    showToast('تازه‌سازی انجام شد');
                } catch(e) { 
                    console.log(e); 
                    showToast('خطا در تازه‌سازی', 'error');
                }
                setTimeout(resetPull, 500);
            } else { 
                resetPull(); 
            }
        }
        
        function resetPull() {
            feedContainer.style.transform = ''; 
            pullIndicator.style.opacity = 0;
            pullSpinner.classList.remove('spinning'); 
            currentTranslate = 0;
        }

        function updateLiveTimestamps() {
            document.querySelectorAll('.post-time').forEach(el => {
                const ts = el.getAttribute('data-timestamp');
                if (ts) el.textContent = timeAgo(ts);
            });
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} روز پیش`;
            const weeks = Math.floor(days / 7);
            if (weeks < 4) return `${weeks} هفته پیش`;
            const months = Math.floor(days / 30);
            if (months < 12) return `${months} ماه پیش`;
            const years = Math.floor(days / 365);
            return `${years} سال پیش`;
        }
        
        // Global functions for inline event handlers
        window.openPostOptions = openPostOptions;
        window.showLikesList = showLikesList;
        window.openComments = openComments;
        window.toggleVideoPlay = toggleVideoPlay;
        window.toggleMute = toggleMute;
    </script>
</body>
</html>
