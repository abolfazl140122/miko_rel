<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.4);
            --like-color: #ED4956;
            --modal-bg: #1C2128;
            --skeleton-base: #161B22;
            --skeleton-highlight: #21262d;
            --danger-color: #FF4D4D;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none;
            background: radial-gradient(circle at top left, #1a202c 0%, var(--background-color) 70%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            background-color: var(--background-color);
        }

        /* --- HEADER --- */
        .header-area {
            background-color: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .header-title {
            font-size: 1.5rem; 
            font-weight: 900; margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 15px var(--primary-glow);
            letter-spacing: 0.5px;
        }
        .header-btn {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; padding: 8px; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .header-btn:active { transform: scale(0.85); background-color: var(--secondary-hover); }
        .header-btn svg { width: 28px; height: 28px; stroke-width: 2.5; }

        /* --- PULL TO REFRESH --- */
        .pull-indicator {
            position: absolute; top: 70px; left: 0; right: 0; height: 50px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; transition: transform 0.2s, opacity 0.2s; z-index: 10; opacity: 0;
        }
        .pull-spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--secondary-hover); 
            border-top-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .pull-spinner.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MAIN FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; 
            padding-bottom: 20px;
            scrollbar-width: none;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; padding-bottom: 10px;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s;
            background-color: var(--secondary-hover);
        }
        .post-card:hover .user-avatar { border-color: var(--primary-color); }

        .username { 
            font-weight: 700; font-size: 0.95rem; color: var(--text-primary); 
            display: flex; align-items: center; gap: 4px;
        }
        .verified-tick {
            width: 16px; height: 16px;
            filter: drop-shadow(0 0 4px var(--primary-glow));
            vertical-align: sub;
        }
        
        .post-options { 
            color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; 
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .post-options:hover { background-color: var(--secondary-hover); color: var(--text-primary); }
        .post-options:active { transform: scale(0.9); }
        .post-options.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

        /* --- MEDIA CONTAINER & LOADING BLUR --- */
        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 300px; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        /* Loading Placeholder with Blur */
        .media-loader-placeholder {
            position: absolute; inset: 0;
            background-color: var(--secondary-color);
            display: flex; align-items: center; justify-content: center;
            z-index: 2; transition: opacity 0.5s ease;
        }
        .media-loader-placeholder.loaded { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .post-media { 
            width: 100%; height: auto; max-height: 580px; object-fit: contain; display: block;
            opacity: 0; transition: opacity 0.5s ease-in; 
        }
        .post-media.loaded { opacity: 1; }
        
        video.post-media { object-fit: contain; max-height: 600px; }

        /* --- VIDEO CONTROLS --- */
        .video-overlay-controls {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 6;
            transition: opacity 0.3s;
        }
        .control-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 6px;
        }
        .control-btn svg { width: 100%; height: 100%; }
        
        .play-pause-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.4); border-radius: 50%;
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            z-index: 5; pointer-events: none; opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        .play-pause-overlay.visible { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .play-pause-overlay svg { width: 30px; height: 30px; fill: white; }

        /* --- HEART ANIMATION --- */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0);
            color: #fff; font-size: 90px; pointer-events: none;
            z-index: 7; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            opacity: 0;
        }
        .heart-overlay.active { animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 
            30% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; } 
            45% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
        }

        .post-actions { padding: 12px 15px 8px; display: flex; gap: 18px; align-items: center; }
        .action-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 0; transition: transform 0.1s; }
        .action-btn svg { width: 28px; height: 28px; stroke-width: 1.7; transition: all 0.2s; }
        .action-btn:active svg { transform: scale(0.8); }
        .action-btn.liked svg { 
            fill: var(--like-color); stroke: var(--like-color); 
            animation: likePulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        @keyframes likePulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

        .post-likes { 
            padding: 0 15px; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; 
            width: fit-content; transition: opacity 0.2s;
        }
        .post-likes.clickable { cursor: pointer; }
        .post-likes.clickable:active { opacity: 0.6; }
        .post-likes.private { cursor: default; }

        .post-caption { padding: 0 15px 5px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .caption-username { font-weight: 700; margin-left: 5px; }
        .post-time { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; display: block; padding: 0 15px; letter-spacing: 0.5px; }

        /* --- SKELETON LOADER --- */
        #skeleton-loader {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            background: var(--background-color); z-index: 15; overflow: hidden;
        }
        .sk-post { margin-bottom: 20px; background: var(--background-color); padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .sk-header { display: flex; align-items: center; padding: 15px; gap: 10px; }
        .sk-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--skeleton-base); }
        .sk-name { width: 120px; height: 16px; border-radius: 4px; background: var(--skeleton-base); }
        .sk-image { width: 100%; height: 380px; background: var(--skeleton-base); }
        .sk-actions { height: 20px; margin: 15px; width: 40%; background: var(--skeleton-base); border-radius: 4px; }
        
        .skeleton-animate { position: relative; overflow: hidden; }
        .skeleton-animate::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-highlight), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s ease-in-out; 
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .bottom-sheet { align-items: flex-end; }
        .sheet-card {
            background: var(--modal-bg); width: 100%; max-width: 480px; 
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 20px 0 15px 0;
            box-shadow: 0 -5px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .sheet-card { transform: translateY(0); }

        .sheet-drag-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 auto 15px; }

        .sheet-option {
            width: 100%; padding: 16px 25px; text-align: right; background: none; border: none;
            color: var(--text-primary); font-size: 1rem; font-family: 'Vazirmatn';
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .sheet-option:last-child { border-bottom: none; }
        .sheet-option:active { background-color: var(--secondary-hover); }
        .sheet-option svg { width: 22px; height: 22px; color: var(--text-secondary); }
        .sheet-option.danger { color: var(--danger-color); font-weight: 700; }
        .sheet-option.danger svg { color: var(--danger-color); }

        /* Toggle Switch */
        .toggle-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--secondary-hover); transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 26px;
            border: 1px solid var(--border-color);
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); border-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Create Modal */
        .modal-card {
            background: var(--modal-bg); width: 85%; max-width: 400px; border-radius: 16px;
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            transform: scale(0.9); opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }
        
        .modal-header {
            padding: 15px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            background: rgba(255,255,255,0.02);
        }
        .modal-title { font-weight: 800; margin: 0; font-size: 1rem; color: var(--text-primary); }
        .share-btn { color: var(--primary-color); font-weight: 700; background: none; border: none; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        .share-btn:disabled { opacity: 0.5; cursor: default; }
        .close-modal { color: var(--text-primary); background: none; border: none; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 0 5px; }
        
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; max-height: 70vh; overflow-y: auto; }
        .upload-area {
            border: 2px dashed var(--border-color); border-radius: 12px;
            padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s;
            background: rgba(255,255,255,0.01);
        }
        .upload-area:active { border-color: var(--primary-color); background: rgba(0, 163, 255, 0.05); }
        .upload-area svg { width: 48px; height: 48px; color: var(--text-secondary); margin-bottom: 10px; }
        
        .upload-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; display: none; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .caption-input {
            width: 100%; background: var(--secondary-color); border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 12px; border-radius: 10px; font-family: 'Vazirmatn'; resize: none; min-height: 90px;
            transition: border-color 0.2s;
        }
        .caption-input:focus { outline: none; border-color: var(--primary-color); }
        
        .progress-bar-container { width: 100%; height: 6px; background: var(--secondary-color); border-radius: 3px; margin-top: 10px; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-color), #00C6FF); border-radius: 3px; transition: width 0.2s ease-out; }

        /* --- USER LIST MODAL --- */
        .user-list-content { max-height: 60vh; overflow-y: auto; padding: 0; flex-grow: 1; }
        .user-list-item { 
            display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            transition: background 0.2s;
        }
        .user-list-item:active { background-color: var(--secondary-hover); }
        .user-list-item img { width: 44px; height: 44px; border-radius: 50%; margin-left: 12px; object-fit: cover; border: 1px solid var(--border-color); }
        .user-list-info h4 { margin: 0; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; color: var(--text-primary); }
        .user-list-info p { margin: 3px 0 0; font-size: 0.8rem; color: var(--text-secondary); }
        
        /* Blue Tick Fix in Modal */
        .user-list-info .verified-tick { width: 14px; height: 14px; vertical-align: middle; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        
        /* Toast Notification */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 100px);
            background: var(--text-primary); color: var(--background-color); padding: 12px 24px; border-radius: 50px;
            font-size: 0.95rem; font-weight: 700; z-index: 2000; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .toast.error { background: var(--danger-color); color: white; }
        .toast.active { transform: translate(-50%, 0); }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="header-btn back-btn" onclick="window.location.href='safe_asli.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="header-title">روبینو همیار</h1>
            <button class="header-btn" id="open-create-modal">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </header>
        
        <!-- Pull to Refresh -->
        <div class="pull-indicator" id="pull-indicator">
            <div class="pull-spinner" id="pull-spinner"></div>
        </div>

        <!-- Skeleton Loader -->
        <div id="skeleton-loader">
            <div class="sk-post">
                <div class="sk-header"><div class="sk-avatar skeleton-animate"></div><div class="sk-name skeleton-animate"></div></div>
                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
            <div class="sk-post">
                <div class="sk-header"><div class="sk-avatar skeleton-animate"></div><div class="sk-name skeleton-animate"></div></div>
                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
        </div>

        <!-- Feed -->
        <div class="feed-container" id="feed-container"></div>

        <!-- Create Post Modal -->
        <div class="modal-overlay" id="create-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <button class="close-modal" id="close-modal-btn">&times;</button>
                    <h3 class="modal-title">پست جدید</h3>
                    <button class="share-btn" id="share-post-btn">انتشار</button>
                </div>
                <div class="modal-body">
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    
                    <div class="upload-area" id="upload-trigger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p style="margin:0; font-weight:500;">انتخاب عکس یا ویدیو</p>
                    </div>
                    
                    <img id="image-preview" class="upload-preview" />
                    <video id="video-preview" class="upload-preview" controls playsinline></video>

                    <textarea class="caption-input" id="caption-input" placeholder="کپشن خود را بنویسید..."></textarea>
                    
                    <div class="toggle-container" style="padding: 0 5px;">
                        <span style="font-size: 0.9rem; color: var(--text-secondary);">اجازه دیدن لیست لایک‌ها</span>
                        <label class="switch">
                            <input type="checkbox" id="create-privacy-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="progress-bar-container" id="upload-progress-container">
                        <div class="progress-bar" id="upload-progress"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Post Options Modal -->
        <div class="modal-overlay bottom-sheet" id="options-modal">
            <div class="sheet-card">
                <div class="sheet-drag-handle"></div>
                <div class="sheet-option">
                    <div class="toggle-container">
                        <span>اجازه دیدن لیست لایک‌ها</span>
                        <label class="switch">
                            <input type="checkbox" id="privacy-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <button class="sheet-option" id="edit-post-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    ویرایش کپشن
                </button>
                <button class="sheet-option danger" id="delete-post-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    حذف پست
                </button>
                <button class="sheet-option" id="close-options-btn" style="justify-content: center; color: var(--text-secondary);">
                    انصراف
                </button>
            </div>
        </div>
        
        <!-- Edit Caption Modal -->
        <div class="modal-overlay" id="edit-caption-modal">
             <div class="modal-card">
                 <div class="modal-header">
                     <h3 class="modal-title">ویرایش متن</h3>
                 </div>
                 <div class="modal-body">
                     <textarea class="caption-input" id="edit-caption-input"></textarea>
                     <button class="share-btn" id="save-caption-btn" style="background: var(--primary-color); color: white; padding: 12px; border-radius: 10px; width:100%;">ذخیره تغییرات</button>
                     <button class="close-modal" id="cancel-caption-btn" style="margin-top: 5px; font-size: 0.9rem; width:100%; text-align:center;">لغو</button>
                 </div>
             </div>
        </div>

        <!-- Likes List Modal -->
        <div class="modal-overlay bottom-sheet" id="likes-modal">
            <div class="sheet-card" style="max-height: 80vh;">
                <div class="sheet-drag-handle"></div>
                <div class="modal-header" style="border:none; padding: 0 20px 15px;">
                    <h3 class="modal-title" style="font-size: 1.1rem;">پسندها</h3>
                    <button class="close-modal" id="close-likes-btn">&times;</button>
                </div>
                <div class="user-list-content" id="likes-list-container"></div>
            </div>
        </div>
        
        <!-- Toast -->
        <div class="toast" id="toast">پیام سیستم</div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const UPLOAD_PHP_ENDPOINT = 'https://miko.freehost.io/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_ICON_URL = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';
        const LIVE_UPDATE_INTERVAL = 4000;
        const CACHE_KEY_FEED = 'rubino_cached_feed';

        // --- DOM REFERENCES ---
        const feedContainer = document.getElementById('feed-container');
        const skeletonLoader = document.getElementById('skeleton-loader');
        const createModal = document.getElementById('create-modal');
        const optionsModal = document.getElementById('options-modal');
        const likesModal = document.getElementById('likes-modal');
        const editCaptionModal = document.getElementById('edit-caption-modal');
        
        // Buttons & Inputs
        const openCreateBtn = document.getElementById('open-create-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const sharePostBtn = document.getElementById('share-post-btn');
        const closeOptionsBtn = document.getElementById('close-options-btn');
        const closeLikesBtn = document.getElementById('close-likes-btn');
        const deletePostBtn = document.getElementById('delete-post-btn');
        const editPostBtn = document.getElementById('edit-post-btn');
        const saveCaptionBtn = document.getElementById('save-caption-btn');
        const cancelCaptionBtn = document.getElementById('cancel-caption-btn');
        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const imagePreview = document.getElementById('image-preview');
        const videoPreview = document.getElementById('video-preview');
        const captionInput = document.getElementById('caption-input');
        const editCaptionInput = document.getElementById('edit-caption-input');
        const progressBarContainer = document.getElementById('upload-progress-container');
        const progressBar = document.getElementById('upload-progress');
        const privacyToggle = document.getElementById('privacy-toggle');
        const createPrivacyToggle = document.getElementById('create-privacy-toggle');
        const pullIndicator = document.getElementById('pull-indicator');
        const pullSpinner = document.getElementById('pull-spinner');
        const toast = document.getElementById('toast');

        // --- APP STATE ---
        let currentUser = null;
        let clientToken = null;
        let selectedFile = null;
        let allUsersCache = {};
        let currentOptionsPostId = null; 
        let currentViewingLikesPostId = null; 
        let postsDataCache = {}; 
        let videoObserver = null; 
        let startY = 0; let isPulling = false; let currentTranslate = 0;
        
        // --- GLOBAL AUDIO STATE (Instagram Style) ---
        let isGlobalMuted = true; // Default to muted

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(storedUser);

            setupEventListeners();
            initVideoObserver();
            
            // 1. Load from Cache Immediately (Offline Support / Speed)
            const cachedFeed = localStorage.getItem(CACHE_KEY_FEED);
            if (cachedFeed) {
                skeletonLoader.style.display = 'none';
                postsDataCache = JSON.parse(cachedFeed);
                // Try to load users first even if we have cached feed
                await safeLoadUsers(); 
                renderFeed(preparePostsArray(postsDataCache), false); 
            }

            try {
                await refreshClientToken();
                // 2. Fetch Users BEFORE fetching posts to ensure profiles load
                await fetchUsersCache(); 
                await fetchPosts();
                
                setInterval(updateLiveTimestamps, 60000);
                setInterval(startRealtimeUpdates, LIVE_UPDATE_INTERVAL);
            } catch (error) {
                console.error(error);
                if (!postsDataCache || Object.keys(postsDataCache).length === 0) {
                    feedContainer.innerHTML = '<div class="empty-state">خطا در اتصال به سرور.</div>';
                    skeletonLoader.style.display = 'none';
                }
            }
        });

        // --- CACHE & DATA HELPERS ---
        function preparePostsArray(data) {
             return Object.entries(data)
                .map(([key, val]) => ({ id: key, ...val }))
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        }

        // --- VIDEO & INTERSECTION OBSERVER (Fixed for Global Audio) ---
        function initVideoObserver() {
            const options = { root: null, rootMargin: '0px', threshold: 0.65 };
            
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    const overlay = document.getElementById(`play-icon-${video.dataset.id}`);
                    const muteBtn = document.querySelector(`.mute-btn[data-for="${video.dataset.id}"]`);

                    if (entry.isIntersecting) {
                        // Apply Global Mute State immediately when video enters view
                        video.muted = isGlobalMuted;
                        updateMuteIconUI(muteBtn, isGlobalMuted);

                        if (video.paused && !video.dataset.manualPause) {
                            video.play().catch(e => {
                                video.muted = true; // Fallback
                                video.play().catch(console.log);
                            });
                        }
                        
                        // Pause others
                        document.querySelectorAll('video').forEach(v => {
                            if (v !== video && !v.paused) v.pause();
                        });
                    } else {
                        if (!video.paused) {
                            video.pause();
                        }
                    }
                });
            }, options);
        }

        function toggleVideoPlay(vidId) {
            const video = document.getElementById(`video-${vidId}`);
            const overlay = document.getElementById(`play-icon-${vidId}`);
            
            if (video.paused) {
                video.dataset.manualPause = ""; 
                video.play();
                overlay.classList.remove('visible');
            } else {
                video.dataset.manualPause = "true"; 
                video.pause();
                overlay.classList.add('visible');
            }
        }

        // --- GLOBAL MUTE TOGGLE LOGIC ---
        function toggleMute(vidId, btn) {
            // 1. Flip Global State
            isGlobalMuted = !isGlobalMuted;

            // 2. Apply to ALL videos in DOM immediately (Instagram behavior)
            document.querySelectorAll('video').forEach(vid => {
                vid.muted = isGlobalMuted;
            });

            // 3. Update ALL icons in DOM
            document.querySelectorAll('.mute-btn').forEach(button => {
                updateMuteIconUI(button, isGlobalMuted);
            });
            
            // Prevent bubbling
            window.event.stopPropagation();
        }

        function updateMuteIconUI(btn, isMuted) {
            if(!btn) return;
            btn.innerHTML = isMuted 
                ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>` // Muted Icon
                : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`; // Sound Icon
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            openCreateBtn.addEventListener('click', () => { resetModal(); createModal.classList.add('active'); });
            closeModalBtn.addEventListener('click', () => createModal.classList.remove('active'));
            uploadTrigger.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
            });
            sharePostBtn.addEventListener('click', handleUploadAndPost);

            optionsModal.addEventListener('click', (e) => { if(e.target === optionsModal) closeOptions(); });
            closeOptionsBtn.addEventListener('click', closeOptions);
            
            likesModal.addEventListener('click', (e) => { 
                if(e.target === likesModal) {
                    likesModal.classList.remove('active'); 
                    currentViewingLikesPostId = null;
                }
            });
            closeLikesBtn.addEventListener('click', () => {
                likesModal.classList.remove('active');
                currentViewingLikesPostId = null;
            });

            deletePostBtn.addEventListener('click', handleDeletePost);
            editPostBtn.addEventListener('click', () => {
                closeOptions();
                const post = postsDataCache[currentOptionsPostId];
                editCaptionInput.value = post ? post.caption : '';
                editCaptionModal.classList.add('active');
            });

            cancelCaptionBtn.addEventListener('click', () => editCaptionModal.classList.remove('active'));
            saveCaptionBtn.addEventListener('click', handleSaveCaption);
            
            privacyToggle.addEventListener('change', handlePrivacyChange);

            // Pull to Refresh
            feedContainer.addEventListener('touchstart', touchStart, {passive: true});
            feedContainer.addEventListener('touchmove', touchMove, {passive: false});
            feedContainer.addEventListener('touchend', touchEnd);
        }

        // --- FILE & MODAL LOGIC ---
        function handleFileSelect(file) {
            selectedFile = file;
            const reader = new FileReader();
            uploadTrigger.style.display = 'none';
            if (file.type.startsWith('video/')) {
                imagePreview.style.display = 'none'; videoPreview.style.display = 'block';
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.play(); 
            } else {
                videoPreview.style.display = 'none'; imagePreview.style.display = 'block';
                reader.onload = (e) => imagePreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        function resetModal() {
            selectedFile = null;
            fileInput.value = ''; captionInput.value = '';
            imagePreview.src = ''; videoPreview.src = '';
            imagePreview.style.display = 'none'; videoPreview.style.display = 'none';
            uploadTrigger.style.display = 'block';
            progressBarContainer.style.display = 'none'; progressBar.style.width = '0%';
            sharePostBtn.disabled = false; sharePostBtn.textContent = 'انتشار';
            createPrivacyToggle.checked = true; 
        }

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast ${type} active`;
            setTimeout(() => toast.classList.remove('active'), 3500);
        }

        // --- NETWORK CORE ---
        async function refreshClientToken() {
            try {
                const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
                if (!response.ok) throw new Error('Auth Failed');
                const data = await response.json();
                clientToken = data.token;
            } catch (e) { console.error("Token error", e); }
        }

        async function safeLoadUsers() {
            // Helper to try loading users from cache first just to have something
            // This is handled by main logic, but good as a placeholder
        }

        async function fetchUsersCache() {
            if (!clientToken) await refreshClientToken();
            try {
                const response = await fetch(`${PROXY_URL}?path=users`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                if (response.ok) {
                    allUsersCache = await response.json() || {};
                    // If posts are already rendered but profiles missing, re-render
                    const posts = document.querySelectorAll('.post-card');
                    if (posts.length > 0) {
                        // Check if we need to update UI
                        const firstAvatar = posts[0].querySelector('.user-avatar');
                        if (firstAvatar && firstAvatar.src.includes('ui-avatars')) {
                             // Re-render only if needed to avoid flicker
                             renderFeed(preparePostsArray(postsDataCache), true); 
                        }
                    }
                }
            } catch (e) { console.warn("User cache error", e); }
        }

        // --- UPLOAD & CREATE POST ---
        async function handleUploadAndPost() {
            if (!selectedFile) { showToast('فایلی انتخاب نشده است', 'error'); return; }
            sharePostBtn.disabled = true; sharePostBtn.textContent = 'در حال آپلود...';
            progressBarContainer.style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_PHP_ENDPOINT, true);
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) progressBar.style.width = ((e.loaded / e.total) * 100) + '%';
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (result.success && result.url) {
                            await createPostRecord(result.url, selectedFile.type.startsWith('video/') ? 'video' : 'image');
                        } else throw new Error(result.error);
                    } catch (err) { showToast(err.message, 'error'); sharePostBtn.disabled = false; }
                } else { showToast('خطای سرور', 'error'); sharePostBtn.disabled = false; }
            };
            xhr.send(formData);
        }

        async function createPostRecord(mediaUrl, type) {
            sharePostBtn.textContent = 'ذخیره...';
            const postData = {
                sender_username: currentUser.username,
                media_url: mediaUrl,
                type: type,
                caption: captionInput.value.trim(),
                timestamp: new Date().toISOString(),
                likes: {},
                show_likes: createPrivacyToggle.checked 
            };

            try {
                await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });
                createModal.classList.remove('active');
                await fetchPosts();
                showToast('پست منتشر شد');
            } catch (err) { showToast('خطا در انتشار', 'error'); sharePostBtn.disabled = false; }
        }

        // --- FEED LOGIC ---
        async function fetchPosts() {
            const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
            });
            skeletonLoader.style.display = 'none';
            
            if (!response.ok && response.status !== 404) return;
            
            const data = await response.json() || {};
            
            // Cache Update
            if (JSON.stringify(data) !== JSON.stringify(postsDataCache)) {
                localStorage.setItem(CACHE_KEY_FEED, JSON.stringify(data));
                postsDataCache = data;
                const posts = preparePostsArray(data);
                
                if (posts.length === 0) {
                    feedContainer.innerHTML = '<div class="empty-state">هیچ پستی وجود ندارد.</div>';
                } else {
                    renderFeed(posts);
                }
            }
        }

        // --- RENDER FEED (Fixed Profile Logic) ---
        function renderFeed(posts, force = true) {
            // 'force' prevents unnecessary DOM rebuilding if not needed, usually we force on fetch
            feedContainer.innerHTML = '';
            
            posts.forEach(post => {
                const isOwner = post.sender_username === currentUser.username;
                
                // --- FIX: Robust User Profile Lookup ---
                let user = { displayName: post.sender_username, username: post.sender_username }; // Default
                if (allUsersCache && allUsersCache[post.sender_username]) {
                    user = allUsersCache[post.sender_username];
                }
                
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random&color=fff`;
                const displayName = user.displayName || post.sender_username;
                const isLiked = post.likes && post.likes[currentUser.username];
                const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                const verifiedHtml = user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';

                const canOpenList = isOwner || (post.show_likes !== false); 
                const likesText = `${likeCount} پسند`;
                const likesClass = canOpenList ? 'clickable' : 'private';
                const likesClickAction = canOpenList ? `onclick="showLikesList('${post.id}', ${isOwner}, ${post.show_likes !== false})"` : '';

                // Media & Loading Logic
                let mediaHtml = '';
                const loadingOverlay = `<div class="media-loader-placeholder" id="loader-${post.id}"><div class="loading-spinner"></div></div>`;

                if (post.type === 'video') {
                    mediaHtml = `
                        ${loadingOverlay}
                        <video class="post-media" id="video-${post.id}" data-id="${post.id}" src="${post.media_url}" loop playsinline muted onloadeddata="document.getElementById('loader-${post.id}').classList.add('loaded'); this.classList.add('loaded')"></video>
                        <div class="play-pause-overlay" id="play-icon-${post.id}">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </div>
                        <div class="video-overlay-controls">
                            <button class="control-btn mute-btn" data-for="${post.id}" onclick="toggleMute('${post.id}', this)">
                                ${isGlobalMuted ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>'}
                            </button>
                        </div>
                    `;
                } else {
                    mediaHtml = `
                        ${loadingOverlay}
                        <img class="post-media" src="${post.media_url}" loading="lazy" onload="document.getElementById('loader-${post.id}').classList.add('loaded'); this.classList.add('loaded')" ondblclick="triggerLike('${post.id}')">
                    `;
                }

                const postEl = document.createElement('div');
                postEl.className = 'post-card';
                postEl.id = `post-${post.id}`;
                
                postEl.innerHTML = `
                    <div class="post-header">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar" alt="Avatar">
                            <span class="username">${displayName} ${verifiedHtml}</span>
                        </div>
                        <div class="post-options ${isOwner ? '' : 'disabled'}" ${isOwner ? `onclick="openPostOptions('${post.id}', ${post.show_likes !== false})"` : ''}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        </div>
                    </div>
                    <div class="post-media-container" id="media-container-${post.id}" onclick="${post.type === 'video' ? `toggleVideoPlay('${post.id}')` : ''}" ondblclick="triggerLike('${post.id}')">
                        ${mediaHtml}
                        <div class="heart-overlay" id="heart-anim-${post.id}">❤</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike('${post.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                    </div>
                    <div class="post-likes ${likesClass}" id="likes-count-${post.id}" ${likesClickAction}>
                        ${likesText}
                    </div>
                    <div class="post-caption">
                        <span class="caption-username">${displayName}</span>
                        <span class="caption-text">${post.caption}</span>
                    </div>
                    <span class="post-time" data-timestamp="${post.timestamp}">${timeAgo(post.timestamp)}</span>
                `;
                feedContainer.appendChild(postEl);
            });

            // Re-observe videos after rendering
            document.querySelectorAll('video').forEach(v => videoObserver.observe(v));
        }

        // --- REALTIME UPDATER ---
        async function startRealtimeUpdates() {
            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                if (!response.ok) return;
                const newData = await response.json() || {};

                // Only update if there are significant changes to avoid resetting media playback
                if (JSON.stringify(newData) === JSON.stringify(postsDataCache)) return;

                postsDataCache = newData;
                // Update Local Cache
                localStorage.setItem(CACHE_KEY_FEED, JSON.stringify(newData));

                // Partial DOM updates
                const domPosts = document.querySelectorAll('.post-card');
                domPosts.forEach(el => {
                    const pid = el.id.replace('post-', '');
                    if (!newData[pid]) {
                        el.remove(); // Removed remotely
                        return;
                    }
                    const post = newData[pid];
                    
                    // Likes
                    const likeCountEl = el.querySelector('.post-likes');
                    const isOwner = post.sender_username === currentUser.username;
                    const canOpenList = isOwner || (post.show_likes !== false);
                    const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                    likeCountEl.textContent = `${likeCount} پسند`;
                    
                    if (canOpenList) {
                        likeCountEl.classList.add('clickable');
                        likeCountEl.classList.remove('private');
                        likeCountEl.setAttribute('onclick', `showLikesList('${pid}', ${isOwner}, true)`);
                    } else {
                        likeCountEl.classList.remove('clickable');
                        likeCountEl.classList.add('private');
                        likeCountEl.removeAttribute('onclick');
                    }

                    // Caption
                    const capEl = el.querySelector('.caption-text');
                    if (capEl.textContent !== post.caption) capEl.textContent = post.caption;
                });
            } catch (e) { console.warn("Sync error", e); }
        }

        // --- POST ACTIONS ---
        function openPostOptions(postId, isPublic) {
            currentOptionsPostId = postId;
            privacyToggle.checked = isPublic;
            optionsModal.classList.add('active');
        }

        function closeOptions() {
            optionsModal.classList.remove('active');
            currentOptionsPostId = null;
        }

        async function handleDeletePost() {
            if(!confirm('حذف شود؟')) return;
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'DELETE', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                document.getElementById(`post-${currentOptionsPostId}`).remove();
                closeOptions();
                showToast('پست حذف شد');
                await fetchPosts(); // Sync cache
            } catch(e) { showToast('خطا در حذف', 'error'); }
        }

        async function handleSaveCaption() {
            const newCaption = editCaptionInput.value;
            saveCaptionBtn.textContent = '...';
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caption: newCaption })
                });
                document.querySelector(`#post-${currentOptionsPostId} .caption-text`).textContent = newCaption;
                editCaptionModal.classList.remove('active');
                showToast('ویرایش شد');
                // Update cache locally
                if(postsDataCache[currentOptionsPostId]) {
                    postsDataCache[currentOptionsPostId].caption = newCaption;
                    localStorage.setItem(CACHE_KEY_FEED, JSON.stringify(postsDataCache));
                }
            } catch(e) { showToast('خطا', 'error'); }
            saveCaptionBtn.textContent = 'ذخیره تغییرات';
        }

        async function handlePrivacyChange() {
            const isChecked = privacyToggle.checked;
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ show_likes: isChecked })
                });
            } catch(e) { 
                privacyToggle.checked = !isChecked;
                showToast('خطا در تغییر تنظیمات', 'error');
            }
        }

        // --- LIKES LIST ---
        async function showLikesList(postId, isOwner, isPublic) {
            if (!isOwner && !isPublic) return; 

            currentViewingLikesPostId = postId;
            const listContainer = document.getElementById('likes-list-container');
            listContainer.innerHTML = '<div class="empty-state"><div class="pull-spinner spinning" style="margin:0 auto;"></div></div>';
            likesModal.classList.add('active');

            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                const likesData = await response.json();
                
                listContainer.innerHTML = '';
                if (!likesData) {
                    listContainer.innerHTML = '<div class="empty-state">هنوز لایکی ثبت نشده.</div>';
                    return;
                }

                const userIds = Object.keys(likesData);
                userIds.forEach(uid => {
                    const user = allUsersCache[uid] || { displayName: uid, username: uid };
                    const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${uid}&background=random&color=fff`;
                    
                    const div = document.createElement('div');
                    div.className = 'user-list-item';
                    div.innerHTML = `
                        <img src="${avatar}">
                        <div class="user-list-info">
                            <h4>
                                ${user.displayName || uid} 
                                ${user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : ''}
                            </h4>
                            <p>@${user.username || uid}</p>
                        </div>
                    `;
                    listContainer.appendChild(div);
                });
            } catch(e) {
                listContainer.innerHTML = '<div class="empty-state">خطا در دریافت لیست.</div>';
            }
        }

        // --- LIKE LOGIC (With Animation) ---
        window.toggleLike = async (postId) => {
            const btn = document.getElementById(`like-btn-${postId}`);
            const countEl = document.getElementById(`likes-count-${postId}`);
            const isLiked = btn.classList.contains('liked');
            let currentCount = parseInt(countEl.textContent) || 0;
            
            // Optimistic UI
            if (isLiked) {
                btn.classList.remove('liked');
                btn.querySelector('svg').setAttribute('fill', 'none');
                btn.querySelector('svg').setAttribute('stroke', 'currentColor');
                countEl.textContent = `${Math.max(0, currentCount - 1)} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes/${currentUser.username}`, {
                        method: 'DELETE', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                    });
                } catch(e) {}
            } else {
                btn.classList.add('liked');
                btn.querySelector('svg').setAttribute('fill', '#ED4956');
                btn.querySelector('svg').setAttribute('stroke', '#ED4956');
                countEl.textContent = `${currentCount + 1} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes/${currentUser.username}`, {
                        method: 'PUT', 
                        headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' }, 
                        body: 'true'
                    });
                } catch(e) {}
            }
        };

        window.triggerLike = (postId) => {
            const heart = document.getElementById(`heart-anim-${postId}`);
            const btn = document.getElementById(`like-btn-${postId}`);
            
            // Pop Animation
            heart.classList.remove('active');
            void heart.offsetWidth; // Force Reflow
            heart.classList.add('active');
            
            if (!btn.classList.contains('liked')) toggleLike(postId);
        };

        // --- PULL REFRESH & TIME ---
        function touchStart(e) {
            if (feedContainer.scrollTop === 0) {
                startY = e.touches[0].clientY;
                isPulling = true;
            }
        }
        function touchMove(e) {
            if (!isPulling) return;
            const diff = e.touches[0].clientY - startY;
            if (diff > 0 && feedContainer.scrollTop === 0) {
                e.preventDefault();
                currentTranslate = Math.min(diff * 0.5, 80);
                feedContainer.style.transform = `translateY(${currentTranslate}px)`;
                pullIndicator.style.opacity = Math.min(diff / 50, 1);
                pullSpinner.style.transform = `rotate(${diff * 2}deg)`; 
            }
        }
        async function touchEnd() {
            if (!isPulling) return;
            isPulling = false;
            if (currentTranslate > 60) {
                pullSpinner.classList.add('spinning');
                feedContainer.style.transform = `translateY(60px)`;
                await fetchUsersCache(); // Refresh users too on pull
                await fetchPosts();
                setTimeout(resetPull, 500);
            } else {
                resetPull();
            }
        }
        function resetPull() {
            feedContainer.style.transform = '';
            pullIndicator.style.opacity = 0;
            pullSpinner.classList.remove('spinning');
            currentTranslate = 0;
        }

        function updateLiveTimestamps() {
            document.querySelectorAll('.post-time').forEach(el => {
                const ts = el.getAttribute('data-timestamp');
                if (ts) el.textContent = timeAgo(ts);
            });
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            const days = Math.floor(hours / 24);
            return `${days} روز پیش`;
        }
    </script>
</body>
