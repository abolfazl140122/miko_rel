<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.4);
            --like-color: #ED4956;
            --modal-bg: #1C2128;
            --skeleton-base: #161B22;
            --skeleton-highlight: #21262d;
            --danger-color: #FF4D4D;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none;
            background: radial-gradient(circle at top left, #1a202c 0%, var(--background-color) 70%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            background-color: var(--background-color);
        }

        /* --- HEADER --- */
        .header-area {
            background-color: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .header-title {
            font-size: 1.5rem; font-weight: 900; margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 15px var(--primary-glow);
            letter-spacing: 0.5px;
        }
        .header-btn {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; padding: 8px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .header-btn svg { width: 28px; height: 28px; stroke-width: 2.5; }

        /* --- PULL TO REFRESH --- */
        .pull-indicator {
            position: absolute; top: 70px; left: 0; right: 0; height: 50px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; transition: transform 0.2s, opacity 0.2s; z-index: 10; opacity: 0;
        }
        .pull-spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--secondary-hover); 
            border-top-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .pull-spinner.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MAIN FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; 
            padding-bottom: 20px; scrollbar-width: none;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; padding-bottom: 10px;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s;
        }
        .username { 
            font-weight: 700; font-size: 0.95rem; color: var(--text-primary); 
            display: flex; align-items: center; gap: 4px;
        }
        /* تیک آبی استاندارد */
        .verified-tick {
            width: 16px; height: 16px;
            filter: drop-shadow(0 0 4px var(--primary-glow));
            vertical-align: middle;
            display: inline-block;
        }
        
        .post-options { 
            color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; 
            transition: background-color 0.2s ease;
        }
        .post-options:hover { background-color: var(--secondary-hover); }

        /* --- MEDIA CONTAINER & CONTROLS --- */
        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 300px; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        /* Blur Loading Overlay */
        .media-loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            z-index: 2;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .media-loader-overlay.hidden { opacity: 0; pointer-events: none; }
        .loader-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 10px;
        }
        .loader-text { font-size: 0.8rem; color: var(--text-secondary); }

        .post-media { width: 100%; height: auto; max-height: 580px; object-fit: contain; display: block; opacity: 0; transition: opacity 0.3s; }
        .post-media.loaded { opacity: 1; }
        video.post-media { object-fit: contain; max-height: 600px; }
        
        /* Video Controls */
        .video-control-btn {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 4;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: transform 0.2s;
        }
        .video-control-btn:active { transform: scale(0.9); }
        .video-control-btn svg { width: 16px; height: 16px; }

        .play-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
            z-index: 3;
            backdrop-filter: blur(2px);
        }
        .play-overlay.show { opacity: 1; }
        .play-overlay svg { width: 35px; height: 35px; fill: white; margin-left: 4px; } /* Play icon offset */

        /* Heart Animation */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0);
            color: #fff; font-size: 90px; pointer-events: none;
            z-index: 5; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            opacity: 0;
        }
        .heart-overlay.active { animation: heartPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
        }

        .post-actions { padding: 12px 15px 8px; display: flex; gap: 18px; align-items: center; }
        .action-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 0; }
        .action-btn svg { width: 28px; height: 28px; stroke-width: 1.7; transition: all 0.2s; }
        .action-btn.liked svg { 
            fill: var(--like-color); stroke: var(--like-color); 
            animation: likePulse 0.4s; 
        }
        @keyframes likePulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

        .post-likes { 
            padding: 0 15px; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; 
            width: fit-content; transition: opacity 0.2s;
        }
        .post-likes.clickable { cursor: pointer; }
        .post-likes.clickable:active { opacity: 0.6; }
        .post-caption { padding: 0 15px 5px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .caption-username { font-weight: 700; margin-left: 5px; }
        .post-time { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; display: block; padding: 0 15px; }

        /* --- SKELETON --- */
        #skeleton-loader {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            background: var(--background-color); z-index: 15; overflow: hidden;
        }
        .sk-post { margin-bottom: 20px; background: var(--background-color); padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .sk-header { display: flex; align-items: center; padding: 15px; gap: 10px; }
        .sk-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--skeleton-base); }
        .sk-name { width: 120px; height: 16px; border-radius: 4px; background: var(--skeleton-base); }
        .sk-image { width: 100%; height: 380px; background: var(--skeleton-base); }
        .sk-actions { height: 20px; margin: 15px; width: 40%; background: var(--skeleton-base); border-radius: 4px; }
        .skeleton-animate::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-highlight), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s ease-in-out; 
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .bottom-sheet { align-items: flex-end; }
        .sheet-card {
            background: var(--modal-bg); width: 100%; max-width: 480px; 
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 20px 0 15px 0; display: flex; flex-direction: column;
        }
        .modal-overlay.active .sheet-card { transform: translateY(0); }
        .sheet-drag-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 0 auto 15px; }
        .sheet-option {
            width: 100%; padding: 16px 25px; text-align: right; background: none; border: none;
            color: var(--text-primary); font-size: 1rem; font-family: 'Vazirmatn';
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sheet-option:active { background-color: var(--secondary-hover); }
        
        /* Create Modal */
        .modal-card {
            background: var(--modal-bg); width: 85%; max-width: 400px; border-radius: 16px;
            overflow: hidden; transform: scale(0.9); opacity: 0; transition: all 0.3s;
        }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .upload-area { border: 2px dashed var(--border-color); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; }
        .upload-preview { width: 100%; max-height: 300px; object-fit: contain; display: none; background: #000; }
        .caption-input { width: 100%; background: var(--secondary-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 10px; font-family: 'Vazirmatn'; resize: none; min-height: 90px; }

        /* --- USER LIST MODAL (LIKES) --- */
        .user-list-content { max-height: 60vh; overflow-y: auto; padding: 0; }
        .user-list-item { 
            display: flex; align-items: center; padding: 12px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .user-list-item img { width: 44px; height: 44px; border-radius: 50%; margin-left: 12px; object-fit: cover; border: 1px solid var(--border-color); }
        .user-list-info h4 { 
            margin: 0; font-size: 0.95rem; 
            display: flex; align-items: center; gap: 4px; /* این خط باعث تراز شدن متن و تیک میشه */
            color: var(--text-primary); 
        }
        .user-list-info p { margin: 3px 0 0; font-size: 0.8rem; color: var(--text-secondary); }
        
        /* اصلاح تیک آبی در لیست لایک‌ها */
        .user-list-info .verified-tick {
            width: 14px; height: 14px; /* سایز فیکس و کوچک */
            min-width: 14px;
            margin-right: 2px;
            vertical-align: middle;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 100px);
            background: var(--text-primary); color: var(--background-color); padding: 12px 24px; border-radius: 50px;
            font-size: 0.95rem; font-weight: 700; z-index: 2000; 
            transition: transform 0.4s;
        }
        .toast.active { transform: translate(-50%, 0); }

        /* Toggle Switch */
        .toggle-container { display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--secondary-hover); transition: .4s; border-radius: 26px; border: 1px solid var(--border-color); }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="header-btn" onclick="window.location.href='safe_asli.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>

    <script>
        /* --- CONFIGURATION & CACHING (SERVICE WORKER) --- */
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const UPLOAD_PHP_ENDPOINT = 'https://miko.freehost.io/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_ICON_URL = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';
        
        // Register Internal Service Worker for Media Caching
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'rubino-media-cache-v1';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', event => {
                    const url = new URL(event.request.url);
                    // کش کردن فایل‌های تصویری و ویدیویی
                    if (event.request.destination === 'image' || event.request.destination === 'video' || url.pathname.match(/\.(mp4|jpg|jpeg|png|gif)$/)) {
                        event.respondWith(
                            caches.match(event.request).then(response => {
                                if (response) return response; // بازگشت از کش
                                return fetch(event.request).then(networkResponse => {
                                    if(!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') return networkResponse;
                                    const responseToCache = networkResponse.clone();
                                    caches.open(CACHE_NAME).then(cache => {
                                        cache.put(event.request, responseToCache);
                                    });
                                    return networkResponse;
                                });
                            })
                        );
                    }
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob))
                .then(() => console.log('SW Registered for Caching'))
                .catch(err => console.log('SW Error:', err));
        }

        /* --- APP LOGIC --- */
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = 'login.html';

        let clientToken = null;
        let selectedFile = null;
        let allUsersCache = {};
        let videoObserver = null;
        let postsDataCache = {};
        
        // Touch Vars
        let startY = 0; let isPulling = false; const feedContainer = document.getElementById('feed-container');

        document.addEventListener('DOMContentLoaded', async () => {

            initVideoObserver();
            try {

                setInterval(startRealtimeUpdates, 4000);

        function setupEventListeners() {
            // Modal Toggles

            document.getElementById('close-modal-btn').onclick = () => document.getElementById('create-modal').classList.remove('active');
            
            // Upload
            const fileInput = document.getElementById('file-input');

                        img.src = URL.createObjectURL(selectedFile);

                }
            };
            document.getElementById('share-post-btn').onclick = handleUploadAndPost;

            // Options & Likes Modals
            document.getElementById('options-modal').onclick = (e) => { if(e.target === document.getElementById('options-modal')) closeOptions(); };
            document.getElementById('likes-modal').onclick = (e) => { if(e.target === document.getElementById('likes-modal')) document.getElementById('likes-modal').classList.remove('active'); };
            document.getElementById('close-likes-btn').onclick = () => document.getElementById('likes-modal').classList.remove('active');
            
            document.getElementById('delete-post-btn').onclick = handleDeletePost;
            document.getElementById('edit-post-btn').onclick = () => {
                closeOptions();
                const post = postsDataCache[window.currentOptionsPostId];
                document.getElementById('edit-caption-input').value = post.caption;
                document.getElementById('edit-caption-modal').classList.add('active');
            };
            document.getElementById('save-caption-btn').onclick = handleSaveCaption;
            document.getElementById('cancel-caption-btn').onclick = () => document.getElementById('edit-caption-modal').classList.remove('active');
            document.getElementById('privacy-toggle').onchange = handlePrivacyChange;

            // Pull Refresh
            feedContainer.addEventListener('touchstart', e => { if(feedContainer.scrollTop===0) { startY=e.touches[0].clientY; isPulling=true; } }, {passive:true});
            feedContainer.addEventListener('touchmove', e => {
                if(!isPulling) return;
                const diff = e.touches[0].clientY - startY;
                if(diff > 0 && feedContainer.scrollTop===0) {
                    e.preventDefault();
                    document.getElementById('pull-indicator').style.opacity = Math.min(diff/50,1);
                    document.getElementById('pull-spinner').style.transform = `rotate(${diff*2}deg)`;
                    feedContainer.style.transform = `translateY(${Math.min(diff*0.5, 80)}px)`;
                }
            }, {passive:false});
            feedContainer.addEventListener('touchend', async () => {
                if(!isPulling) return; isPulling=false;
                feedContainer.style.transform = '';
                if(document.getElementById('pull-indicator').style.opacity > 0.8) {
                    document.getElementById('pull-spinner').classList.add('spinning');
                    await fetchPosts();
                    document.getElementById('pull-spinner').classList.remove('spinning');
                }
                document.getElementById('pull-indicator').style.opacity = 0;
            });
        }

        async function refreshClientToken() {
            const res = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            const data = await res.json();
            clientToken = data.token;
        }

        async function fetchUsersCache() {
            const res = await fetch(`${PROXY_URL}?path=users`, { headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username } });
            if(res.ok) allUsersCache = await res.json() || {};
        }

        async function handleUploadAndPost() {
            if(!selectedFile) return showToast('فایل انتخاب نشده', 'error');
            const btn = document.getElementById('share-post-btn');
            btn.textContent = 'درحال آپلود...'; btn.disabled = true;

            const formData = new FormData(); formData.append('file', selectedFile);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_PHP_ENDPOINT, true);
            xhr.onload = async () => {
                try {
                    const res = JSON.parse(xhr.responseText);
                    if(res.success) {
                        await createPostRecord(res.url, selectedFile.type.startsWith('video') ? 'video':'image');
                    } else throw new Error('Upload Failed');
                } catch(e) { showToast('خطا در آپلود', 'error'); btn.disabled=false; }
            };
            xhr.send(formData);
        }

        async function createPostRecord(url, type) {
            const data = {
                sender_username: currentUser.username, media_url: url, type: type,
                caption: document.getElementById('caption-input').value,
                timestamp: new Date().toISOString(), likes: {},
                show_likes: document.getElementById('create-privacy-toggle').checked
            };
            await fetch(`${PROXY_URL}?path=rubino_posts`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            window.location.reload();
        }

        async function fetchPosts() {
            const res = await fetch(`${PROXY_URL}?path=rubino_posts`, { headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username } });
            document.getElementById('skeleton-loader').style.display = 'none';
            if(!res.ok) return;
            const data = await res.json() || {};
            postsDataCache = data;
            const posts = Object.entries(data).map(([k,v])=>({id:k,...v})).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
            
            feedContainer.innerHTML = '';
            posts.forEach(renderPost);
            attachVideoObserver();
        }

        function renderPost(post) {
            const isOwner = post.sender_username === currentUser.username;
            const user = allUsersCache[post.sender_username] || { displayName: post.sender_username };
            const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random`;
            const isLiked = post.likes && post.likes[currentUser.username];
            const likesCount = post.likes ? Object.keys(post.likes).length : 0;
            const verified = user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';
            
            // Media Logic with Loading & Controls
            let mediaHtml = '';
            if(post.type === 'video') {
                mediaHtml = `
                    <div class="media-loader-overlay" id="loader-${post.id}">
                        <div class="loader-spinner"></div>
                        <span class="loader-text">درحال دانلود...</span>
                    </div>
                    <video class="post-media" id="media-${post.id}" src="${post.media_url}" loop playsinline preload="metadata" 
                           oncanplay="handleMediaLoad('${post.id}')" onclick="toggleVideoPlay('${post.id}')"></video>
                    
                    <div class="play-overlay" id="play-icon-${post.id}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
                    <button class="video-control-btn" onclick="toggleVideoMute(event, '${post.id}')">
                         <svg id="mute-icon-${post.id}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                    </button>
                `;
            } else {
                mediaHtml = `
                    <div class="media-loader-overlay" id="loader-${post.id}">
                        <div class="loader-spinner"></div>
                    </div>
                    <img class="post-media" id="media-${post.id}" src="${post.media_url}" loading="lazy" onload="handleMediaLoad('${post.id}')" ondblclick="triggerLike('${post.id}')">
                `;
            }

            const div = document.createElement('div');
            div.className = 'post-card'; div.id = `post-${post.id}`;
            div.innerHTML = `
                <div class="post-header">
                    <div class="user-info">
                        <img src="${avatar}" class="user-avatar">
                        <span class="username">${user.displayName || post.sender_username} ${verified}</span>
                    </div>
                    <div class="post-options" onclick="${isOwner?`openOptions('${post.id}', ${post.show_likes!==false})`:''}">${isOwner?'●●●':''}</div>
                </div>
                <div class="post-media-container" ondblclick="triggerLike('${post.id}')">
                    ${mediaHtml}
                    <div class="heart-overlay" id="heart-${post.id}">❤</div>
                </div>
                <div class="post-actions">
                    <button class="action-btn ${isLiked?'liked':''}" id="btn-${post.id}" onclick="toggleLike('${post.id}')">
                        <svg viewBox="0 0 24 24" fill="${isLiked?'currentColor':'none'}" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </button>
                </div>
                <div class="post-likes ${(isOwner || post.show_likes!==false)?'clickable':''}" 
                     onclick="${(isOwner || post.show_likes!==false)?`showLikes('${post.id}')`:''}">
                    ${likesCount} پسند
                </div>
                <div class="post-caption"><span class="caption-username">${user.displayName}</span> ${post.caption}</div>
                <span class="post-time">${timeAgo(post.timestamp)}</span>
            `;
            feedContainer.appendChild(div);
        }

        /* --- MEDIA HANDLERS --- */
        function handleMediaLoad(id) {
            const loader = document.getElementById(`loader-${id}`);
            const media = document.getElementById(`media-${id}`);
            if(loader) loader.classList.add('hidden');
            if(media) media.classList.add('loaded');
        }

        function toggleVideoPlay(id) {
            const v = document.getElementById(`media-${id}`);
            const icon = document.getElementById(`play-icon-${id}`);
            if(v.paused) {
                v.play();
                icon.classList.remove('show');
            } else {
                v.pause();
                icon.classList.add('show');
            }
        }

        function toggleVideoMute(e, id) {
            e.stopPropagation(); // Prevent play toggle
            const v = document.getElementById(`media-${id}`);
            const icon = document.getElementById(`mute-icon-${id}`);
            v.muted = !v.muted;
            
            if(v.muted) {
                // Muted Icon
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            } else {
                // Sound On Icon
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            }
        }

        function initVideoObserver() {
            videoObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const vid = entry.target;
                    const id = vid.id.replace('media-', '');
                    const playIcon = document.getElementById(`play-icon-${id}`);
                    
                    if(entry.isIntersecting) {
                        vid.muted = true; // Auto-play usually requires mute
                        vid.play().then(() => {
                            if(playIcon) playIcon.classList.remove('show');
                        }).catch(() => {
                            if(playIcon) playIcon.classList.add('show');
                        });
                    } else {
                        vid.pause();
                        if(playIcon) playIcon.classList.add('show');
                    }
                });
            }, { threshold: 0.7 });
        }

        function attachVideoObserver() {
            document.querySelectorAll('video').forEach(v => videoObserver.observe(v));
        }

        /* --- LIKES & ACTIONS --- */
        async function toggleLike(id) {
            const btn = document.getElementById(`btn-${id}`);
            const isLiked = btn.classList.contains('liked');
            
            // Optimistic UI Update
            btn.classList.toggle('liked');
            const svg = btn.querySelector('svg');
            svg.setAttribute('fill', isLiked ? 'none' : '#ED4956');
            
            const method = isLiked ? 'DELETE' : 'PUT';
            await fetch(`${PROXY_URL}?path=rubino_posts/${id}/likes/${currentUser.username}`, {
                method: method,
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                body: isLiked ? undefined : 'true'
            });
        }

        function triggerLike(id) {
            const heart = document.getElementById(`heart-${id}`);
            heart.classList.remove('active');
            void heart.offsetWidth; 
            heart.classList.add('active');
            if(!document.getElementById(`btn-${id}`).classList.contains('liked')) toggleLike(id);
        }

        async function showLikes(postId) {
            const modal = document.getElementById('likes-modal');
            const container = document.getElementById('likes-list-container');
            modal.classList.add('active');
            container.innerHTML = '<div style="text-align:center; padding:20px;"><div class="pull-spinner spinning" style="display:inline-block"></div></div>';
            
            const res = await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes`, { headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }});
            const likes = await res.json();
            container.innerHTML = '';
            
            if(!likes) { container.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">هنوز لایکی نیست.</p>'; return; }

            Object.keys(likes).forEach(uid => {
                const u = allUsersCache[uid] || { displayName: uid };
                const verified = u.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';
                container.innerHTML += `
                    <div class="user-list-item">
                        <img src="${u.profilePicUrl || 'https://ui-avatars.com/api/?background=random'}" >
                        <div class="user-list-info">
                            <h4>${u.displayName || uid} ${verified}</h4>
                            <p>@${uid}</p>
                        </div>
                    </div>
                `;
            });
        }

        /* --- OPTIONS --- */
        window.currentOptionsPostId = null;
        function openOptions(id, isPublic) {
            window.currentOptionsPostId = id;
            document.getElementById('privacy-toggle').checked = isPublic;
            document.getElementById('options-modal').classList.add('active');
        }
        function closeOptions() { document.getElementById('options-modal').classList.remove('active'); }
        
        async function handleDeletePost() {
            if(!confirm('حذف شود؟')) return;
            await fetch(`${PROXY_URL}?path=rubino_posts/${window.currentOptionsPostId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }});
            closeOptions(); fetchPosts();
        }

        async function handleSaveCaption() {
            const val = document.getElementById('edit-caption-input').value;
            await fetch(`${PROXY_URL}?path=rubino_posts/${window.currentOptionsPostId}`, {
                method: 'PATCH', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                body: JSON.stringify({ caption: val })
            });
            document.getElementById('edit-caption-modal').classList.remove('active');
            fetchPosts();
        }

        async function handlePrivacyChange() {
             await fetch(`${PROXY_URL}?path=rubino_posts/${window.currentOptionsPostId}`, {
                method: 'PATCH', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                body: JSON.stringify({ show_likes: document.getElementById('privacy-toggle').checked })
            });
        }

        /* --- UTILS --- */
        function startRealtimeUpdates() { fetchPosts(); } // Simplified for demo
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('active'); setTimeout(()=>t.classList.remove('active'),3000); }
        function timeAgo(date) {
            const s = Math.floor((new Date() - new Date(date))/1000);
            if(s<60) return 'همین الان';
            if(s<3600) return `${Math.floor(s/60)} دقیقه پیش`;
            if(s<86400) return `${Math.floor(s/3600)} ساعت پیش`;
            return `${Math.floor(s/86400)} روز پیش`;
        }
    </script>
</body>
</html>
