<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو - همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #E1306C; /* رنگ برند روبینو/اینستاگرام */
            --primary-hover: #C13584;
            --like-color: #ED4956;
            --blue-accent: #0095f6;
            --modal-bg: #1C2128;
            --skeleton-base: #161B22;
            --skeleton-highlight: #21262d;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            background-color: var(--background-color);
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* --- HEADER --- */
        .header-area {
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .header-title {
            font-size: 1.4rem; font-weight: 900;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .add-post-btn {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; padding: 5px; transition: transform 0.2s;
        }
        .add-post-btn:active { transform: scale(0.9); }

        /* --- MAIN FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; padding-bottom: 80px; /* Space for footer */
            scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .post-header {
            padding: 10px 15px; display: flex; align-items: center; justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
            border: 1px solid var(--border-color);
        }
        .username { font-weight: 700; font-size: 0.9rem; color: var(--text-primary); }
        .post-options { color: var(--text-secondary); cursor: pointer; }

        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 300px; display: flex; align-items: center;
        }
        .post-media { width: 100%; height: auto; max-height: 500px; object-fit: contain; }
        
        /* Heart Animation Overlay */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            color: rgba(255, 255, 255, 0.9); font-size: 80px; pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        .heart-overlay.active { transform: translate(-50%, -50%) scale(1); opacity: 1; animation: heartFade 0.8s forwards; }
        @keyframes heartFade { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

        .post-actions { padding: 10px 15px 5px; display: flex; gap: 15px; font-size: 1.5rem; }
        .action-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 0; transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.85); }
        .action-btn.liked { color: var(--like-color); animation: likeBounce 0.3s; }
        .action-btn.liked svg { fill: var(--like-color); }
        @keyframes likeBounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .post-likes { padding: 0 15px; font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
        .post-caption { padding: 0 15px 15px; font-size: 0.9rem; line-height: 1.4; }
        .caption-username { font-weight: 700; margin-left: 5px; }
        .post-time { font-size: 0.7rem; color: var(--text-secondary); margin-top: 5px; display: block; }

        /* --- FOOTER --- */
        .main-footer {
            padding: 10px 0; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            background-color: var(--secondary-color); position: absolute; bottom: 0; width: 100%; z-index: 10;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-secondary);
            display: flex; flex-direction: column; align-items: center; font-size: 0.75em;
            cursor: pointer; transition: color 0.3s;
        }
        .nav-btn.active { color: var(--text-primary); }
        .nav-btn svg { width: 26px; height: 26px; margin-bottom: 4px; }

        /* --- SKELETON LOADER --- */
        #skeleton-loader {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 120px);
            background: var(--background-color); z-index: 15; overflow: hidden;
        }
        .sk-post { margin-bottom: 20px; background: var(--secondary-color); padding-bottom: 10px; }
        .sk-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .sk-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--skeleton-base); }
        .sk-name { width: 100px; height: 14px; border-radius: 4px; background: var(--skeleton-base); }
        .sk-image { width: 100%; height: 300px; background: var(--skeleton-base); }
        .sk-actions { height: 30px; margin: 10px; width: 50%; background: var(--skeleton-base); border-radius: 4px; }
        
        .skeleton-animate {
            animation: shimmer 1.5s infinite linear;
            background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-highlight) 50%, var(--skeleton-base) 100%);
            background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* --- CREATE POST MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--modal-bg); width: 90%; max-width: 400px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-header {
            padding: 12px 15px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-weight: 700; margin: 0; }
        .share-btn { color: var(--blue-accent); font-weight: 700; background: none; border: none; cursor: pointer; }
        .share-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .close-modal { color: var(--text-primary); background: none; border: none; cursor: pointer; }
        
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .upload-area {
            border: 2px dashed var(--border-color); border-radius: 8px;
            padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color 0.3s;
        }
        .upload-area:hover { border-color: var(--text-secondary); }
        .upload-area svg { width: 40px; height: 40px; color: var(--text-primary); margin-bottom: 10px; }
        .upload-preview {
            width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; display: none; background: #000;
        }
        .caption-input {
            width: 100%; background: var(--secondary-color); border: none; color: var(--text-primary);
            padding: 10px; border-radius: 8px; font-family: 'Vazirmatn'; resize: none; min-height: 80px;
        }
        .caption-input:focus { outline: none; }
        
        .progress-bar-container { width: 100%; height: 4px; background: var(--secondary-color); border-radius: 2px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--blue-accent); border-radius: 2px; transition: width 0.2s; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="add-post-btn" id="open-create-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            <h1 class="header-title">Rubino</h1>
            <div style="width: 28px;"></div> <!-- Spacer for centering -->
        </header>

        <!-- Skeleton Loader -->
        <div id="skeleton-loader">
            <div class="sk-post">
                <div class="sk-header"><div class="sk-avatar skeleton-animate"></div><div class="sk-name skeleton-animate"></div></div>
                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
            <div class="sk-post">
                <div class="sk-header"><div class="sk-avatar skeleton-animate"></div><div class="sk-name skeleton-animate"></div></div>
                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
        </div>

        <!-- Feed -->
        <div class="feed-container" id="feed-container">
            <!-- Posts will be injected here -->
        </div>

        <!-- Create Post Modal -->
        <div class="modal-overlay" id="create-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <button class="close-modal" id="close-modal-btn">لغو</button>
                    <h3 class="modal-title">پست جدید</h3>
                    <button class="share-btn" id="share-post-btn">اشتراک‌گذاری</button>
                </div>
                <div class="modal-body">
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    
                    <div class="upload-area" id="upload-trigger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>انتخاب عکس یا ویدیو</p>
                    </div>
                    
                    <img id="image-preview" class="upload-preview" />
                    <video id="video-preview" class="upload-preview" controls></video>

                    <textarea class="caption-input" id="caption-input" placeholder="کپشن خود را بنویسید..."></textarea>
                    
                    <div class="progress-bar-container" id="upload-progress-container">
                        <div class="progress-bar" id="upload-progress"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Navigation -->
        <footer class="main-footer">
            <button class="nav-btn" onclick="window.location.href='safe_asli.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>پروفایل</span>
            </button>
            <button class="nav-btn active">
                <!-- آیکون روبینو (مشابه لایه‌ها یا گرید) -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 11l-2.5-1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
                <span>روبینو</span>
            </button>
            <button class="nav-btn" onclick="window.location.href='safe_asli.html'">
                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>چت‌ها</span>
            </button>
            <button class="nav-btn" onclick="window.location.href='safe_asli.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>خانه</span>
            </button>
        </footer>
    </div>

    <script>
        // --- CONFIG ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const UPLOAD_PHP_ENDPOINT = 'https://miko.freehost.io/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234';

        // --- DOM ELEMENTS ---
        const feedContainer = document.getElementById('feed-container');
        const skeletonLoader = document.getElementById('skeleton-loader');
        const createModal = document.getElementById('create-modal');
        const openCreateBtn = document.getElementById('open-create-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const sharePostBtn = document.getElementById('share-post-btn');
        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const imagePreview = document.getElementById('image-preview');
        const videoPreview = document.getElementById('video-preview');
        const captionInput = document.getElementById('caption-input');
        const progressBarContainer = document.getElementById('upload-progress-container');
        const progressBar = document.getElementById('upload-progress');

        // --- STATE ---
        let currentUser = null;
        let clientToken = null;
        let selectedFile = null;
        let allUsersCache = {};

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(storedUser);

            setupEventListeners();
            
            try {
                await refreshClientToken();
                await fetchUsersCache(); // Pre-load usernames/avatars
                await fetchPosts();
            } catch (error) {
                console.error(error);
                feedContainer.innerHTML = '<div class="empty-state">خطا در بارگذاری.</div>';
                skeletonLoader.style.display = 'none';
            }
        });

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            openCreateBtn.addEventListener('click', () => {
                resetModal();
                createModal.classList.add('active');
            });

            closeModalBtn.addEventListener('click', () => {
                createModal.classList.remove('active');
            });

            uploadTrigger.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileSelect(e.target.files[0]);
                }
            });

            sharePostBtn.addEventListener('click', handleUploadAndPost);
        }

        // --- FILE HANDLING ---
        function handleFileSelect(file) {
            selectedFile = file;
            const reader = new FileReader();
            
            uploadTrigger.style.display = 'none';
            
            if (file.type.startsWith('video/')) {
                imagePreview.style.display = 'none';
                videoPreview.style.display = 'block';
                videoPreview.src = URL.createObjectURL(file);
            } else {
                videoPreview.style.display = 'none';
                imagePreview.style.display = 'block';
                reader.onload = (e) => imagePreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        function resetModal() {
            selectedFile = null;
            fileInput.value = '';
            captionInput.value = '';
            imagePreview.src = '';
            videoPreview.src = '';
            imagePreview.style.display = 'none';
            videoPreview.style.display = 'none';
            uploadTrigger.style.display = 'block';
            progressBarContainer.style.display = 'none';
            progressBar.style.width = '0%';
            sharePostBtn.disabled = false;
            sharePostBtn.textContent = 'اشتراک‌گذاری';
        }

        // --- NETWORKING ---
        async function refreshClientToken() {
            const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            if (!response.ok) throw new Error('Token Error');
            const data = await response.json();
            clientToken = data.token;
        }

        async function fetchUsersCache() {
            const response = await fetch(`${PROXY_URL}?path=users`, {
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
            });
            if (response.ok) {
                allUsersCache = await response.json() || {};
            }
        }

        // --- UPLOAD & POST LOGIC ---
        async function handleUploadAndPost() {
            if (!selectedFile) {
                alert('لطفاً یک عکس یا ویدیو انتخاب کنید.');
                return;
            }

            sharePostBtn.disabled = true;
            sharePostBtn.textContent = 'در حال آپلود...';
            progressBarContainer.style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_PHP_ENDPOINT, true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    progressBar.style.width = percent + '%';
                }
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (result.success && result.url) {
                            await createPostRecord(result.url, selectedFile.type.startsWith('video/') ? 'video' : 'image');
                        } else {
                            throw new Error(result.error || 'Upload failed');
                        }
                    } catch (err) {
                        alert('خطا در آپلود: ' + err.message);
                        sharePostBtn.disabled = false;
                        sharePostBtn.textContent = 'اشتراک‌گذاری';
                    }
                } else {
                    alert('خطای سرور: ' + xhr.status);
                    sharePostBtn.disabled = false;
                    sharePostBtn.textContent = 'اشتراک‌گذاری';
                }
            };

            xhr.onerror = () => {
                alert('خطای شبکه.');
                sharePostBtn.disabled = false;
                sharePostBtn.textContent = 'اشتراک‌گذاری';
            };

            xhr.send(formData);
        }

        async function createPostRecord(mediaUrl, type) {
            sharePostBtn.textContent = 'در حال ذخیره...';
            
            const postData = {
                sender_username: currentUser.username,
                media_url: mediaUrl,
                type: type,
                caption: captionInput.value.trim(),
                timestamp: new Date().toISOString(),
                likes: {}
            };

            try {
                // Using Firebase Proxy to push to 'rubino_posts' node
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${clientToken}`,
                        'X-User-Username': currentUser.username,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postData)
                });

                if (response.ok) {
                    createModal.classList.remove('active');
                    await fetchPosts(); // Refresh feed
                } else {
                    throw new Error('Save failed');
                }
            } catch (err) {
                alert('خطا در ذخیره پست: ' + err.message);
                sharePostBtn.disabled = false;
            }
        }

        // --- FEED RENDERING ---
        async function fetchPosts() {
            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                
                skeletonLoader.style.display = 'none';

                if (!response.ok) {
                    // 404 means no posts yet usually in firebase
                    if (response.status === 404) {
                         feedContainer.innerHTML = '<div class="empty-state">هنوز پستی ارسال نشده است.<br>اولین نفر باشید!</div>';
                         return;
                    }
                    throw new Error('Fetch failed');
                }

                const data = await response.json();
                if (!data) {
                    feedContainer.innerHTML = '<div class="empty-state">هنوز پستی ارسال نشده است.</div>';
                    return;
                }

                // Convert object to array and sort by date desc
                const posts = Object.entries(data).map(([key, val]) => ({ id: key, ...val }))
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                renderFeed(posts);

            } catch (err) {
                console.error(err);
                skeletonLoader.style.display = 'none';
                feedContainer.innerHTML = '<div class="empty-state">خطا در دریافت پست‌ها.</div>';
            }
        }

        function renderFeed(posts) {
            feedContainer.innerHTML = '';
            posts.forEach(post => {
                const user = allUsersCache[post.sender_username] || { displayName: post.sender_username, profilePicUrl: null };
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random`;
                const isLiked = post.likes && post.likes[currentUser.username];
                const likeCount = post.likes ? Object.keys(post.likes).length : 0;

                const postEl = document.createElement('div');
                postEl.className = 'post-card';
                
                let mediaHtml = '';
                if (post.type === 'video') {
                    mediaHtml = `<video class="post-media" src="${post.media_url}" controls playsinline></video>`;
                } else {
                    mediaHtml = `<img class="post-media" src="${post.media_url}" loading="lazy" ondblclick="triggerLike('${post.id}')">`;
                }

                postEl.innerHTML = `
                    <div class="post-header">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar" alt="Avatar">
                            <span class="username">${user.displayName || post.sender_username}</span>
                        </div>
                        <div class="post-options">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        </div>
                    </div>
                    <div class="post-media-container" id="media-container-${post.id}">
                        ${mediaHtml}
                        <div class="heart-overlay" id="heart-anim-${post.id}">❤</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike('${post.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                        <button class="action-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                    <div class="post-likes" id="likes-count-${post.id}">${likeCount} پسند</div>
                    <div class="post-caption">
                        <span class="caption-username">${user.displayName || post.sender_username}</span>
                        ${post.caption}
                        <span class="post-time">${timeAgo(post.timestamp)}</span>
                    </div>
                `;
                feedContainer.appendChild(postEl);
            });
        }

        // --- LIKE LOGIC ---
        window.toggleLike = async (postId) => {
            const btn = document.getElementById(`like-btn-${postId}`);
            const countEl = document.getElementById(`likes-count-${postId}`);
            const isLiked = btn.classList.contains('liked');
            
            // Optimistic UI Update
            let currentCount = parseInt(countEl.textContent);
            if (isLiked) {
                btn.classList.remove('liked');
                btn.querySelector('svg').setAttribute('fill', 'none');
                countEl.textContent = (currentCount - 1) + ' پسند';
            } else {
                btn.classList.add('liked');
                btn.querySelector('svg').setAttribute('fill', 'currentColor');
                countEl.textContent = (currentCount + 1) + ' پسند';
            }

            // Server Request
            const path = `rubino_posts/${postId}/likes/${currentUser.username}`;
            try {
                if (isLiked) {
                    await fetch(`${PROXY_URL}?path=${path}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                    });
                } else {
                    await fetch(`${PROXY_URL}?path=${path}`, {
                        method: 'PUT', // Using PUT to set "true"
                        headers: { 
                            'Authorization': `Bearer ${clientToken}`, 
                            'X-User-Username': currentUser.username,
                            'Content-Type': 'application/json'
                        },
                        body: 'true'
                    });
                }
            } catch (err) {
                console.error('Like failed', err);
                // Revert UI if needed (omitted for brevity)
            }
        };

        window.triggerLike = (postId) => {
            // Double tap animation logic
            const heart = document.getElementById(`heart-anim-${postId}`);
            const btn = document.getElementById(`like-btn-${postId}`);
            
            // Trigger Animation
            heart.classList.remove('active');
            void heart.offsetWidth; // trigger reflow
            heart.classList.add('active');

            // If not liked, toggle like
            if (!btn.classList.contains('liked')) {
                toggleLike(postId);
            }
        };

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            const days = Math.floor(hours / 24);
            return `${days} روز پیش`;
        }

    </script>
</body>
</html>
