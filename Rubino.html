<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF; /* هم‌رنگ با همیار */
            --like-color: #ED4956;
            --modal-bg: #1C2128;
            --skeleton-base: #161B22;
            --skeleton-highlight: #21262d;
            --danger-color: #FF4D4D;
            --toast-bg: rgba(40, 167, 69, 0.9);
            --toast-error: rgba(220, 53, 69, 0.9);
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
            background: radial-gradient(circle at top left, #1a202c 0%, var(--background-color) 70%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* --- HEADER --- */
        .header-area {
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .header-title {
            font-size: 1.4rem; 
            font-weight: 900;
            margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 8px rgba(0, 163, 255, 0.4);
            letter-spacing: 0.5px;
        }
        .header-btn {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; padding: 5px; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .header-btn:active { transform: scale(0.9); }
        .back-btn svg { width: 24px; height: 24px; color: var(--text-secondary); }

        /* --- PULL TO REFRESH --- */
        .pull-indicator {
            position: absolute; top: 60px; left: 0; right: 0; height: 50px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; transition: transform 0.2s; z-index: 10; opacity: 0;
        }
        .pull-spinner {
            width: 25px; height: 25px;
            border: 3px solid var(--secondary-hover); border-top-color: var(--primary-color);
            border-radius: 50%;
        }
        .pull-spinner.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MAIN FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; 
            padding-bottom: 20px;
            scrollbar-width: none;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px; padding-bottom: 10px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--secondary-hover);
        }
        .username { 
            font-weight: 700; font-size: 0.95rem; color: var(--text-primary); 
            display: flex; align-items: center; gap: 4px;
        }
        .verified-tick {
            width: 16px; height: 16px;
            filter: drop-shadow(0 0 2px rgba(0, 163, 255, 0.5));
            vertical-align: middle;
        }
        
        .post-options { 
            color: var(--text-secondary); cursor: pointer; padding: 5px; border-radius: 50%; transition: background 0.2s;
        }
        .post-options.disabled { opacity: 0.3; cursor: default; }
        .post-options:not(.disabled):hover { background-color: var(--secondary-hover); color: var(--text-primary); }

        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 300px; display: flex; align-items: center; justify-content: center;
        }
        .post-media { width: 100%; height: auto; max-height: 550px; object-fit: contain; }
        
        /* Heart Animation */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            color: rgba(255, 255, 255, 0.9); font-size: 80px; pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        .heart-overlay.active { transform: translate(-50%, -50%) scale(1); opacity: 1; animation: heartFade 0.8s forwards; }
        @keyframes heartFade { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

        .post-actions { padding: 12px 15px 8px; display: flex; gap: 18px; }
        .action-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 0; transition: transform 0.1s; }
        .action-btn svg { width: 26px; height: 26px; stroke-width: 1.8; }
        .action-btn:active { transform: scale(0.85); }
        .action-btn.liked { color: var(--like-color); animation: likeBounce 0.3s; }
        .action-btn.liked svg { fill: var(--like-color); stroke: var(--like-color); }
        @keyframes likeBounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .post-likes { 
            padding: 0 15px; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; 
            cursor: pointer; width: fit-content; transition: opacity 0.2s;
        }
        .post-likes:active { opacity: 0.7; }

        .post-caption { padding: 0 15px 5px; font-size: 0.9rem; line-height: 1.5; word-wrap: break-word; }
        .caption-username { font-weight: 700; margin-left: 5px; }
        .post-time { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; display: block; padding: 0 15px; }

        /* --- SKELETON LOADER --- */
        #skeleton-loader {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            background: var(--background-color); z-index: 15; overflow: hidden;
        }
        .sk-post { margin-bottom: 20px; background: var(--secondary-color); padding-bottom: 10px; }
        .sk-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .sk-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--skeleton-base); }
        .sk-name { width: 100px; height: 14px; border-radius: 4px; background: var(--skeleton-base); }
        .sk-image { width: 100%; height: 350px; background: var(--skeleton-base); }
        .sk-actions { height: 30px; margin: 10px; width: 40%; background: var(--skeleton-base); border-radius: 4px; }
        .skeleton-animate {
            animation: shimmer 1.5s infinite linear;
            background: linear-gradient(90deg, var(--skeleton-base) 0%, var(--skeleton-highlight) 50%, var(--skeleton-base) 100%);
            background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        /* Bottom Sheet (Options & Likes) */
        .bottom-sheet { align-items: flex-end; }
        .sheet-card {
            background: var(--modal-bg); width: 100%; max-width: 480px; 
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 20px 0 10px 0;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .sheet-card { transform: translateY(0); }

        .sheet-option {
            width: 100%; padding: 15px 25px; text-align: right; background: none; border: none;
            color: var(--text-primary); font-size: 1rem; font-family: 'Vazirmatn';
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-option:last-child { border-bottom: none; }
        .sheet-option:active { background-color: var(--secondary-hover); }
        .sheet-option svg { width: 22px; height: 22px; color: var(--text-secondary); }
        .sheet-option.danger { color: var(--danger-color); }
        .sheet-option.danger svg { color: var(--danger-color); }

        /* Toggle Switch */
        .toggle-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--secondary-hover); transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Create Modal */
        .modal-card {
            background: var(--modal-bg); width: 90%; max-width: 400px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-header {
            padding: 12px 15px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .modal-title { font-weight: 700; margin: 0; font-size: 1rem; }
        .share-btn { color: var(--primary-color); font-weight: 700; background: none; border: none; cursor: pointer; font-size: 1rem; }
        .share-btn:disabled { opacity: 0.5; cursor: wait; }
        .close-modal { color: var(--text-primary); background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .upload-area {
            border: 2px dashed var(--border-color); border-radius: 8px;
            padding: 30px 20px; text-align: center; cursor: pointer; transition: border-color 0.3s;
        }
        .upload-area:hover { border-color: var(--text-secondary); }
        .upload-preview { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; display: none; background: #000; }
        .caption-input {
            width: 100%; background: var(--secondary-color); border: none; color: var(--text-primary);
            padding: 10px; border-radius: 8px; font-family: 'Vazirmatn'; resize: none; min-height: 80px;
        }
        .caption-input:focus { outline: none; box-shadow: 0 0 0 1px var(--primary-color); }
        .progress-bar-container { width: 100%; height: 4px; background: var(--secondary-color); border-radius: 2px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary-color); border-radius: 2px; transition: width 0.2s; }

        /* --- USER LIST MODAL (LIKES) STYLE --- */
        .user-list-content { 
            max-height: 60vh; 
            overflow-y: auto; 
            padding: 0; 
            flex-grow: 1;
        }
        /* Custom Scrollbar for User List */
        .user-list-content::-webkit-scrollbar { width: 5px; }
        .user-list-content::-webkit-scrollbar-track { background: var(--modal-bg); }
        .user-list-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .user-list-content::-webkit-scrollbar-thumb:hover { background: var(--secondary-hover); }

        .user-list-item { 
            display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border-color); 
            transition: background 0.2s;
        }
        .user-list-item:last-child { border-bottom: none; }
        .user-list-item:hover { background-color: var(--secondary-hover); }
        .user-list-item img { width: 40px; height: 40px; border-radius: 50%; margin-left: 12px; object-fit: cover; }
        .user-list-info { display: flex; flex-direction: column; justify-content: center; }
        
        /* Updated Tick Style for List */
        .user-list-info h4 { 
            margin: 0; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; color: var(--text-primary);
        }
        .user-list-info h4 .verified-tick {
            width: 16px; height: 16px; 
            filter: drop-shadow(0 0 2px rgba(0, 163, 255, 0.5));
        }
        .user-list-info p { margin: 2px 0 0; font-size: 0.8rem; color: var(--text-secondary); }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        
        /* Toast Notification */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg); color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; z-index: 2000; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
        }
        .toast.error { background: var(--toast-error); }
        .toast.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="header-btn back-btn" onclick="window.location.href='safe_asli.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="header-title">روبینو همیار</h1>
            <button class="header-btn" id="open-create-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>

        <!-- Pull to Refresh Spinner -->
        <div class="pull-indicator" id="pull-indicator">

        <!-- Skeleton Loader -->
        <div id="skeleton-loader">

                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
            <div class="sk-post">
                <div class="sk-header"><div class="sk-avatar skeleton-animate"></div><div class="sk-name skeleton-animate"></div></div>
                <div class="sk-image skeleton-animate"></div>
                <div class="sk-actions skeleton-animate"></div>
            </div>
        </div>

        <!-- Feed -->
        <div class="feed-container" id="feed-container">
            <!-- Posts will be injected here -->
        </div>

        <!-- Create Post Modal -->
        <div class="modal-overlay" id="create-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <button class="close-modal" id="close-modal-btn">&times;</button>
                    <h3 class="modal-title">پست جدید</h3>
                    <button class="share-btn" id="share-post-btn">انتشار</button>

                <div class="modal-body">
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    
                    <div class="upload-area" id="upload-trigger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>انتخاب عکس یا ویدیو</p>
                    </div>
                    
                    <img id="image-preview" class="upload-preview" />
                    <video id="video-preview" class="upload-preview" controls></video>

                    <textarea class="caption-input" id="caption-input" placeholder="کپشن خود را بنویسید..."></textarea>
                    
                    <!-- NEW OPTION IN CREATE MODAL -->
                    <div class="toggle-container" style="padding: 0 5px;">
                        <span style="font-size: 0.9rem; color: var(--text-secondary);">نمایش لیست لایک‌ها به دیگران</span>
                        <label class="switch">
                            <input type="checkbox" id="create-privacy-toggle">
                            <span class="slider"></span>

                    </div>

                    <div class="progress-bar-container" id="upload-progress-container">

                    </div>
                </div>
            </div>
        </div>

        <!-- Post Options Modal (Bottom Sheet) -->
        <div class="modal-overlay bottom-sheet" id="options-modal">
            <div class="sheet-card">
                <div class="sheet-option">
                    <div class="toggle-container">
                        <span>نمایش لیست لایک‌ها به دیگران</span>
                        <label class="switch">
                            <input type="checkbox" id="privacy-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <button class="sheet-option" id="edit-post-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    ویرایش کپشن
                </button>
                <button class="sheet-option danger" id="delete-post-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>

        <!-- Edit Caption Sub-Modal -->

             <div class="modal-card">

                 <div class="modal-body">

                 </div>
             </div>
        </div>

        <!-- Likes List Modal (Bottom Sheet) -->
        <div class="modal-overlay bottom-sheet" id="likes-modal">
            <div class="sheet-card" style="max-height: 80vh;">
                <div class="modal-header">

                </div>
                <div class="user-list-content" id="likes-list-container">

                </div>

        </div>
        
        <!-- Toast Element -->
        <div class="toast" id="toast">پیام سیستم</div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';

        // --- DOM REFERENCES ---

        const skeletonLoader = document.getElementById('skeleton-loader');
        
        // Modals

        // Inputs
        const fileInput = document.getElementById('file-input');

        const captionInput = document.getElementById('caption-input');
        const editCaptionInput = document.getElementById('edit-caption-input');
        const progressBarContainer = document.getElementById('upload-progress-container');
        const progressBar = document.getElementById('upload-progress');
        const privacyToggle = document.getElementById('privacy-toggle');

        // Refresh
        const pullIndicator = document.getElementById('pull-indicator');
        const pullSpinner = document.getElementById('pull-spinner');
        const toast = document.getElementById('toast');

        // --- APP STATE ---
        let currentUser = null;
        let clientToken = null;
        let selectedFile = null;
        let allUsersCache = {};
        let currentOptionsPostId = null; 
        let currentViewingLikesPostId = null; // Track which likes list is open
        let postsDataCache = {}; // Cache for detecting changes

        // Touch vars
        let startY = 0; let isPulling = false; let currentTranslate = 0;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(storedUser);

            setupEventListeners();
            
            try {
                await refreshClientToken();
                await fetchUsersCache(); 
                await fetchPosts();
                
                // Start Timers
                setInterval(updateLiveTimestamps, 60000); // 1 min for "Time Ago"
                setInterval(startRealtimeUpdates, LIVE_UPDATE_INTERVAL); // 3 sec for Data Sync
            } catch (error) {
                console.error(error);
                feedContainer.innerHTML = '<div class="empty-state">خطا در اتصال به سرور.</div>';
                skeletonLoader.style.display = 'none';
            }
        });

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Create Post
            openCreateBtn.addEventListener('click', () => { resetModal(); createModal.classList.add('active'); });
            closeModalBtn.addEventListener('click', () => createModal.classList.remove('active'));
            uploadTrigger.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
            });
            sharePostBtn.addEventListener('click', handleUploadAndPost);

            // Options Modal
            optionsModal.addEventListener('click', (e) => { if(e.target === optionsModal) closeOptions(); });
            closeOptionsBtn.addEventListener('click', closeOptions);
            
            // Likes Modal
            likesModal.addEventListener('click', (e) => { 
                if(e.target === likesModal) {
                    likesModal.classList.remove('active'); 
                    currentViewingLikesPostId = null;
                }
            });
            closeLikesBtn.addEventListener('click', () => {
                likesModal.classList.remove('active');
                currentViewingLikesPostId = null;
            });

            // Post Actions
            deletePostBtn.addEventListener('click', handleDeletePost);
            editPostBtn.addEventListener('click', () => {
                closeOptions();
                const post = postsDataCache[currentOptionsPostId];
                editCaptionInput.value = post ? post.caption : '';
                editCaptionModal.classList.add('active');
            });

            cancelCaptionBtn.addEventListener('click', () => editCaptionModal.classList.remove('active'));
            saveCaptionBtn.addEventListener('click', handleSaveCaption);
            
            // Privacy Toggles
            privacyToggle.addEventListener('change', handlePrivacyChange);

            // Pull to Refresh
            feedContainer.addEventListener('touchstart', touchStart, {passive: true});
            feedContainer.addEventListener('touchmove', touchMove, {passive: false});
            feedContainer.addEventListener('touchend', touchEnd);
        }

        // --- FILE & MODAL LOGIC ---
        function handleFileSelect(file) {
            selectedFile = file;
            const reader = new FileReader();
            uploadTrigger.style.display = 'none';
            if (file.type.startsWith('video/')) {
                imagePreview.style.display = 'none'; videoPreview.style.display = 'block';
                videoPreview.src = URL.createObjectURL(file);
            } else {
                videoPreview.style.display = 'none'; imagePreview.style.display = 'block';
                reader.onload = (e) => imagePreview.src = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        function resetModal() {
            selectedFile = null;
            fileInput.value = ''; captionInput.value = '';
            imagePreview.src = ''; videoPreview.src = '';
            imagePreview.style.display = 'none'; videoPreview.style.display = 'none';
            uploadTrigger.style.display = 'block';
            progressBarContainer.style.display = 'none'; progressBar.style.width = '0%';
            sharePostBtn.disabled = false; sharePostBtn.textContent = 'انتشار';
            createPrivacyToggle.checked = false; // Default: DISABLED
        }

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast ${type} active`;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // --- NETWORK CORE ---
        async function refreshClientToken() {
            const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            if (!response.ok) throw new Error('Auth Failed');
            const data = await response.json();
            clientToken = data.token;
        }

        async function fetchUsersCache() {
            const response = await fetch(`${PROXY_URL}?path=users`, {
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
            });
            if (response.ok) allUsersCache = await response.json() || {};
        }

        // --- UPLOAD & CREATE POST ---
        async function handleUploadAndPost() {
            if (!selectedFile) { showToast('فایلی انتخاب نشده است', 'error'); return; }
            sharePostBtn.disabled = true; sharePostBtn.textContent = 'در حال آپلود...';
            progressBarContainer.style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', UPLOAD_PHP_ENDPOINT, true);
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) progressBar.style.width = ((e.loaded / e.total) * 100) + '%';
            };

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (result.success && result.url) {
                            await createPostRecord(result.url, selectedFile.type.startsWith('video/') ? 'video' : 'image');
                        } else throw new Error(result.error);
                    } catch (err) { showToast(err.message, 'error'); sharePostBtn.disabled = false; }
                } else { showToast('خطای سرور', 'error'); sharePostBtn.disabled = false; }
            };
            xhr.send(formData);
        }

        async function createPostRecord(mediaUrl, type) {
            sharePostBtn.textContent = 'ذخیره...';
            const postData = {
                sender_username: currentUser.username,
                media_url: mediaUrl,
                type: type,
                caption: captionInput.value.trim(),
                timestamp: new Date().toISOString(),
                likes: {},
                show_likes: createPrivacyToggle.checked // Uses the checkbox value (Default false)
            };

            try {
                await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });
                createModal.classList.remove('active');
                await fetchPosts();
                showToast('پست منتشر شد');
            } catch (err) { showToast('خطا در انتشار', 'error'); sharePostBtn.disabled = false; }
        }

        // --- FEED & REALTIME LOGIC ---
        async function fetchPosts() {
            const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
            });
            skeletonLoader.style.display = 'none';
            
            if (!response.ok && response.status !== 404) return;
            
            const data = await response.json() || {};
            postsDataCache = data; // Update Cache

            const posts = Object.entries(data).map(([key, val]) => ({ id: key, ...val }))
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            if (posts.length === 0) {
                feedContainer.innerHTML = '<div class="empty-state">هیچ پستی وجود ندارد.</div>';
            } else {
                renderFeed(posts);
            }
        }

        function renderFeed(posts) {
            // Important: We only render full list on load or refresh. 
            // Realtime updates will manipulate existing DOM to avoid flickering.
            // But if feed is empty or totally diff, we rebuild.
            
            // Simple approach for this demo: clear and rebuild initially.
            feedContainer.innerHTML = '';
            
            posts.forEach(post => {
                const isOwner = post.sender_username === currentUser.username;
                const user = allUsersCache[post.sender_username] || { displayName: post.sender_username };
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random`;
                const isLiked = post.likes && post.likes[currentUser.username];
                const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                const verifiedHtml = user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : '';

                // Visibility of likes button text logic
                // If I am owner: always see count.
                // If not owner: see count ONLY IF show_likes is true.
                const canSeeLikes = isOwner || (post.show_likes !== false); 
                const likesText = canSeeLikes ? `${likeCount} پسند` : '';
                const likesClickAction = canSeeLikes ? `onclick="showLikesList('${post.id}', ${isOwner}, ${post.show_likes !== false})"` : '';

                const postEl = document.createElement('div');
                postEl.className = 'post-card';
                postEl.id = `post-${post.id}`;
                
                let mediaHtml = post.type === 'video' 
                    ? `<video class="post-media" src="${post.media_url}" controls playsinline></video>`
                    : `<img class="post-media" src="${post.media_url}" loading="lazy" ondblclick="triggerLike('${post.id}')">`;

                postEl.innerHTML = `
                    <div class="post-header">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar" alt="Avatar">
                            <span class="username">${user.displayName || post.sender_username} ${verifiedHtml}</span>
                        </div>
                        <div class="post-options ${isOwner ? '' : 'disabled'}" ${isOwner ? `onclick="openPostOptions('${post.id}', ${post.show_likes !== false})"` : ''}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        </div>
                    </div>
                    <div class="post-media-container" id="media-container-${post.id}">
                        ${mediaHtml}
                        <div class="heart-overlay" id="heart-anim-${post.id}">❤</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike('${post.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                    </div>
                    <div class="post-likes" id="likes-count-${post.id}" ${likesClickAction}>
                        ${likesText}
                    </div>
                    <div class="post-caption">
                        <span class="caption-username">${user.displayName || post.sender_username}</span>
                        <span class="caption-text">${post.caption}</span>
                    </div>
                    <span class="post-time" data-timestamp="${post.timestamp}">${timeAgo(post.timestamp)}</span>
                `;
                feedContainer.appendChild(postEl);
            });
        }

        // --- REALTIME UPDATER ---
        async function startRealtimeUpdates() {
            try {
                // 1. Fetch new data
                const response = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                if (!response.ok) return;
                const newData = await response.json() || {};

                // 2. Iterate existing DOM posts
                const domPosts = document.querySelectorAll('.post-card');
                
                // Remove deleted posts
                domPosts.forEach(el => {
                    const pid = el.id.replace('post-', '');
                    if (!newData[pid]) {
                        el.remove(); // Delete animation could be added here
                    }
                });

                // Update existing posts & Check for current Viewing Likes
                Object.keys(newData).forEach(key => {
                    const post = newData[key];
                    const el = document.getElementById(`post-${key}`);
                    
                    if (el) {
                        // Check Privacy Force Close Logic
                        const isOwner = post.sender_username === currentUser.username;
                        // If I am looking at THIS post's likes, and it became private, and I am not owner
                        if (currentViewingLikesPostId === key && post.show_likes === false && !isOwner) {
                            likesModal.classList.remove('active');
                            currentViewingLikesPostId = null;
                            showToast('مالک پست نمایش لیست پسندها را غیرفعال کرد.', 'error');
                        }

                        // Update Caption
                        const capEl = el.querySelector('.caption-text');
                        if (capEl && capEl.textContent !== post.caption) {
                            capEl.textContent = post.caption;
                        }

                        // Update Like Visibility in UI
                        const likeCountEl = el.querySelector('.post-likes');
                        const canSee = isOwner || (post.show_likes !== false);
                        const likeCount = post.likes ? Object.keys(post.likes).length : 0;
                        
                        if (canSee) {
                            likeCountEl.textContent = `${likeCount} پسند`;
                            likeCountEl.setAttribute('onclick', `showLikesList('${key}', ${isOwner}, true)`);
                            likeCountEl.style.display = 'block';
                        } else {
                            likeCountEl.style.display = 'none'; // Hide completely if disabled
                            likeCountEl.removeAttribute('onclick');
                        }
                    } else {
                        // New Post found (could prepend it if we want full sync, 
                        // but let's just leave it for pull-to-refresh to avoid jumps)
                    }
                });
                
                postsDataCache = newData;

            } catch (e) { console.warn("Sync error", e); }
        }

        // --- POST ACTIONS ---
        function openPostOptions(postId, isPublic) {
            currentOptionsPostId = postId;
            privacyToggle.checked = isPublic;
            optionsModal.classList.add('active');
        }

        function closeOptions() {
            optionsModal.classList.remove('active');
            currentOptionsPostId = null;
        }

        async function handleDeletePost() {
            if(!confirm('حذف شود؟')) return;
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'DELETE', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                document.getElementById(`post-${currentOptionsPostId}`).remove();
                closeOptions();
                showToast('پست حذف شد');
            } catch(e) { showToast('خطا در حذف', 'error'); }
        }

        async function handleSaveCaption() {
            const newCaption = editCaptionInput.value;
            saveCaptionBtn.textContent = '...';
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caption: newCaption })
                });
                document.querySelector(`#post-${currentOptionsPostId} .caption-text`).textContent = newCaption;
                editCaptionModal.classList.remove('active');
                showToast('ویرایش شد');
            } catch(e) { showToast('خطا', 'error'); }
            saveCaptionBtn.textContent = 'ذخیره تغییرات';
        }

        async function handlePrivacyChange() {
            const isChecked = privacyToggle.checked;
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ show_likes: isChecked })
                });
                // UI updates via startRealtimeUpdates automatically
            } catch(e) { 
                privacyToggle.checked = !isChecked; // Revert
                showToast('خطا در تغییر تنظیمات', 'error');
            }
        }

        // --- LIKES LIST ---
        async function showLikesList(postId, isOwner, isPublic) {
            if (!isOwner && !isPublic) return; 

            currentViewingLikesPostId = postId;
            const listContainer = document.getElementById('likes-list-container');
            listContainer.innerHTML = '<div class="empty-state"><div class="pull-spinner spinning" style="margin:0 auto;"></div></div>';
            likesModal.classList.add('active');

            try {
                const response = await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                const likesData = await response.json();
                
                listContainer.innerHTML = '';
                if (!likesData) {
                    listContainer.innerHTML = '<div class="empty-state">هنوز لایکی ثبت نشده.</div>';
                    return;
                }

                const userIds = Object.keys(likesData);
                userIds.forEach(uid => {
                    const user = allUsersCache[uid] || { displayName: uid, username: uid };
                    const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${uid}&background=random`;
                    
                    const div = document.createElement('div');
                    div.className = 'user-list-item';
                    div.innerHTML = `
                        <img src="${avatar}">
                        <div class="user-list-info">
                            <h4>
                                ${user.displayName || uid} 
                                ${user.verified ? `<img src="${VERIFIED_ICON_URL}" class="verified-tick">` : ''}
                            </h4>
                            <p>@${user.username || uid}</p>
                        </div>
                    `;
                    listContainer.appendChild(div);
                });
            } catch(e) {
                listContainer.innerHTML = '<div class="empty-state">خطا در دریافت لیست.</div>';
            }
        }

        // --- LIKE BUTTON LOGIC ---
        window.toggleLike = async (postId) => {
            const btn = document.getElementById(`like-btn-${postId}`);
            const countEl = document.getElementById(`likes-count-${postId}`);
            const isLiked = btn.classList.contains('liked');
            let currentCount = parseInt(countEl.textContent) || 0;
            
            // Optimistic UI
            if (isLiked) {
                btn.classList.remove('liked');
                btn.querySelector('svg').setAttribute('fill', 'none');
                btn.querySelector('svg').setAttribute('stroke', 'currentColor');
                countEl.textContent = `${Math.max(0, currentCount - 1)} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes/${currentUser.username}`, {
                        method: 'DELETE', headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                    });
                } catch(e) {}
            } else {
                btn.classList.add('liked');
                btn.querySelector('svg').setAttribute('fill', '#ED4956');
                btn.querySelector('svg').setAttribute('stroke', '#ED4956');
                countEl.textContent = `${currentCount + 1} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes/${currentUser.username}`, {
                        method: 'PUT', 
                        headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username, 'Content-Type': 'application/json' }, 
                        body: 'true'
                    });
                } catch(e) {}
            }
        };

        window.triggerLike = (postId) => {
            const heart = document.getElementById(`heart-anim-${postId}`);
            const btn = document.getElementById(`like-btn-${postId}`);
            heart.classList.remove('active');
            void heart.offsetWidth; // Reflow
            heart.classList.add('active');
            if (!btn.classList.contains('liked')) toggleLike(postId);
        };

        // --- PULL REFRESH & TIME ---
        function touchStart(e) {
            if (feedContainer.scrollTop === 0) {
                startY = e.touches[0].clientY;
                isPulling = true;
            }
        }
        function touchMove(e) {
            if (!isPulling) return;
            const diff = e.touches[0].clientY - startY;
            if (diff > 0 && feedContainer.scrollTop === 0) {
                e.preventDefault();
                currentTranslate = Math.min(diff * 0.5, 80);
                feedContainer.style.transform = `translateY(${currentTranslate}px)`;
                pullIndicator.style.opacity = Math.min(diff / 50, 1);
            }
        }
        async function touchEnd() {
            if (!isPulling) return;
            isPulling = false;
            if (currentTranslate > 60) {
                pullSpinner.classList.add('spinning');
                feedContainer.style.transform = `translateY(60px)`;
                await fetchPosts();
                setTimeout(resetPull, 500);
            } else {
                resetPull();
            }
        }
        function resetPull() {
            feedContainer.style.transform = '';
            pullIndicator.style.opacity = 0;
            pullSpinner.classList.remove('spinning');
            currentTranslate = 0;
        }

        function updateLiveTimestamps() {
            document.querySelectorAll('.post-time').forEach(el => {
                const ts = el.getAttribute('data-timestamp');
                if (ts) el.textContent = timeAgo(ts);
            });
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            const days = Math.floor(hours / 24);
            return `${days} روز پیش`;
        }
    </script>
</body>
</html>
