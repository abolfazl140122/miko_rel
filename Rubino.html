<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار پلاس</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --surface-color: #161B22;
            --surface-hover: #21262d;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --primary-color: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.3);
            --like-color: #F91880;
            --modal-bg: rgba(22, 27, 34, 0.98);
            --danger-color: #fa4549;
            --gold-color: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.25);
            --radius-md: 12px;
            --radius-lg: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none;
        }

        /* --- LAYOUT --- */
        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            background-color: var(--background-color);
        }

        /* --- HEADER --- */
        .header-area {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px; height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; position: absolute; top: 0; left: 0; right: 0;
        }
        .header-title {
            font-size: 1.2rem; font-weight: 800; margin: 0;
            background: linear-gradient(45deg, var(--primary-color), #00E5FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px var(--primary-glow);
        }
        .header-btn {
            background: transparent; border: none; color: var(--text-primary);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
        }
        .header-btn:active { background-color: var(--surface-hover); transform: scale(0.95); }
        .header-btn svg { width: 26px; height: 26px; stroke-width: 2; }

        /* --- FEED --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; padding-top: 60px; padding-bottom: 20px;
            scrollbar-width: none; opacity: 0; transition: opacity 0.4s ease;
            scroll-behavior: smooth;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* --- PULL TO REFRESH --- */
        .pull-indicator {
            position: absolute; top: 65px; left: 0; right: 0; height: 40px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; opacity: 0; transition: transform 0.2s; z-index: 90;
        }
        .pull-spinner {
            width: 24px; height: 24px; border: 2px solid var(--border-color);
            border-top-color: var(--primary-color); border-radius: 50%;
        }
        .pull-spinner.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- POST CARD --- */
        .post-card {
            background-color: var(--background-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px; padding-bottom: 12px;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* GOLDEN POST STYLES */
        .post-card.golden-post {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.03) 0%, transparent 40%);
        }
        .post-card.golden-post::before {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            border: 1px solid var(--gold-color); opacity: 0.3; pointer-events: none; z-index: 1;
        }
        .golden-crown { margin-left: 6px; font-size: 1rem; filter: drop-shadow(0 0 5px var(--gold-color)); }

        .post-header { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
            border: 1.5px solid var(--border-color); background: var(--surface-hover);
        }
        .post-card.golden-post .user-avatar { border-color: var(--gold-color); box-shadow: 0 0 8px var(--gold-glow); }
        
        .username-container { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
        .username { font-weight: 700; font-size: 0.9rem; color: var(--text-primary); display: flex; align-items: center; }
        .verified-badge { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; }
        .post-options-btn { padding: 8px; color: var(--text-secondary); background: none; border: none; }

        /* MEDIA AREA */
        .post-media-container {
            width: 100%; position: relative; background: black;
            min-height: 300px; max-height: 550px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .post-media { width: 100%; height: auto; max-height: 550px; object-fit: contain; display: block; }
        
        /* Video Controls */
        .video-overlay-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: rgba(0,0,0,0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; transition: all 0.2s; opacity: 0; transform: translate(-50%, -50%) scale(0.8);
        }
        .video-overlay-icon.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .video-overlay-icon svg { width: 30px; height: 30px; fill: white; margin-left: 2px; } /* Optical center correction */

        .mute-btn-container {
            position: absolute; bottom: 12px; right: 12px; z-index: 5;
        }
        .mute-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15); color: white;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Heart Animation */
        .heart-animation {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            color: white; font-size: 80px; opacity: 0; pointer-events: none; z-index: 10;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }
        .heart-animation.animate { animation: heartBurst 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes heartBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* ACTIONS & CAPTION */
        .post-actions { padding: 10px 16px 6px; display: flex; align-items: center; gap: 16px; }
        .action-icon {
            background: none; border: none; padding: 0; color: var(--text-primary);
            cursor: pointer; display: flex; align-items: center; transition: transform 0.1s;
        }
        .action-icon:active { transform: scale(0.85); }
        .action-icon svg { width: 26px; height: 26px; stroke-width: 1.8; }
        .action-icon.liked { color: var(--like-color); }
        .action-icon.liked svg { fill: var(--like-color); stroke: var(--like-color); }

        .likes-count { padding: 0 16px; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; cursor: pointer; }
        .post-caption { padding: 0 16px; font-size: 0.9rem; line-height: 1.5; }
        .caption-name { font-weight: 700; margin-left: 5px; }
        .post-time { display: block; padding: 4px 16px 0; font-size: 0.75rem; color: var(--text-secondary); }

        /* --- MODALS (Enhanced) --- */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--modal-bg); width: 90%; max-width: 420px;
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.08);
            transform: scale(0.95) translateY(10px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        /* Create Post Specifics */
        .modal-header {
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .modal-title { font-size: 1rem; font-weight: 700; margin: 0; }
        .btn-text { background: none; border: none; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-primary { color: var(--primary-color); }
        .btn-primary:disabled { opacity: 0.5; }
        .btn-close { color: var(--text-primary); font-size: 1.5rem; line-height: 1; padding: 0 5px; }

        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        /* File Upload Area */
        .upload-placeholder {
            border: 2px dashed var(--border-color); border-radius: var(--radius-md);
            height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02); color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s;
        }
        .upload-placeholder:active { background: rgba(255,255,255,0.05); border-color: var(--primary-color); }
        
        /* New Preview Area */
        .media-preview-container {
            position: relative; width: 100%; border-radius: var(--radius-md); overflow: hidden;
            background: #000; display: none; /* Hidden by default */
        }
        .media-preview-container.has-file { display: block; }
        .preview-element { width: 100%; max-height: 300px; object-fit: contain; display: block; }
        .remove-file-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: white; border: none;
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .caption-input {
            background: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 12px; border-radius: var(--radius-md);
            font-family: inherit; width: 100%; min-height: 100px; resize: none;
            transition: border-color 0.2s;
        }
        .caption-input:focus { border-color: var(--primary-color); }

        /* Switches */
        .option-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--surface-hover); border-radius: 34px; transition: .3s;
            border: 1px solid var(--border-color);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px;
            background-color: white; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { background-color: var(--primary-color); border-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Progress Bar */
        .progress-wrapper { height: 4px; background: var(--surface-color); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
        .progress-fill {
            height: 100%; width: 0%; background: var(--primary-color);
            transition: width 0.2s;
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite;
        }
        @keyframes progress-stripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }

        /* Bottom Sheet (Options & Comments) */
        .bottom-sheet { align-items: flex-end; }
        .bottom-sheet .modal-content {
            width: 100%; max-width: 480px; border-bottom-left-radius: 0; border-bottom-right-radius: 0;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            transform: translateY(100%); padding-bottom: 20px;
        }
        .bottom-sheet.active .modal-content { transform: translateY(0); }
        .drag-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 12px auto; }
        
        .sheet-btn {
            width: 100%; text-align: right; background: none; border: none; padding: 14px 20px;
            color: var(--text-primary); font-family: inherit; font-size: 1rem;
            display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .sheet-btn:active { background: var(--surface-hover); }
        .sheet-btn.danger { color: var(--danger-color); }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 100px);
            background: rgba(255,255,255,0.95); color: #000;
            padding: 10px 24px; border-radius: 50px; font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .toast.active { transform: translate(-50%, 0); }
        .toast.error { background: var(--danger-color); color: white; }

        /* Comments Area */
        .comments-list { padding: 0 16px; flex-grow: 1; overflow-y: auto; max-height: 60vh; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 16px; font-size: 0.9rem; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-hover); flex-shrink: 0; }
        .comment-bubble { display: flex; flex-direction: column; width: 100%; }
        .comment-user { font-weight: 700; margin-bottom: 2px; font-size: 0.85rem; }
        .comment-text { color: var(--text-primary); line-height: 1.4; }
        .comment-meta { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
        
        .comment-input-area {
            padding: 12px 16px; border-top: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 10px;
        }
        .comment-input {
            flex-grow: 1; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 10px 16px; color: white; font-family: inherit;
        }
        .send-btn { color: var(--primary-color); background: none; border: none; font-weight: 700; opacity: 0.5; transition: 0.2s; }
        .send-btn.active { opacity: 1; cursor: pointer; }

        /* Skeleton */
        .skeleton { background: var(--surface-color); border-radius: 4px; overflow: hidden; position: relative; }
        .skeleton::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="header-btn" onclick="location.reload()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="header-title">روبینو پلاس</h1>
            <button class="header-btn" id="btn-open-create">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </header>

        <!-- Pull Refresh -->
        <div class="pull-indicator"><div class="pull-spinner"></div></div>

        <!-- Feed List -->
        <div class="feed-container" id="feed-container">
            <!-- Skeletons render first via JS -->
        </div>

        <!-- ================= MODALS ================= -->

        <!-- 1. Create Post Modal -->
        <div class="modal-overlay" id="create-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="btn-close" id="btn-close-create">&times;</button>
                    <h3 class="modal-title">پست جدید</h3>
                    <button class="btn-text btn-primary" id="btn-publish">انتشار</button>
                </div>
                <div class="modal-body">
                    <!-- File Input (Hidden) -->
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    
                    <!-- Upload Placeholder -->
                    <div class="upload-placeholder" id="upload-trigger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p style="margin-top:10px; font-weight:500;">انتخاب عکس یا ویدیو</p>
                    </div>

                    <!-- Media Preview (Corrected Logic) -->
                    <div class="media-preview-container" id="preview-container">
                        <img id="img-preview" class="preview-element" style="display:none;">
                        <video id="vid-preview" class="preview-element" controls playsinline style="display:none;"></video>
                        <button class="remove-file-btn" id="btn-remove-file">&times;</button>
                    </div>

                    <textarea class="caption-input" id="caption-input" placeholder="کپشن خود را بنویسید..."></textarea>
                    
                    <div class="option-row">
                        <span style="font-size:0.9rem; color:var(--text-secondary);">نمایش تعداد لایک‌ها</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-show-likes" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="option-row">
                        <span style="font-size:0.9rem; color:var(--text-secondary);">بستن نظرات</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-disable-comments">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="progress-wrapper" id="progress-wrapper">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Post Options Modal (Bottom Sheet) -->
        <div class="modal-overlay bottom-sheet" id="options-modal">
            <div class="modal-content">
                <div class="drag-handle"></div>
                <!-- Dynamic Options will be injected here -->
                <div id="options-body"></div>
                <button class="sheet-btn" onclick="closeModal('options-modal')" style="justify-content:center; color:var(--text-secondary);">انصراف</button>
            </div>
        </div>

        <!-- 3. Comments Modal -->
        <div class="modal-overlay bottom-sheet" id="comments-modal">
            <div class="modal-content" style="height: 80vh;">
                <div class="drag-handle"></div>
                <div class="modal-header" style="border:none; padding-bottom:5px;">
                    <h3 class="modal-title">نظرات</h3>
                    <button class="btn-close" onclick="closeModal('comments-modal')">&times;</button>
                </div>
                <div class="comments-list" id="comments-list">
                    <!-- Comments injected here -->
                </div>
                <div class="comment-input-area" id="comment-box-area">
                    <img src="" class="comment-avatar" id="my-avatar-comment">
                    <input type="text" class="comment-input" id="comment-field" placeholder="نظر دهید..." autocomplete="off">
                    <button class="send-btn" id="btn-send-comment">ارسال</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast">پیام سیستم</div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        /**
         * CONFIGURATION
         */
        const PROXY_URL = 'https://escortgame.ir/firebase_proxy.php';
        const UPLOAD_ENDPOINT = 'https://escortgame.ir/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_ICON = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';
        
        /**
         * STATE MANAGEMENT
         */
        let state = {
            user: null,
            token: null,
            posts: {},
            usersCache: {},
            activeModal: null,
            fileToUpload: null,
            activePostId: null, // For options/comments
            isMuted: true
        };

        // DOM Elements
        const els = {
            feed: document.getElementById('feed-container'),
            pullInd: document.querySelector('.pull-indicator'),
            pullSpin: document.querySelector('.pull-spinner'),
            toast: document.getElementById('toast'),
            createModal: document.getElementById('create-modal'),
            fileInput: document.getElementById('file-input'),
            uploadTrigger: document.getElementById('upload-trigger'),
            previewContainer: document.getElementById('preview-container'),
            imgPreview: document.getElementById('img-preview'),
            vidPreview: document.getElementById('vid-preview'),
            removeFileBtn: document.getElementById('btn-remove-file'),
            publishBtn: document.getElementById('btn-publish'),
            caption: document.getElementById('caption-input'),
            progressWrapper: document.getElementById('progress-wrapper'),
            progressFill: document.getElementById('progress-fill'),
            optionsModal: document.getElementById('options-modal'),
            commentsModal: document.getElementById('comments-modal'),
            commentsList: document.getElementById('comments-list'),
            commentField: document.getElementById('comment-field'),
            sendCommentBtn: document.getElementById('btn-send-comment')
        };

        /**
         * INITIALIZATION
         */
        document.addEventListener('DOMContentLoaded', async () => {
            const stored = localStorage.getItem('currentUser');
            if (!stored) { window.location.href = 'login.html'; return; }
            state.user = JSON.parse(stored);
            
            // Set Avatar
            const defaultAvatar = `https://ui-avatars.com/api/?name=${state.user.username}&background=random&color=fff`;
            document.getElementById('my-avatar-comment').src = state.user.profilePicUrl || defaultAvatar;

            renderSkeleton();
            setupEventListeners();
            initVideoObserver();
            
            try {
                await authenticate();
                await Promise.all([fetchUsers(), fetchPosts()]);
                renderFeed();
                // Live updates
                setInterval(fetchPosts, 5000); 
            } catch (e) {
                showToast('خطا در اتصال به سرور', 'error');
                console.error(e);
            }
        });

        async function authenticate() {
            const res = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            const data = await res.json();
            if(!data.token) throw new Error("Auth failed");
            state.token = data.token;
        }

        async function fetchUsers() {
            try {
                const res = await fetch(`${PROXY_URL}?path=users`, { headers: authHeader() });
                if(res.ok) state.usersCache = await res.json() || {};
            } catch(e) {}
        }

        async function fetchPosts() {
            const res = await fetch(`${PROXY_URL}?path=rubino_posts`, { headers: authHeader() });
            if (!res.ok) return;
            const newData = await res.json() || {};
            
            // Basic Diff Check to avoid re-rendering entire DOM if not needed
            // For this demo, we re-render if count changes or active interactions
            const keys = Object.keys(newData);
            if (JSON.stringify(keys) !== JSON.stringify(Object.keys(state.posts))) {
                state.posts = newData;
                renderFeed();
            } else {
                // Just update data silently (likes count etc update via ID lookup in render not ideal, 
                // but good enough for simple demo. A better way is detailed granular updates)
                state.posts = newData;
                updateLiveUI();
            }
        }

        /**
         * UI RENDERING
         */
        function renderSkeleton() {
            let html = '';
            for(let i=0; i<2; i++) {
                html += `
                <div class="post-card" style="padding:15px;">
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <div class="skeleton" style="width:40px; height:40px; border-radius:50%;"></div>
                        <div class="skeleton" style="width:120px; height:20px; margin-top:10px;"></div>
                    </div>
                    <div class="skeleton" style="width:100%; height:300px;"></div>
                </div>`;
            }
            els.feed.innerHTML = html;
        }

        function renderFeed() {
            // Sort: Golden first, then Newest
            const sorted = Object.entries(state.posts).map(([k,v]) => ({id:k, ...v})).sort((a,b) => {
                if(a.isGolden && !b.isGolden) return -1;
                if(!a.isGolden && b.isGolden) return 1;
                return new Date(b.timestamp) - new Date(a.timestamp);
            });

            els.feed.innerHTML = '';
            
            sorted.forEach(post => {
                const isOwner = post.sender_username === state.user.username;
                const user = state.usersCache[post.sender_username] || { displayName: post.sender_username };
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${post.sender_username}&background=random&color=fff`;
                const isLiked = post.likes && post.likes[state.user.username];
                const likesCount = post.likes ? Object.keys(post.likes).length : 0;
                
                // Media HTML
                let mediaHtml = '';
                if(post.type === 'video') {
                    mediaHtml = `
                        <video class="post-media" id="vid-${post.id}" src="${post.media_url}" loop playsinline muted></video>
                        <div class="video-overlay-icon" id="overlay-${post.id}">
                             <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </div>
                        <div class="mute-btn-container">
                            <button class="mute-btn" onclick="toggleMuteGlobal(event)">
                                ${state.isMuted ? 
                                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>' : 
                                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>'}
                            </button>
                        </div>
                    `;
                } else {
                    mediaHtml = `<img class="post-media" src="${post.media_url}" loading="lazy">`;
                }

                const card = document.createElement('div');
                card.className = `post-card ${post.isGolden ? 'golden-post' : ''}`;
                card.id = `post-${post.id}`;
                
                card.innerHTML = `
                    <div class="post-header">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar">
                            <div class="username-container">
                                <span class="username">
                                    ${user.displayName || post.sender_username}
                                    ${user.verified ? `<img src="${VERIFIED_ICON}" class="verified-badge">` : ''}
                                    ${post.isGolden ? '<span class="golden-crown">👑</span>' : ''}
                                </span>
                            </div>
                        </div>
                        <button class="post-options-btn" onclick="openOptions('${post.id}', ${isOwner})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        </button>
                    </div>
                    <div class="post-media-container" onclick="handleMediaClick('${post.id}', '${post.type}')" ondblclick="doLike('${post.id}')">
                        ${mediaHtml}
                        <div class="heart-animation" id="heart-${post.id}">❤</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-icon ${isLiked ? 'liked' : ''}" id="btn-like-${post.id}" onclick="doLike('${post.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-icon" onclick="openComments('${post.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                    </div>
                    <div class="likes-count" id="likes-txt-${post.id}">
                        ${post.show_likes !== false ? `${likesCount} پسند` : 'پسندها مخفی شده'}
                    </div>
                    <div class="post-caption">
                        <span class="caption-name">${user.displayName || post.sender_username}</span>
                        ${post.caption}
                    </div>
                    <span class="post-time">${timeAgo(post.timestamp)}</span>
                `;
                els.feed.appendChild(card);
            });

            // Observe videos
            document.querySelectorAll('video').forEach(v => videoObserver.observe(v));
        }

        function updateLiveUI() {
            // Minimal DOM updates for likes
            Object.entries(state.posts).forEach(([id, post]) => {
                const countEl = document.getElementById(`likes-txt-${id}`);
                const btn = document.getElementById(`btn-like-${id}`);
                const likesCount = post.likes ? Object.keys(post.likes).length : 0;
                const isLiked = post.likes && post.likes[state.user.username];

                if(countEl) countEl.innerText = post.show_likes !== false ? `${likesCount} پسند` : 'پسندها مخفی شده';
                if(btn) {
                    if(isLiked) btn.classList.add('liked'); else btn.classList.remove('liked');
                    const svg = btn.querySelector('svg');
                    svg.setAttribute('fill', isLiked ? 'currentColor' : 'none');
                }
            });
        }

        /**
         * MEDIA & VIDEO LOGIC (FIXED)
         */
        let videoObserver;
        function initVideoObserver() {
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.target.tagName !== 'VIDEO') return;
                    // If modal is open, do not auto-play anything
                    if (document.querySelector('.modal-overlay.active')) {
                        entry.target.pause();
                        return;
                    }

                    if (entry.isIntersecting) {
                        entry.target.muted = state.isMuted;
                        const p = entry.target.play();
                        if(p) p.catch(() => {});
                        // Pause others
                        document.querySelectorAll('video').forEach(v => {
                            if(v !== entry.target) v.pause();
                        });
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.7 });
        }

        function toggleMuteGlobal(e) {
            e.stopPropagation();
            state.isMuted = !state.isMuted;
            document.querySelectorAll('video').forEach(v => v.muted = state.isMuted);
            // Re-render icons logic implies re-rendering feed or toggling SVG classes
            // For efficiency, just reloading the SVG content here
            const btns = document.querySelectorAll('.mute-btn');
            const icon = state.isMuted ? 
                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>' : 
                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
            btns.forEach(b => b.innerHTML = icon);
        }

        function handleMediaClick(id, type) {
            if (type !== 'video') return;
            const vid = document.getElementById(`vid-${id}`);
            const overlay = document.getElementById(`overlay-${id}`);
            if (vid.paused) {
                vid.play();
                overlay.classList.remove('visible');
            } else {
                vid.pause();
                overlay.classList.add('visible');
            }
        }

        function pauseAllVideos() {
            document.querySelectorAll('video').forEach(v => v.pause());
        }

        /**
         * EVENT LISTENERS
         */
        function setupEventListeners() {
            // Modal Toggles
            document.getElementById('btn-open-create').onclick = openCreateModal;
            document.getElementById('btn-close-create').onclick = () => closeModal('create-modal');
            
            // File Upload Logic
            els.uploadTrigger.onclick = () => els.fileInput.click();
            els.fileInput.onchange = handleFileSelection;
            els.removeFileBtn.onclick = clearFileSelection;
            els.publishBtn.onclick = uploadAndPost;

            // Comment Input
            els.commentField.oninput = (e) => {
                if(e.target.value.trim().length > 0) els.sendCommentBtn.classList.add('active');
                else els.sendCommentBtn.classList.remove('active');
            };
            els.sendCommentBtn.onclick = postComment;

            // Pull to Refresh (Simple Logic)
            let startY = 0;
            els.feed.addEventListener('touchstart', e => { if(els.feed.scrollTop===0) startY = e.touches[0].clientY; }, {passive:true});
            els.feed.addEventListener('touchend', async e => {
                const diff = e.changedTouches[0].clientY - startY;
                if(diff > 80 && els.feed.scrollTop === 0) {
                    els.pullInd.style.opacity = '1';
                    els.pullSpin.classList.add('spinning');
                    await fetchPosts();
                    els.pullSpin.classList.remove('spinning');
                    els.pullInd.style.opacity = '0';
                }
            });
        }

        /**
         * CREATE POST LOGIC (Fixed Preview & Audio)
         */
        function openCreateModal() {
            pauseAllVideos(); // CRITICAL FIX: Stop feed videos
            state.fileToUpload = null;
            clearFileSelection(); // Reset UI
            els.caption.value = '';
            els.createModal.classList.add('active');
        }

        function handleFileSelection(e) {
            const file = e.target.files[0];
            if (!file) return;
            state.fileToUpload = file;

            // UI Changes
            els.uploadTrigger.style.display = 'none';
            els.previewContainer.classList.add('has-file');

            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                els.imgPreview.style.display = 'none';
                els.vidPreview.style.display = 'block';
                els.vidPreview.src = url;
                els.vidPreview.play(); // Preview plays automatically inside modal
            } else {
                els.vidPreview.style.display = 'none';
                els.imgPreview.style.display = 'block';
                els.imgPreview.src = url;
            }
        }

        function clearFileSelection() {
            state.fileToUpload = null;
            els.fileInput.value = '';
            els.vidPreview.pause();
            els.vidPreview.src = '';
            els.imgPreview.src = '';
            
            els.previewContainer.classList.remove('has-file');
            els.uploadTrigger.style.display = 'flex';
        }

        async function uploadAndPost() {
            if (!state.fileToUpload) { showToast('لطفا فایل انتخاب کنید', 'error'); return; }
            
            els.publishBtn.disabled = true;
            els.publishBtn.innerText = 'درحال آپلود...';
            els.progressWrapper.style.display = 'block';
            els.progressFill.style.width = '30%'; // Fake progress start

            const formData = new FormData();
            formData.append('file', state.fileToUpload);

            try {
                // Upload
                const xhr = new XMLHttpRequest();
                xhr.open('POST', UPLOAD_ENDPOINT, true);
                
                const promise = new Promise((resolve, reject) => {
                    xhr.onload = () => resolve(JSON.parse(xhr.responseText));
                    xhr.onerror = () => reject();
                    xhr.upload.onprogress = (e) => {
                        if(e.lengthComputable) els.progressFill.style.width = ((e.loaded/e.total)*100) + '%';
                    }
                });
                xhr.send(formData);
                const result = await promise;

                if (!result.success) throw new Error(result.error || 'Upload failed');

                // Create Post Record
                const postData = {
                    sender_username: state.user.username,
                    media_url: result.url,
                    type: state.fileToUpload.type.startsWith('video/') ? 'video' : 'image',
                    caption: els.caption.value.trim(),
                    timestamp: new Date().toISOString(),
                    likes: {},
                    show_likes: document.getElementById('toggle-show-likes').checked,
                    comments_disabled: document.getElementById('toggle-disable-comments').checked
                };
                if(state.user.accountType === 'premium') postData.isGolden = true;

                await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    method: 'POST',
                    headers: { ...authHeader(), 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                showToast('پست با موفقیت منتشر شد');
                closeModal('create-modal');
                fetchPosts(); // Refresh Feed

            } catch (e) {
                showToast('خطا در انتشار پست', 'error');
                els.publishBtn.innerText = 'تلاش مجدد';
            } finally {
                els.publishBtn.disabled = false;
                els.progressWrapper.style.display = 'none';
            }
        }

        /**
         * INTERACTIONS (Like, Options, Comments)
         */
        async function doLike(postId) {
            // Optimistic UI Update
            const btn = document.getElementById(`btn-like-${postId}`);
            const heart = document.getElementById(`heart-${postId}`);
            
            // Animation
            heart.classList.remove('animate'); void heart.offsetWidth; heart.classList.add('animate');

            const isLiked = btn.classList.contains('liked');
            btn.classList.toggle('liked'); // Toggle visual immediately
            
            const method = isLiked ? 'DELETE' : 'PUT';
            const body = isLiked ? null : 'true';

            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/likes/${state.user.username}`, {
                    method: method,
                    headers: isLiked ? authHeader() : { ...authHeader(), 'Content-Type': 'application/json' },
                    body: body
                });
                fetchPosts(); // Sync valid count
            } catch(e) {
                btn.classList.toggle('liked'); // Revert on error
            }
        }

        function openOptions(postId, isOwner) {
            state.activePostId = postId;
            const container = document.getElementById('options-body');
            let html = '';
            
            if (isOwner) {
                html += `<button class="sheet-btn danger" onclick="deletePost('${postId}')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> حذف پست</button>`;
            } else {
                 html += `<button class="sheet-btn" onclick="showToast('گزارش تخلف ثبت شد')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> گزارش تخلف</button>`;
            }
            container.innerHTML = html;
            els.optionsModal.classList.add('active');
        }

        async function deletePost(postId) {
            if(!confirm("آیا مطمئن هستید؟")) return;
            await fetch(`${PROXY_URL}?path=rubino_posts/${postId}`, { method: 'DELETE', headers: authHeader() });
            document.getElementById(`post-${postId}`).remove();
            closeModal('options-modal');
            showToast('پست حذف شد');
        }

        async function openComments(postId) {
            state.activePostId = postId;
            els.commentsList.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">درحال بارگذاری...</div>';
            els.commentsModal.classList.add('active');

            const post = state.posts[postId];
            const isDisabled = post.comments_disabled && post.sender_username !== state.user.username;
            
            document.getElementById('comment-box-area').style.display = isDisabled ? 'none' : 'flex';

            const res = await fetch(`${PROXY_URL}?path=rubino_posts/${postId}/comments`, { headers: authHeader() });
            const data = await res.json() || {};
            
            els.commentsList.innerHTML = '';
            if(Object.keys(data).length === 0) {
                els.commentsList.innerHTML = '<div style="text-align:center; padding:30px; color:gray;">هنوز نظری ثبت نشده است.</div>';
                return;
            }

            Object.values(data).forEach(c => {
                const user = state.usersCache[c.sender_username] || { displayName: c.sender_username };
                const avatar = user.profilePicUrl || `https://ui-avatars.com/api/?name=${c.sender_username}&background=random&color=fff`;
                
                els.commentsList.innerHTML += `
                    <div class="comment-item">
                        <img src="${avatar}" class="comment-avatar">
                        <div class="comment-bubble">
                            <span class="comment-user">${user.displayName || c.sender_username}</span>
                            <span class="comment-text">${c.text}</span>
                            <span class="comment-meta">${timeAgo(c.timestamp)}</span>
                        </div>
                    </div>
                `;
            });
        }

        async function postComment() {
            const txt = els.commentField.value.trim();
            if(!txt) return;
            
            const dummy = { sender_username: state.user.username, text: txt, timestamp: new Date().toISOString() };
            // Optimistic render
            els.commentsList.innerHTML += `
                <div class="comment-item" style="opacity:0.6;">
                    <img src="${document.getElementById('my-avatar-comment').src}" class="comment-avatar">
                    <div class="comment-bubble"><span class="comment-user">من</span><span class="comment-text">${txt}</span><span class="comment-meta">درحال ارسال...</span></div>
                </div>`;
            els.commentsList.scrollTop = els.commentsList.scrollHeight;
            els.commentField.value = '';

            await fetch(`${PROXY_URL}?path=rubino_posts/${state.activePostId}/comments`, {
                method: 'POST',
                headers: { ...authHeader(), 'Content-Type': 'application/json' },
                body: JSON.stringify(dummy)
            });
            openComments(state.activePostId); // Refresh real list
        }

        /**
         * UTILS
         */
        function authHeader() {
            return { 'Authorization': `Bearer ${state.token}`, 'X-User-Username': state.user.username };
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showToast(msg, type='normal') {
            els.toast.className = `toast ${type} active`;
            els.toast.textContent = msg;
            setTimeout(() => els.toast.classList.remove('active'), 3000);
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            return `${Math.floor(hours / 24)} روز پیش`;
        }

    </script>
</body>
