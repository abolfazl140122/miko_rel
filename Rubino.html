<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبینو همیار پرو</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --bg-dark: #090c10;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --danger-color: #f85149;
            --success-color: #2ea043;
            --gold-color: #e3b341;
            --modal-bg: rgba(22, 27, 34, 0.95);
            
            /* Animation Variables */
            --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            background-color: var(--bg-dark);
        }

        /* --- HEADER --- */
        .header-area {
            background: rgba(9, 12, 16, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
            position: absolute; top: 0; left: 0; right: 0;
        }
        .header-title {
            font-size: 1.2rem; font-weight: 800; margin: 0;
            background: linear-gradient(45deg, var(--accent-color), #a5d6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-btn {
            background: transparent; border: none; color: var(--text-main);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; cursor: pointer;
        }
        .header-btn:active { background-color: var(--bg-hover); transform: scale(0.95); }
        .header-btn svg { width: 24px; height: 24px; stroke-width: 2; }

        /* --- FEED & POSTS --- */
        .feed-container {
            flex-grow: 1; overflow-y: auto; 
            padding-top: 60px; padding-bottom: 20px;
            scrollbar-width: none;
            overscroll-behavior-y: contain;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .post-card {
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px; padding-bottom: 10px;
            opacity: 0; transform: translateY(20px);
            animation: postEnter 0.6s var(--smooth-easing) forwards;
        }
        @keyframes postEnter { to { opacity: 1; transform: translateY(0); } }

        .post-card.golden-post {
            background: radial-gradient(circle at top right, rgba(227, 179, 65, 0.08), transparent 40%);
            border: 1px solid rgba(227, 179, 65, 0.3);
            border-radius: 12px; margin: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .golden-post .username { color: var(--gold-color); }
        .golden-post .username::after {
            content: '👑'; margin-right: 4px; font-size: 0.9em;
        }

        .post-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--bg-card);
            background: var(--bg-hover);
        }
        .username { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
        .verified-tick { width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; }

        /* Media */
        .post-media-container {
            width: 100%; position: relative;
            background-color: #000; min-height: 250px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .post-media { 
            width: 100%; height: auto; max-height: 600px; object-fit: contain; 
            display: block; opacity: 0; transition: opacity 0.4s ease;
        }
        .post-media.loaded { opacity: 1; }
        
        /* Loading Spinner */
        .media-loader {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: var(--bg-hover); z-index: 1; transition: opacity 0.3s;
        }
        .spinner {
            width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-color); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Heart Animation */
        .heart-overlay {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0);
            color: #fff; font-size: 80px; pointer-events: none;
            z-index: 10; filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
            opacity: 0;
        }
        .heart-overlay.active { animation: heartPop 0.8s var(--spring-easing) forwards; }
        @keyframes heartPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            20% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } 
            40% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
        }

        /* Actions */
        .post-actions { padding: 12px 16px 8px; display: flex; gap: 20px; }
        .action-btn { background: none; border: none; padding: 0; cursor: pointer; color: var(--text-main); transition: transform 0.1s; display: flex; align-items: center; gap: 6px; }
        .action-btn:active { transform: scale(0.85); }
        .action-btn svg { width: 26px; height: 26px; stroke-width: 1.8; transition: all 0.2s; }
        .action-btn.liked svg { fill: var(--danger-color); stroke: var(--danger-color); }
        
        .post-likes { padding: 0 16px; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; cursor: pointer; }
        .post-caption { padding: 0 16px 8px; font-size: 0.9rem; line-height: 1.5; color: var(--text-main); }
        .caption-username { font-weight: 700; margin-left: 6px; }
        .post-time { font-size: 0.75rem; color: var(--text-muted); padding: 0 16px; }

        /* --- MODALS (Enhanced) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s var(--smooth-easing);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-card {
            background: var(--bg-card); width: 90%; max-width: 420px;
            border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s var(--spring-easing), opacity 0.3s ease;
            opacity: 0; overflow: hidden; position: relative;
        }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); opacity: 1; }

        .modal-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { margin: 0; font-size: 1rem; font-weight: 700; }
        .close-modal {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 5px;
        }

        /* Create Post Modal Specifics */
        .upload-area {
            margin: 20px; height: 200px;
            border: 2px dashed var(--border-color); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); cursor: pointer; transition: all 0.3s;
            background: rgba(255,255,255,0.02);
        }
        .upload-area:active { background: rgba(88, 166, 255, 0.05); border-color: var(--accent-color); }
        .upload-preview { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; display: none; background: #000; }

        .caption-input {
            width: calc(100% - 40px); margin: 0 20px 20px;
            background: var(--bg-dark); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 12px;
            font-family: inherit; resize: none; min-height: 100px;
        }
        .caption-input:focus { border-color: var(--accent-color); }

        .share-btn {
            width: calc(100% - 40px); margin: 0 20px 20px;
            background: var(--accent-color); color: #fff;
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .share-btn:active { transform: scale(0.98); }
        .share-btn:disabled { background: var(--border-color); opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- UPLOAD LOCK STATE STYLES --- */
        .modal-overlay.locked { pointer-events: none; } /* Disable clicks on overlay */
        .modal-overlay.locked .close-modal { opacity: 0; pointer-events: none; }
        .modal-overlay.locked .upload-area { opacity: 0.5; pointer-events: none; }
        .modal-overlay.locked .caption-input { opacity: 0.5; pointer-events: none; }
        
        .progress-container {
            margin: 0 20px 20px; height: 6px; background: var(--bg-hover);
            border-radius: 3px; overflow: hidden; display: none; position: relative;
        }
        .progress-bar {
            width: 0%; height: 100%; background: var(--accent-color);
            border-radius: 3px; transition: width 0.2s linear;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Success Animation (Checkmark) */
        .success-animation {
            position: absolute; inset: 0; background: var(--bg-card);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; opacity: 0; visibility: hidden; transition: opacity 0.3s;
        }
        .success-animation.active { opacity: 1; visibility: visible; }
        
        .checkmark-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--success-color);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(46, 160, 67, 0.4);
            animation: popIn 0.5s var(--spring-easing) forwards;
        }
        .checkmark {
            width: 40px; height: 40px; border-radius: 3px;
            border-bottom: 4px solid #fff; border-right: 4px solid #fff;
            transform: rotate(45deg) translate(-2px, -2px);
            opacity: 0; animation: checkDraw 0.4s 0.3s ease forwards;
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes checkDraw { 0% { opacity: 0; width: 0; height: 0; } 100% { opacity: 1; width: 14px; height: 26px; } }

        /* --- BOTTOM SHEETS --- */
        .bottom-sheet .sheet-card {
            background: var(--bg-card); width: 100%; max-width: 480px;
            border-radius: 24px 24px 0 0;
            position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto;
            transform: translateY(100%); transition: transform 0.4s var(--spring-easing);
            padding-bottom: 30px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .modal-overlay.active .sheet-card { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: var(--border-color); border-radius: 3px; margin: 12px auto; }
        
        .sheet-btn {
            width: 100%; padding: 16px 24px; text-align: right; background: none; border: none;
            color: var(--text-main); font-size: 1rem; font-family: inherit;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .sheet-btn:active { background: var(--bg-hover); }
        .sheet-btn.danger { color: var(--danger-color); }

        /* --- TOAST --- */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 50px);
            background: #fff; color: #000; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; z-index: 2000; opacity: 0;
            transition: all 0.4s var(--spring-easing);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .toast.active { transform: translate(-50%, 0); opacity: 1; }
        .toast.error { background: var(--danger-color); color: #fff; }

        /* --- SKELETON --- */
        .skeleton { background: var(--bg-hover); position: relative; overflow: hidden; }
        .skeleton::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* Pull Indicator */
        .pull-indicator {
            position: absolute; top: 70px; left: 0; right: 0; height: 40px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 40;
        }
        .pull-spinner {
            width: 24px; height: 24px; border: 2px solid var(--accent-color); border-top-color: transparent; border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header-area">
            <button class="header-btn" onclick="window.location.href='safe_asli.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="header-title">روبینو پرو</h1>
            <button class="header-btn" id="open-create-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </header>

        <!-- Pull Refresh -->
        <div class="pull-indicator" id="pull-indicator"><div class="pull-spinner" id="pull-spinner"></div></div>

        <!-- Feed -->
        <div class="feed-container" id="feed-container">
            <!-- Skeletons will be injected here by JS initially -->
        </div>

        <!-- Create Modal (The Critical Part) -->
        <div class="modal-overlay" id="create-modal">
            <div class="modal-card">
                <!-- Success Animation Layer -->
                <div class="success-animation" id="upload-success-anim">
                    <div class="checkmark-circle"><div class="checkmark"></div></div>
                    <p style="margin-top:20px; font-weight:700; font-size:1.1rem;">پست منتشر شد!</p>
                </div>

                <div class="modal-header">
                    <h3 class="modal-title">پست جدید</h3>
                    <button class="close-modal" id="close-create-btn">&times;</button>
                </div>
                
                <div class="modal-body">
                    <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
                    
                    <div class="upload-area" id="upload-area">
                        <svg id="upload-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:10px"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <p style="margin:0; font-size:0.9rem;">انتخاب عکس یا ویدیو</p>
                        
                        <img id="image-preview" class="upload-preview">
                        <video id="video-preview" class="upload-preview" controls playsinline></video>
                    </div>

                    <textarea class="caption-input" id="caption-input" placeholder="کپشن را بنویسید..."></textarea>
                    
                    <div class="progress-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>

                    <button class="share-btn" id="share-btn">انتشار پست</button>
                </div>
            </div>
        </div>

        <!-- Options Modal -->
        <div class="modal-overlay bottom-sheet" id="options-modal">
            <div class="sheet-card">
                <div class="sheet-handle"></div>
                <button class="sheet-btn danger" id="delete-post-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    حذف پست
                </button>
                <button class="sheet-btn" id="close-options-btn" style="justify-content: center; color: var(--text-muted);">لغو</button>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast">پیام</div>
    </div>

    <script>
        // --- CONFIG ---
        const PROXY_URL = 'https://escortgame.ir/firebase_proxy.php';
        const UPLOAD_URL = 'https://escortgame.ir/upload_to_parspack.php';
        const SHARED_SECRET = 'miko1234'; // Must match server
        
        // --- STATE ---
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        if(!currentUser) window.location.href = 'login.html'; // Basic Auth Check

        let clientToken = null;
        let selectedFile = null;
        let isUploading = false; // CRITICAL: Lock state
        let postsData = {};
        let activeVideo = null;
        let currentOptionsPostId = null;

        // --- DOM ---
        const els = {
            feed: document.getElementById('feed-container'),
            createModal: document.getElementById('create-modal'),
            createBtn: document.getElementById('open-create-btn'),
            closeCreateBtn: document.getElementById('close-create-btn'),
            shareBtn: document.getElementById('share-btn'),
            fileInput: document.getElementById('file-input'),
            uploadArea: document.getElementById('upload-area'),
            imgPrev: document.getElementById('image-preview'),
            vidPrev: document.getElementById('video-preview'),
            caption: document.getElementById('caption-input'),
            progressBox: document.getElementById('progress-container'),
            progressBar: document.getElementById('progress-bar'),
            toast: document.getElementById('toast'),
            uploadIcon: document.getElementById('upload-icon'),
            successAnim: document.getElementById('upload-success-anim'),
            optionsModal: document.getElementById('options-modal'),
            deleteBtn: document.getElementById('delete-post-btn')
        };

        // --- INIT ---
        (async function init() {
            renderSkeletons();
            setupEvents();
            setupIntersectionObserver();
            
            try {
                await refreshToken();
                await loadPosts();
            } catch(e) {
                showToast('خطا در اتصال به سرور', 'error');
            }
        })();

        // --- AUTH & NETWORK ---
        async function refreshToken() {
            try {
                const res = await fetch(`${PROXY_URL}?auth=token`, { 
                    headers: { 'X-Proxy-Secret': SHARED_SECRET } 
                });
                const data = await res.json();
                clientToken = data.token;
            } catch (e) { console.error('Auth Error', e); }
        }

        // --- EVENTS ---
        function setupEvents() {
            // Modal Open
            els.createBtn.onclick = () => {
                resetCreateModal();
                els.createModal.classList.add('active');
            };

            // Modal Close (Locked during upload)
            const tryCloseModal = () => {
                if(isUploading) return; // BLOCKED
                els.createModal.classList.remove('active');
                resetCreateModal();
            };

            els.closeCreateBtn.onclick = tryCloseModal;
            els.createModal.onclick = (e) => {
                if(e.target === els.createModal) tryCloseModal();
            };
            document.onkeydown = (e) => {
                if(e.key === 'Escape' && els.createModal.classList.contains('active')) tryCloseModal();
            };

            // File Selection
            els.uploadArea.onclick = () => !isUploading && els.fileInput.click();
            els.fileInput.onchange = (e) => {
                if(e.target.files[0]) handleFilePreview(e.target.files[0]);
            };

            // Post Action
            els.shareBtn.onclick = handleUploadProcess;

            // Options
            els.optionsModal.onclick = (e) => { if(e.target === els.optionsModal) els.optionsModal.classList.remove('active'); };
            document.getElementById('close-options-btn').onclick = () => els.optionsModal.classList.remove('active');
            els.deleteBtn.onclick = deletePost;

            // Pull Refresh
            setupPullRefresh();
        }

        // --- FILE HANDLING ---
        function handleFilePreview(file) {
            selectedFile = file;
            els.uploadIcon.style.display = 'none';
            els.uploadArea.querySelector('p').style.display = 'none';
            
            // Cleanup
            els.imgPrev.style.display = 'none';
            els.vidPrev.style.display = 'none';
            els.vidPrev.pause();
            if(els.vidPrev.src) URL.revokeObjectURL(els.vidPrev.src);

            const url = URL.createObjectURL(file);
            
            if(file.type.startsWith('video/')) {
                els.vidPrev.src = url;
                els.vidPrev.style.display = 'block';
                els.vidPrev.load();
            } else {
                els.imgPrev.src = url;
                els.imgPrev.style.display = 'block';
            }
        }

        // --- THE FIX: ROBUST UPLOAD LOGIC ---
        async function handleUploadProcess() {
            if(!selectedFile) return showToast('لطفا فایل انتخاب کنید', 'error');
            
            // 1. LOCK UI
            isUploading = true;
            els.createModal.classList.add('locked'); // CSS locks interactions
            els.shareBtn.disabled = true;
            els.shareBtn.innerHTML = '<div class="pull-spinner" style="width:20px; height:20px; border-width:2px; border-color:white; border-top-color:transparent;"></div> در حال آپلود...';
            els.progressBox.style.display = 'block';
            els.progressBar.style.width = '0%';

            try {
                // Refresh token before upload to ensure session is valid
                await refreshToken();

                // 2. UPLOAD FILE
                const mediaUrl = await uploadFileXHR(selectedFile);
                
                // 3. CREATE RECORD (Wait for it!)
                await createPostRecordInDB(mediaUrl, selectedFile.type.startsWith('video') ? 'video' : 'image');

                // 4. SUCCESS STATE (Show animation before closing)
                els.successAnim.classList.add('active');
                
                // Wait for animation
                setTimeout(async () => {
                    // 5. UNLOCK & RESET
                    isUploading = false;
                    els.createModal.classList.remove('locked', 'active');
                    resetCreateModal();
                    
                    // 6. REFRESH FEED
                    showToast('پست با موفقیت منتشر شد');
                    await loadPosts(); // Fetch new data immediately
                }, 1500);

            } catch (error) {
                console.error(error);
                showToast(error.message || 'خطا در آپلود', 'error');
                
                // Unlock on error
                isUploading = false;
                els.createModal.classList.remove('locked');
                els.shareBtn.disabled = false;
                els.shareBtn.textContent = 'انتشار پست';
                els.progressBar.style.width = '0%';
            }
        }

        function uploadFileXHR(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', UPLOAD_URL, true);

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        els.progressBar.style.width = percent + '%';
                        if(percent >= 100) els.shareBtn.textContent = 'در حال ذخیره...';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try {
                            const res = JSON.parse(xhr.responseText);
                            if (res.success && res.url) resolve(res.url);
                            else reject(new Error(res.error || 'خطای سرور آپلود'));
                        } catch (e) { reject(new Error('پاسخ نامعتبر سرور')); }
                    } else {
                        reject(new Error('خطای شبکه: ' + xhr.status));
                    }
                };

                xhr.onerror = () => reject(new Error('خطای اتصال اینترنت'));
                xhr.send(formData);
            });
        }

        async function createPostRecordInDB(url, type) {
            const postBody = {
                sender_username: currentUser.username,
                media_url: url,
                type: type,
                caption: els.caption.value.trim(),
                timestamp: new Date().toISOString(),
                likes: {},
                isGolden: currentUser.accountType === 'premium'
            };

            const res = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${clientToken}`,
                    'Content-Type': 'application/json',
                    'X-User-Username': currentUser.username
                },
                body: JSON.stringify(postBody)
            });

            if (!res.ok) throw new Error('خطا در ذخیره پست');
            return await res.json();
        }

        function resetCreateModal() {
            selectedFile = null;
            els.fileInput.value = '';
            els.caption.value = '';
            els.imgPrev.src = ''; els.imgPrev.style.display = 'none';
            els.vidPrev.src = ''; els.vidPrev.style.display = 'none';
            els.uploadIcon.style.display = 'block';
            els.uploadArea.querySelector('p').style.display = 'block';
            els.progressBox.style.display = 'none';
            els.progressBar.style.width = '0';
            els.shareBtn.disabled = false;
            els.shareBtn.textContent = 'انتشار پست';
            els.successAnim.classList.remove('active');
        }

        // --- FEED LOGIC ---
        async function loadPosts() {
            try {
                const res = await fetch(`${PROXY_URL}?path=rubino_posts`, {
                    headers: { 'Authorization': `Bearer ${clientToken}`, 'X-User-Username': currentUser.username }
                });
                const data = await res.json();
                if(data) {
                    postsData = data;
                    renderFeed(data);
                }
            } catch(e) { console.log(e); }
        }

        function renderFeed(data) {
            els.feed.innerHTML = '';
            const posts = Object.entries(data)
                .map(([id, post]) => ({...post, id}))
                .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

            if(posts.length === 0) {
                els.feed.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-muted)">هیچ پستی وجود ندارد</div>';
                return;
            }

            posts.forEach(post => {
                const isOwner = post.sender_username === currentUser.username;
                const avatar = `https://ui-avatars.com/api/?name=${post.sender_username}&background=random&color=fff&size=128`;
                
                const card = document.createElement('div');
                card.className = `post-card ${post.isGolden ? 'golden-post' : ''}`;
                card.id = `post-${post.id}`;
                
                let mediaHtml = '';
                if(post.type === 'video') {
                    mediaHtml = `
                        <video class="post-media" src="${post.media_url}" loop playsinline muted></video>
                        <div class="media-loader"><div class="spinner"></div></div>
                    `;
                } else {
                    mediaHtml = `
                        <img class="post-media" src="${post.media_url}" loading="lazy">
                        <div class="media-loader"><div class="spinner"></div></div>
                    `;
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar">
                            <span class="username">${post.sender_username}</span>
                        </div>
                        ${isOwner ? `<button class="header-btn" onclick="openOptions('${post.id}')" style="width:30px;height:30px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>` : ''}
                    </div>
                    <div class="post-media-container" ondblclick="triggerLike('${post.id}')">
                        ${mediaHtml}
                        <div class="heart-overlay" id="heart-${post.id}">❤</div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn ${post.likes && post.likes[currentUser.username] ? 'liked' : ''}" id="btn-like-${post.id}" onclick="toggleLike('${post.id}')">
                            <svg viewBox="0 0 24 24" fill="${post.likes && post.likes[currentUser.username] ? 'currentColor' : 'none'}" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                    </div>
                    <div class="post-likes" id="likes-count-${post.id}">
                        ${post.likes ? Object.keys(post.likes).length : 0} پسند
                    </div>
                    <div class="post-caption">
                        <span class="caption-username">${post.sender_username}</span>
                        ${post.caption}
                    </div>
                    <div class="post-time">${timeAgo(post.timestamp)}</div>
                `;
                els.feed.appendChild(card);
            });

            setupMediaLoading();
            setupIntersectionObserver();
        }

        // --- MEDIA UTILS ---
        function setupMediaLoading() {
            document.querySelectorAll('.post-media').forEach(media => {
                if(media.tagName === 'IMG') {
                    media.onload = function() {
                        this.classList.add('loaded');
                        this.nextElementSibling.style.opacity = '0';
                    }
                } else {
                    media.onloadeddata = function() {
                        this.classList.add('loaded');
                        this.nextElementSibling.style.opacity = '0';
                    }
                }
            });
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if(entry.isIntersecting) {
                        video.play().catch(()=>{});
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('video.post-media').forEach(v => observer.observe(v));
        }

        // --- ACTIONS ---
        window.triggerLike = (id) => {
            const heart = document.getElementById(`heart-${id}`);
            heart.classList.remove('active');
            void heart.offsetWidth; // Trigger reflow
            heart.classList.add('active');
            
            const btn = document.getElementById(`btn-like-${id}`);
            if(!btn.classList.contains('liked')) toggleLike(id);
        };

        window.toggleLike = async (id) => {
            const btn = document.getElementById(`btn-like-${id}`);
            const countEl = document.getElementById(`likes-count-${id}`);
            const isLiked = btn.classList.contains('liked');
            let count = parseInt(countEl.innerText);

            // Optimistic UI Update
            btn.classList.toggle('liked');
            const svg = btn.querySelector('svg');
            
            if(isLiked) {
                // Unlike
                svg.setAttribute('fill', 'none');
                countEl.innerText = `${Math.max(0, count - 1)} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${id}/likes/${currentUser.username}`, {
                        method: 'DELETE', headers: {'Authorization':`Bearer ${clientToken}`, 'X-User-Username':currentUser.username}
                    });
                } catch(e) { /* Revert if failed */ }
            } else {
                // Like
                svg.setAttribute('fill', 'currentColor');
                countEl.innerText = `${count + 1} پسند`;
                try {
                    await fetch(`${PROXY_URL}?path=rubino_posts/${id}/likes/${currentUser.username}`, {
                        method: 'PUT',
                        headers: {'Authorization':`Bearer ${clientToken}`, 'X-User-Username':currentUser.username, 'Content-Type': 'application/json'},
                        body: 'true'
                    });
                } catch(e) {}
            }
        };

        window.openOptions = (id) => {
            currentOptionsPostId = id;
            els.optionsModal.classList.add('active');
        };

        async function deletePost() {
            if(!currentOptionsPostId) return;
            if(!confirm('آیا مطمئن هستید؟')) return;
            
            try {
                await fetch(`${PROXY_URL}?path=rubino_posts/${currentOptionsPostId}`, {
                    method: 'DELETE',
                    headers: {'Authorization':`Bearer ${clientToken}`, 'X-User-Username':currentUser.username}
                });
                document.getElementById(`post-${currentOptionsPostId}`).remove();
                els.optionsModal.classList.remove('active');
                showToast('پست حذف شد');
            } catch(e) { showToast('خطا در حذف', 'error'); }
        }

        // --- UTILS ---
        function renderSkeletons() {
            let html = '';
            for(let i=0; i<2; i++) {
                html += `
                    <div class="post-card" style="opacity:1; transform:none;">
                        <div class="post-header">
                            <div class="skeleton" style="width:40px;height:40px;border-radius:50%"></div>
                            <div class="skeleton" style="width:100px;height:16px;margin-right:10px;border-radius:4px"></div>
                        </div>
                        <div class="skeleton" style="width:100%;height:300px;"></div>
                        <div class="post-actions">
                            <div class="skeleton" style="width:24px;height:24px;border-radius:4px"></div>
                            <div class="skeleton" style="width:24px;height:24px;border-radius:4px"></div>
                        </div>
                    </div>
                `;
            }
            els.feed.innerHTML = html;
        }

        function showToast(msg, type='success') {
            els.toast.textContent = msg;
            els.toast.className = `toast ${type} active`;
            setTimeout(() => els.toast.classList.remove('active'), 3000);
        }

        function timeAgo(dateString) {
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            if (seconds < 60) return 'همین الان';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} دقیقه پیش`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ساعت پیش`;
            return `${Math.floor(hours / 24)} روز پیش`;
        }

        // Pull to refresh logic
        function setupPullRefresh() {
            let startY = 0;
            let isPulling = false;
            const spinner = document.getElementById('pull-spinner');
            const indicator = document.getElementById('pull-indicator');

            els.feed.addEventListener('touchstart', e => {
                if(els.feed.scrollTop === 0) { startY = e.touches[0].clientY; isPulling = true; }
            }, {passive: true});

            els.feed.addEventListener('touchmove', e => {
                if(!isPulling) return;
                const diff = e.touches[0].clientY - startY;
                if(diff > 0 && els.feed.scrollTop === 0) {
                    e.preventDefault();
                    indicator.style.opacity = Math.min(diff/100, 1);
                    spinner.style.transform = `rotate(${diff*2}deg)`;
                }
            }, {passive: false});

            els.feed.addEventListener('touchend', async e => {
                if(!isPulling) return;
                isPulling = false;
                const diff = e.changedTouches[0].clientY - startY;
                if(diff > 60) {
                    indicator.style.opacity = 1;
                    await loadPosts();
                }
                indicator.style.opacity = 0;
            });
        }
    </script>
</body>
