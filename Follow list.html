<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لیست برترین‌ها - همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #1E90FF;
            --gold-color: #FFD700;
            --gold-bg: rgba(255, 215, 0, 0.08);
            --gold-border: rgba(255, 215, 0, 0.4);
            
            /* Admin Specific Variables */
            --admin-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --admin-border: #764ba2;
            --admin-glow: rgba(118, 75, 162, 0.4);
            --admin-badge-color: #00d2ff;

            --rank-1: #FFD700;
            --rank-2: #C0C0C0;
            --rank-3: #CD7F32;
            --modal-bg: #1C2128;
            --online-color: #28a745;
            --offline-color: #6a737d;
            --input-bg: #0d1117;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
            background-color: var(--background-color); display: flex; flex-direction: column;
            position: relative;
        }

        /* --- Header --- */
        .header-area {
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.3); flex-shrink: 0;
        }

        .header-top {
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
        }
        .header-top h1 { font-size: 1.2rem; margin: 0; font-weight: 900; color: var(--text-primary); }
        .back-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 5px; }

        /* --- Search --- */
        .search-container { padding: 0 20px 15px 20px; }
        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-color);
            padding: 12px 45px 12px 15px; border-radius: 14px; color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif; font-size: 0.95rem; transition: all 0.3s ease;
        }
        .search-box input:focus { outline: none; border-color: var(--primary-color); background-color: #05070a; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

        /* --- Tabs --- */
        .tabs-container { display: flex; padding: 0 20px; gap: 15px; position: relative; }
        .tab-btn {
            flex: 1; padding: 12px; background: transparent; border: none;
            color: var(--text-secondary); font-family: 'Vazirmatn', sans-serif; font-weight: 700;
            cursor: pointer; transition: color 0.3s; padding-bottom: 15px;
        }
        .tab-btn.active { color: var(--primary-color); }
        .tab-indicator {
            position: absolute; bottom: 0; left: 20px; height: 3px;
            background-color: var(--primary-color); width: calc(50% - 27.5px); /* Adjust for gap/padding */
            transition: transform 0.3s cubic-bezier(0.645, 0.045, 0.355, 1); border-radius: 3px 3px 0 0;
        }

        /* --- List --- */
        .list-container {
            flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px;
            scroll-behavior: smooth;
        }

        /* --- User Card Styles --- */
        .user-card {
            display: flex; align-items: center;
            background-color: var(--secondary-color);
            padding: 12px 15px; border-radius: 18px; margin-bottom: 12px;
            border: 1px solid var(--border-color); position: relative;
            cursor: pointer; transition: transform 0.2s, background-color 0.2s;
            animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(20px);
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .user-card:hover { background-color: var(--secondary-hover); }
        .user-card:active { transform: scale(0.98); }

        /* Self Card */
        .user-card.is-me {
            background-color: var(--gold-bg); border: 2px solid var(--gold-border);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        /* --- ADMIN CARD STYLES (The Cool Part) --- */
        .user-card.is-admin {
            background: linear-gradient(145deg, rgba(22, 27, 34, 0.9), rgba(30, 30, 50, 0.95));
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            overflow: visible; /* For glow effects outside */
        }

        /* Gradient Border Trick */
        .user-card.is-admin::before {
            content: ''; position: absolute; top: -2px; bottom: -2px; left: -2px; right: -2px;
            background: var(--admin-gradient); z-index: -1; border-radius: 20px;
        }

        .user-card.is-admin .rank-number { color: #fff; text-shadow: 0 0 8px var(--admin-border); }
        
        /* Admin Avatar Ring */
        .user-card.is-admin .avatar { border: 2px solid #fff; box-shadow: 0 0 10px var(--admin-glow); }

        /* Rank Numbers */
        .rank-number {
            font-size: 1.2rem; font-weight: 900; width: 35px; text-align: center;
            margin-left: 10px; color: var(--text-secondary);
        }
        .user-card[data-rank="1"] .rank-number { color: var(--rank-1); font-size: 1.6rem; }
        .user-card[data-rank="2"] .rank-number { color: var(--rank-2); font-size: 1.5rem; }
        .user-card[data-rank="3"] .rank-number { color: var(--rank-3); font-size: 1.4rem; }

        .avatar-wrapper { position: relative; margin-left: 15px; width: 55px; height: 55px; flex-shrink: 0; }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            background-color: var(--secondary-hover); transition: transform 0.3s;
        }
        .status-dot {
            position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px;
            border-radius: 50%; border: 2px solid var(--secondary-color); z-index: 2;
        }
        .status-dot.online { background-color: var(--online-color); box-shadow: 0 0 4px var(--online-color); }
        .status-dot.offline { background-color: var(--offline-color); }

        .user-info { flex-grow: 1; min-width: 0; }
        
        .display-name-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
        .display-name { font-weight: 700; font-size: 1rem; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; }
        
        .username { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }
        
        /* Badges */
        .badge-me { background-color: var(--gold-color); color: #000; font-size: 0.65rem; padding: 2px 6px; border-radius: 8px; font-weight: 800; }
        .verified-tick { width: 16px; height: 16px; vertical-align: middle; }
        
        /* Admin Badge */
        .admin-badge-icon {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--admin-gradient); border-radius: 50%;
            width: 18px; height: 18px; margin-right: 2px;
            box-shadow: 0 0 8px var(--admin-glow);
            animation: pulse-admin 2s infinite;
        }
        .admin-badge-icon svg { width: 10px; height: 10px; color: white; }
        
        @keyframes pulse-admin { 
            0% { box-shadow: 0 0 0 0 rgba(118, 75, 162, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(118, 75, 162, 0); }
            100% { box-shadow: 0 0 0 0 rgba(118, 75, 162, 0); }
        }

        .follower-count { text-align: center; padding-right: 10px; min-width: 70px; }
        .count-value { font-size: 1.1rem; font-weight: 700; color: var(--primary-color); }
        .user-card.is-admin .count-value { color: #a78bfa; }

        /* --- Skeleton & Empty State --- */
        .empty-state { text-align: center; margin-top: 50px; color: var(--text-secondary); display: none; }
        .skeleton-container {
            display: flex; flex-direction: column; gap: 12px;
            width: 100%; position: absolute; top: 145px; padding: 15px; z-index: 40;
        }
        .skeleton-card {
            height: 80px; background-color: var(--secondary-color); border-radius: 16px;
            animation: shimmer 1.5s infinite linear;
            background: linear-gradient(90deg, #2C2F33 0%, #3a3f45 50%, #2C2F33 100%); background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* --- Find Me Button --- */
        .find-me-btn {
            position: absolute; bottom: 25px; right: 25px;
            background: linear-gradient(135deg, var(--gold-color), #FFA500);
            color: #1a1a1a; border: none; border-radius: 50px; padding: 12px 20px;
            font-weight: 700; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            cursor: pointer; display: flex; align-items: center; gap: 8px; z-index: 20;
            opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        .find-me-btn.visible { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* --- Profile Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 100; opacity: 0; visibility: hidden;
            transition: all 0.3s; display: flex; align-items: flex-end; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .profile-modal {
            background-color: var(--modal-bg); width: 100%; max-width: 480px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 25px 20px; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 -5px 30px rgba(0,0,0,0.6);
        }
        .modal-overlay.active .profile-modal { transform: translateY(0); }

        /* Admin Modal Theme */
        .profile-modal.admin-theme {
            background: radial-gradient(circle at top, #231a33 0%, var(--modal-bg) 50%);
            border-top: 1px solid var(--admin-border);
        }
        .profile-modal.admin-theme .profile-avatar { border-color: #764ba2; box-shadow: 0 0 20px rgba(118, 75, 162, 0.5); }

        .modal-handle { width: 50px; height: 5px; background: var(--border-color); border-radius: 10px; margin: 0 auto 20px; }
        
        .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary-color);
            padding: 2px; background: var(--secondary-color); object-fit: cover; margin-bottom: 15px;
        }
        
        .profile-name { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 6px; justify-content: center; }
        .admin-tag {
            font-size: 0.75rem; background: var(--admin-gradient); color: white;
            padding: 2px 8px; border-radius: 4px; margin-top: 5px; font-weight: 600; display: none;
        }
        
        .profile-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; padding: 15px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .stat-value { font-size: 1.2rem; font-weight: 700; display: block; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
        .profile-bio { text-align: center; margin-bottom: 25px; font-size: 0.95rem; opacity: 0.9; line-height: 1.5; }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; display: flex; justify-content: center; gap: 8px; align-items: center; font-family: 'Vazirmatn'; }
        .btn-message { background: var(--secondary-hover); color: white; }
        .btn-follow { background: var(--primary-color); color: white; }
        .btn-follow.action-unfollow { background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header-area">
            <div class="header-top">
                <button class="back-btn" onclick="window.history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1>برترین‌ها</h1>
                <div style="width: 24px;"></div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="جستجوی کاربر...">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                </div>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">کل کاربران</button>
                <button class="tab-btn" data-tab="friends" onclick="switchTab('friends')">دوستان من</button>
                <div class="tab-indicator" id="tab-indicator"></div>
            </div>
        </div>

        <!-- Skeleton -->
        <div class="skeleton-container" id="skeleton-loading">
            <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
            <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>

        <!-- List Container -->
        <div class="list-container" id="list-container">
            <div class="empty-state" id="empty-state">
                <p id="empty-text">کاربری یافت نشد.</p>
            </div>
        </div>

        <!-- FAB -->
        <button class="find-me-btn" id="find-me-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            پیدا کردن من
        </button>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profile-overlay">
        <div class="profile-modal" id="profile-modal-content">
            <div class="modal-handle"></div>
            <div class="profile-header">
                <img src="" id="p-avatar" class="profile-avatar" alt="Avatar">
                <h2 id="p-name" class="profile-name"></h2>
                <div id="p-admin-tag" class="admin-tag">مدیر سیستم</div>
                <div id="p-username" class="username" style="font-size: 1rem; margin-top:5px;"></div>
            </div>
            
            <div class="profile-stats">
                <div class="stat-item" style="text-align: center;">
                    <span id="p-followers" class="stat-value">0</span>
                    <span class="stat-label">دنبال‌کننده</span>
                </div>
                <div class="stat-item" style="text-align: center;">
                    <span id="p-following" class="stat-value">0</span>
                    <span class="stat-label">دنبال‌شونده</span>
                </div>
            </div>

            <div id="p-bio" class="profile-bio"></div>

            <div class="action-buttons">
                <button id="p-message-btn" class="btn btn-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    پیام
                </button>
                <button id="p-follow-btn" class="btn btn-follow">دنبال کردن</button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_TICK_URL = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';

        /* 
           SECURITY NOTE: 
           برای امنیت بالا بدون بک‌اند، ما نام‌های کاربری ادمین را اینجا هم چک می‌کنیم.
           این کار مانع می‌شود کسی صرفاً با اینجکت کردن HTML خودش را ادمین جا بزند.
           اگر دیتابیس شما فیلد role: 'admin' دارد، آن را هم بررسی می‌کنیم.
        */
        const KNOWN_ADMINS = ['admin', 'support', 'manager']; // نام‌های کاربری ادمین را اینجا اضافه کنید (اختیاری برای امنیت بیشتر)

        // --- Elements ---
        const listContainer = document.getElementById('list-container');
        const skeletonLoading = document.getElementById('skeleton-loading');
        const findMeBtn = document.getElementById('find-me-btn');
        const profileOverlay = document.getElementById('profile-overlay');
        const searchInput = document.getElementById('search-input');
        const tabIndicator = document.getElementById('tab-indicator');
        const emptyState = document.getElementById('empty-state');
        
        // Profile Elements
        const modalContent = document.getElementById('profile-modal-content');
        const pAvatar = document.getElementById('p-avatar');
        const pName = document.getElementById('p-name');
        const pUsername = document.getElementById('p-username');
        const pAdminTag = document.getElementById('p-admin-tag');
        const pFollowers = document.getElementById('p-followers');
        const pFollowing = document.getElementById('p-following');
        const pBio = document.getElementById('p-bio');
        const pFollowBtn = document.getElementById('p-follow-btn');
        const pMessageBtn = document.getElementById('p-message-btn');

        // --- State ---
        let currentUser = null;
        let clientToken = null;
        let usersCache = {}; 
        let followersCache = {}; 
        let followingCache = {}; 
        let globalLeaderboard = [];
        let currentTab = 'all';

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) {
                window.location.href = 'login.html'; // Redirect if not logged in
                return;
            }
            currentUser = JSON.parse(storedUser);

            profileOverlay.addEventListener('click', (e) => {
                if (e.target === profileOverlay) closeProfileModal();
            });
            document.querySelector('.modal-handle').addEventListener('click', closeProfileModal);
            searchInput.addEventListener('input', (e) => renderCurrentView(e.target.value));

            try {
                await refreshClientToken();
                await loadAndProcessData();
            } catch (error) {
                console.error(error);
                skeletonLoading.style.display = 'none';
                emptyState.style.display = 'block';
                document.getElementById('empty-text').innerHTML = 'خطا در بارگذاری اطلاعات.<br>لطفا اتصال خود را بررسی کنید.';
            }
        });

        // --- Tabs ---
        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            
            // Adjust indicator based on tab count (2 tabs = 50% each roughly)
            // Simplified for CSS calc logic
            if (tab === 'friends') {
                tabIndicator.style.transform = 'translateX(-110%)'; // Adjust based on RTL
            } else {
                tabIndicator.style.transform = 'translateX(0)';
            }
            
            listContainer.scrollTop = 0;
            renderCurrentView(searchInput.value);
        }

        // --- API ---
        async function refreshClientToken() {
            const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            if (!response.ok) throw new Error('Token Error');
            const data = await response.json();
            clientToken = data.token;
        }

        async function proxyRequest(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${clientToken}`,
                    'X-User-Username': currentUser.username
                }
            };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            const response = await fetch(`${PROXY_URL}?path=${path}`, options);
            if (!response.ok) return null;
            if (method === 'DELETE' || response.status === 204) return true;
            return response.json();
        }

        // --- Logic ---
        // تابع بررسی ادمین: ترکیب دیتای سرور و لیست سفید
        function isUserAdmin(user) {
            const serverSaysAdmin = (user.role === 'admin' || user.isAdmin === true);
            const whitelistSaysAdmin = KNOWN_ADMINS.includes(user.username);
            
            // اگر تیک آبی داشته باشد و یکی از شرط‌های بالا برقرار باشد = ادمین معتبر
            // یا اگر صرفا در دیتابیس فلگ ادمین داشته باشد (بسته به استراتژی شما)
            // برای امنیت بالا: فقط کسانی که هم تیک آبی دارند هم نقش ادمین
            return (serverSaysAdmin || whitelistSaysAdmin) && user.verified;
        }

        async function loadAndProcessData() {
            const [usersData, followersData, followingData] = await Promise.all([
                proxyRequest('users'),
                proxyRequest('followers'),
                proxyRequest('following')
            ]);

            if (!usersData) throw new Error('No data');

            usersCache = usersData;
            followersCache = followersData || {};
            followingCache = followingData || {};

            const leaderboard = [];
            Object.keys(usersData).forEach(userId => {
                const user = usersData[userId];
                if (!user) return;

                const count = followersCache[userId] ? Object.keys(followersCache[userId]).length : 0;
                
                leaderboard.push({
                    ...user, // Spread all user props including role, verified etc.
                    followerCount: count
                });
            });

            leaderboard.sort((a, b) => b.followerCount - a.followerCount);
            leaderboard.forEach((user, index) => user.globalRank = index + 1);
            
            globalLeaderboard = leaderboard;
            skeletonLoading.style.display = 'none';
            renderCurrentView();
        }

        function renderCurrentView(searchQuery = '') {
            listContainer.innerHTML = '';
            findMeBtn.classList.remove('visible');

            let data = currentTab === 'all' ? globalLeaderboard : [];
            
            if (currentTab === 'friends') {
                const myFollowing = followingCache[currentUser.username] || {};
                data = globalLeaderboard.filter(u => myFollowing[u.username] && u.username !== currentUser.username);
            }

            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                data = data.filter(u => u.username.toLowerCase().includes(q) || (u.displayName && u.displayName.toLowerCase().includes(q)));
            }

            if (data.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            let myIdInDom = null;

            data.forEach((user, i) => {
                const isMe = user.username === currentUser.username;
                const isAdmin = isUserAdmin(user);
                
                // Admin badge HTML
                const adminBadgeHtml = isAdmin ? `
                    <span class="admin-badge-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.8 1.1 2.8 2.5V11c.6 0 1.2.6 1.2 1.2v3.5c0 .7-.6 1.3-1.2 1.3H9.2c-.6 0-1.2-.6-1.2-1.2v-3.5c0-.7.6-1.3 1.2-1.3V9.5C9.2 8.1 10.6 7 12 7z"/></svg>
                    </span>
                ` : '';

                const verifiedHtml = user.verified ? `<img src="${VERIFIED_TICK_URL}" class="verified-tick" alt="v">` : '';
                const avatarUrl = user.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName)}&background=161B22&color=fff`;
                const statusClass = user.isOnline ? 'online' : 'offline';
                const elId = `u-${user.username}`;
                if (isMe) myIdInDom = elId;

                // Add specific class for admin styling
                const cardClass = `user-card ${isMe ? 'is-me' : ''} ${isAdmin ? 'is-admin' : ''}`;

                const html = `
                    <div class="${cardClass}" id="${elId}" onclick="openUserProfile('${user.username}')" style="animation-delay: ${i < 15 ? i * 0.05 : 0}s">
                        <div class="rank-number">${user.globalRank}</div>
                        <div class="avatar-wrapper">
                            <img src="${avatarUrl}" class="avatar" loading="lazy">
                            <div class="status-dot ${statusClass}"></div>
                        </div>
                        <div class="user-info">
                            <div class="display-name-row">
                                ${adminBadgeHtml}
                                <span class="display-name">${user.displayName || user.username}</span>
                                ${verifiedHtml}
                                ${isMe ? '<span class="badge-me">شما</span>' : ''}
                            </div>
                            <div class="username">@${user.username}</div>
                        </div>
                        <div class="follower-count">
                            <span class="count-value">${formatNum(user.followerCount)}</span>
                            <span class="count-label">دنبال‌کننده</span>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            if (myIdInDom && currentTab === 'all' && !searchQuery) {
                findMeBtn.classList.add('visible');
                findMeBtn.onclick = () => {
                    document.getElementById(myIdInDom).scrollIntoView({behavior: 'smooth', block: 'center'});
                    const el = document.getElementById(myIdInDom);
                    el.style.transition = 'transform 0.3s';
                    el.style.transform = 'scale(1.05)';
                    setTimeout(() => el.style.transform = 'scale(1)', 400);
                };
            }
        }

        // --- Profile Modal ---
        async function openUserProfile(username) {
            const user = usersCache[username];
            if (!user) return;
            
            const isAdmin = isUserAdmin(user);
            const isMe = username === currentUser.username;

            // Apply Admin Theme to Modal
            if (isAdmin) {
                modalContent.classList.add('admin-theme');
                pAdminTag.style.display = 'inline-block';
            } else {
                modalContent.classList.remove('admin-theme');
                pAdminTag.style.display = 'none';
            }

            const verifiedHtml = user.verified ? `<img src="${VERIFIED_TICK_URL}" class="verified-tick" style="width:20px;height:20px;">` : '';
            
            // Admin Badge in Modal
            const adminIcon = isAdmin ? `
                <span class="admin-badge-icon" style="width:24px;height:24px; margin-left:5px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                </span>` : '';

            pAvatar.src = user.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName)}&background=161B22&color=fff&size=150`;
            pName.innerHTML = adminIcon + (user.displayName || user.username) + " " + verifiedHtml;
            pUsername.textContent = `@${user.username}`;
            pBio.textContent = user.bio || "بدون بیوگرافی";

            const fCount = followersCache[username] ? Object.keys(followersCache[username]).length : 0;
            const ingCount = followingCache[username] ? Object.keys(followingCache[username]).length : 0;
            pFollowers.textContent = formatNum(fCount);
            pFollowing.textContent = formatNum(ingCount);

            if (isMe) {
                document.querySelector('.action-buttons').style.display = 'none';
            } else {
                document.querySelector('.action-buttons').style.display = 'grid';
                pMessageBtn.onclick = () => window.location.href = `pivi.html?uid=${username}`;
                
                const isFollowing = followingCache[currentUser.username] && followingCache[currentUser.username][username];
                updateFollowBtn(isFollowing);
                
                pFollowBtn.onclick = async () => {
                    pFollowBtn.disabled = true;
                    const currentStatus = pFollowBtn.classList.contains('action-unfollow');
                    const newVal = currentStatus ? null : true;
                    
                    try {
                        await proxyRequest('', 'PATCH', {
                            [`following/${currentUser.username}/${username}`]: newVal,
                            [`followers/${username}/${currentUser.username}`]: newVal
                        });
                        
                        // Local Update
                        if (!followingCache[currentUser.username]) followingCache[currentUser.username] = {};
                        if (!followersCache[username]) followersCache[username] = {};
                        
                        if (currentStatus) {
                            delete followingCache[currentUser.username][username];
                            delete followersCache[username][currentUser.username];
                        } else {
                            followingCache[currentUser.username][username] = true;
                            followersCache[username][currentUser.username] = true;
                        }

                        updateFollowBtn(!currentStatus);
                        pFollowers.textContent = formatNum(Object.keys(followersCache[username]).length);
                        
                        // Live update list count
                        const listCnt = document.querySelector(`#u-${username} .count-value`);
                        if (listCnt) listCnt.textContent = formatNum(Object.keys(followersCache[username]).length);

                    } catch (e) {
                        alert('خطا در ارتباط');
                    } finally {
                        pFollowBtn.disabled = false;
                    }
                };
            }

            profileOverlay.classList.add('active');
        }

        function closeProfileModal() {
            profileOverlay.classList.remove('active');
        }

        function updateFollowBtn(isFollowing) {
            if (isFollowing) {
                pFollowBtn.textContent = 'لغو دنبال کردن';
                pFollowBtn.className = 'btn btn-follow action-unfollow';
            } else {
                pFollowBtn.textContent = 'دنبال کردن';
                pFollowBtn.className = 'btn btn-follow';
            }
        }

        function formatNum(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }
    </script>
</body>
</html>
