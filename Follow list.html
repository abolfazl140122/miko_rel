<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لیست برترین‌ها - همیار</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');

        :root {
            --background-color: #0D1117;
            --secondary-color: #161B22;
            --secondary-hover: #2C2F33;
            --border-color: #30363d;
            --text-primary: #E4E6EB;
            --text-secondary: #8b949e;
            --primary-color: #1E90FF;
            --gold-color: #FFD700;
            --gold-bg: rgba(255, 215, 0, 0.08);
            --gold-border: rgba(255, 215, 0, 0.4);
            --rank-1: #FFD700;
            --rank-2: #C0C0C0;
            --rank-3: #CD7F32;
            --modal-bg: #1C2128;
            --online-color: #28a745;
            --offline-color: #6a737d;
            --input-bg: #0d1117;
            --active-tab-bg: #1E90FF;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header & Search Area --- */
        .header-area {
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .header-top {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-top h1 { font-size: 1.2rem; margin: 0; font-weight: 900; color: var(--text-primary); }
        .back-btn { background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 5px; display: flex; align-items: center; transition: transform 0.2s; }
        .back-btn:active { transform: scale(0.9); }

        /* --- Search Bar --- */
        .search-container {
            padding: 0 20px 15px 20px;
            position: relative;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 45px 12px 15px;
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(30, 144, 255, 0.15);
            background-color: #05070a;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.3s;
        }

        .search-box input:focus + .search-icon {
            color: var(--primary-color);
        }

        /* --- Tabs --- */
        .tabs-container {
            display: flex;
            padding: 0 20px;
            gap: 15px;
            margin-bottom: 0; /* Bottom handled by container padding */
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            padding-bottom: 15px;
        }

        .tab-btn.active {
            color: var(--primary-color);
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background-color: var(--primary-color);
            width: 50%; /* Dynamically updated via JS ideally, simplifying here */
            transition: transform 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-radius: 3px 3px 0 0;
        }

        /* --- List Container --- */
        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
            scroll-behavior: smooth;
            position: relative;
        }

        /* --- User Card --- */
        .user-card {
            display: flex;
            align-items: center;
            background-color: var(--secondary-color);
            padding: 12px 15px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .user-card:hover { background-color: var(--secondary-hover); }
        .user-card:active { transform: scale(0.98); }

        .user-card.is-me {
            background-color: var(--gold-bg);
            border: 2px solid var(--gold-border);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        
        .user-card.is-me .rank-number {
            color: var(--gold-color);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .rank-number {
            font-size: 1.2rem;
            font-weight: 900;
            width: 35px;
            text-align: center;
            margin-left: 10px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .user-card[data-rank="1"] .rank-number { color: var(--rank-1); font-size: 1.6rem; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .user-card[data-rank="2"] .rank-number { color: var(--rank-2); font-size: 1.5rem; }
        .user-card[data-rank="3"] .rank-number { color: var(--rank-3); font-size: 1.4rem; }

        .avatar-wrapper {
            position: relative;
            margin-left: 15px;
            width: 55px;
            height: 55px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--secondary-hover);
            border: 2px solid transparent;
            transition: transform 0.3s;
        }
        .user-card:hover .avatar { transform: scale(1.05); }
        .user-card.is-me .avatar { border-color: var(--gold-color); }

        /* Online/Offline Dot */
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--secondary-color);
            z-index: 2;
        }
        .status-dot.online { background-color: var(--online-color); box-shadow: 0 0 4px var(--online-color); }
        .status-dot.offline { background-color: var(--offline-color); }

        .user-info { flex-grow: 1; min-width: 0; }
        .display-name { font-weight: 700; font-size: 1rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .username { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }
        .badge-me { display: inline-block; background-color: var(--gold-color); color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .follower-count { text-align: center; padding-right: 10px; min-width: 70px; }
        .count-value { font-size: 1.1rem; font-weight: 700; color: var(--primary-color); }
        .user-card.is-me .count-value { color: var(--gold-color); }
        .count-label { font-size: 0.7rem; color: var(--text-secondary); display: block; }

        /* --- Empty State --- */
        .empty-state {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
            animation: fadeIn 0.5s;
            display: none;
        }
        .empty-state svg { width: 60px; height: 60px; margin-bottom: 15px; opacity: 0.5; }
        .empty-state p { font-size: 1rem; margin: 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Find Me Button --- */
        .find-me-btn {
            position: absolute; bottom: 25px; right: 25px;
            background: linear-gradient(135deg, var(--gold-color), #FFA500);
            color: #1a1a1a; border: none; border-radius: 50px; padding: 12px 20px;
            font-family: 'Vazirmatn', sans-serif; font-weight: 700; font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); cursor: pointer;
            display: flex; align-items: center; gap: 8px; z-index: 20;
            transition: transform 0.2s; opacity: 0; pointer-events: none;
        }
        .find-me-btn.visible { opacity: 1; pointer-events: auto; animation: popIn 0.5s; }
        .find-me-btn:active { transform: scale(0.95); }
        .find-me-btn svg { width: 20px; height: 20px; }

        /* --- Skeleton Loading --- */
        .skeleton-container {
            display: flex; flex-direction: column; gap: 12px;
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            padding: 15px; background: var(--background-color); z-index: 40; margin-top: 145px; /* Offset for header */
        }
        .skeleton-card {
            display: flex; align-items: center; padding: 12px 15px;
            background-color: var(--secondary-color); border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .sk-rank { width: 30px; height: 20px; background: #2C2F33; border-radius: 4px; margin-left: 10px; }
        .sk-avatar { width: 55px; height: 55px; border-radius: 50%; background: #2C2F33; margin-left: 15px; flex-shrink: 0; }
        .sk-info { flex-grow: 1; }
        .sk-line-1 { width: 60%; height: 14px; background: #2C2F33; border-radius: 4px; margin-bottom: 8px; }
        .sk-line-2 { width: 40%; height: 10px; background: #2C2F33; border-radius: 4px; }
        .sk-count { width: 40px; height: 30px; background: #2C2F33; border-radius: 4px; }

        /* Skeleton Animation */
        .sk-rank, .sk-avatar, .sk-line-1, .sk-line-2, .sk-count {
            animation: shimmer 1.5s infinite linear;
            background: linear-gradient(90deg, #2C2F33 0%, #3a3f45 50%, #2C2F33 100%);
            background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .verified-tick { width: 16px; height: 16px; vertical-align: middle; }

        /* --- Profile Modal (Bottom Sheet) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 100; opacity: 0;
            visibility: hidden; transition: opacity 0.3s;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .profile-modal {
            background-color: var(--modal-bg); width: 100%; max-width: 480px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 25px 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative; box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
            max-height: 85vh; overflow-y: auto;
        }
        .modal-overlay.active .profile-modal { transform: translateY(0); }

        .modal-handle {
            width: 50px; height: 5px; background-color: var(--border-color);
            border-radius: 10px; margin: 0 auto 20px;
        }

        .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary-color);
            padding: 2px; background-color: var(--secondary-color); object-fit: cover;
            margin-bottom: 15px;
        }
        .profile-name { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 6px; }
        .profile-username { font-size: 0.95rem; color: var(--text-secondary); margin-top: 5px; }
        
        .profile-stats {
            display: flex; justify-content: center; gap: 30px; margin: 20px 0;
            padding: 15px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); display: block; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }

        .profile-bio {
            color: var(--text-primary); text-align: center; font-size: 0.95rem;
            line-height: 1.5; margin-bottom: 25px; opacity: 0.9;
        }

        /* Action Buttons Grid */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .btn {
            width: 100%; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.2s; border: none; font-family: 'Vazirmatn', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        /* Message Button */
        .btn-message {
            background-color: var(--secondary-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-message:hover { background-color: var(--border-color); }
        .btn-message svg { width: 20px; height: 20px; }

        /* Follow Button */
        .btn-follow { background-color: var(--primary-color); color: white; }
        .btn-follow.action-unfollow { background-color: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); }
        .btn-follow:disabled { opacity: 0.6; cursor: wait; }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>

        <!-- FAB Button -->

    <script>
        // --- Configuration ---
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const SHARED_SECRET = 'miko1234';
        const VERIFIED_TICK_URL = 'https://up.20script.ir/file/edfa-tickpng-parspng-com-4.png';

        // --- DOM Elements ---
        const listContainer = document.getElementById('list-container');
        const skeletonLoading = document.getElementById('skeleton-loading');
        const findMeBtn = document.getElementById('find-me-btn');
        const profileOverlay = document.getElementById('profile-overlay');
        const searchInput = document.getElementById('search-input');
        const tabIndicator = document.getElementById('tab-indicator');
        const emptyState = document.getElementById('empty-state');
        const emptyText = document.getElementById('empty-text');
        
        // Profile Modal Elements
        const pAvatar = document.getElementById('p-avatar');
        const pName = document.getElementById('p-name');
        const pUsername = document.getElementById('p-username');
        const pFollowers = document.getElementById('p-followers');
        const pFollowing = document.getElementById('p-following');
        const pBio = document.getElementById('p-bio');
        const pFollowBtn = document.getElementById('p-follow-btn');
        const pMessageBtn = document.getElementById('p-message-btn');

        // --- State ---
        let currentUser = null;
        let clientToken = null;
        let usersCache = {}; 
        let followersCache = {}; 
        let followingCache = {}; 
        
        let globalLeaderboard = []; // Holds processed data
        let currentTab = 'all'; // 'all' or 'friends'

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(storedUser);

            // Close modal events
            profileOverlay.addEventListener('click', (e) => {
                if (e.target === profileOverlay) closeProfileModal();
            });
            document.querySelector('.modal-handle').addEventListener('click', closeProfileModal);

            // Search Listener
            searchInput.addEventListener('input', (e) => {
                renderCurrentView(e.target.value);
            });

            try {
                await refreshClientToken();
                await loadAndProcessData();
            } catch (error) {
                console.error(error);
                skeletonLoading.style.display = 'none';
                listContainer.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">خطا در بارگذاری.<br>${error.message}</div>`;
            }
        });

        // --- Tabs Logic ---
        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;

            // Update UI Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');

            // Animate Indicator
            if (tab === 'friends') {
                tabIndicator.style.transform = 'translateX(-100%)';
            } else {
                tabIndicator.style.transform = 'translateX(0)';
            }

            // Reset scroll
            listContainer.scrollTop = 0;

            // Re-render list
            renderCurrentView(searchInput.value);
        }

        // --- API & Logic ---
        async function refreshClientToken() {
            const response = await fetch(`${PROXY_URL}?auth=token`, { headers: { 'X-Proxy-Secret': SHARED_SECRET } });
            if (!response.ok) throw new Error('خطا در دریافت توکن.');
            const data = await response.json();
            clientToken = data.token;
        }

        async function proxyRequest(path, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${clientToken}`,
                    'X-User-Username': currentUser.username
                }
            };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }

            const response = await fetch(`${PROXY_URL}?path=${path}`, options);
            if (!response.ok) return null;
            if (method === 'DELETE' || response.status === 204) return true;
            return response.json();
        }

        async function loadAndProcessData() {
            // Data fetching
            const [usersData, followersData, followingData] = await Promise.all([
                proxyRequest('users'),
                proxyRequest('followers'),
                proxyRequest('following')
            ]);

            if (!usersData) throw new Error('لیست کاربران دریافت نشد.');

            usersCache = usersData;
            followersCache = followersData || {};
            followingCache = followingData || {};

            // Process Global Leaderboard once
            const leaderboard = [];
            const allUserIds = Object.keys(usersData);

            allUserIds.forEach(userId => {
                const user = usersData[userId];
                if (!user) return;

                const count = followersCache[userId] ? Object.keys(followersCache[userId]).length : 0;

                leaderboard.push({
                    username: user.username,
                    displayName: user.displayName || user.username,
                    profilePicUrl: user.profilePicUrl,
                    verified: user.verified || false,
                    isOnline: user.isOnline || false,
                    followerCount: count
                });
            });

            // Sort globally based on follower count
            leaderboard.sort((a, b) => b.followerCount - a.followerCount);
            
            // Assign Global Rank
            leaderboard.forEach((user, index) => {
                user.globalRank = index + 1;
            });

            globalLeaderboard = leaderboard;

            // Hide skeleton and render
            skeletonLoading.style.display = 'none';
            renderCurrentView();
        }

        function renderCurrentView(searchQuery = '') {
            listContainer.innerHTML = '';
            findMeBtn.classList.remove('visible');
            
            // Filter based on Tab
            let dataToRender = [];
            if (currentTab === 'all') {
                dataToRender = globalLeaderboard;
            } else {
                // Show only people I follow (Friends/Following)
                // Note: We keep their global rank/order
                const myFollowing = followingCache[currentUser.username] || {};
                dataToRender = globalLeaderboard.filter(user => myFollowing[user.username] || user.username === currentUser.username); // Optionally include self
                
                // Remove self from friends tab if desired, or keep it. 
                // Usually "Friends" lists don't show self, but for ranking purposes let's see.
                // Let's remove self to be strictly "Following" list logic
                dataToRender = dataToRender.filter(user => user.username !== currentUser.username);
            }

            // Filter based on Search
            if (searchQuery.trim() !== '') {
                const lowerQ = searchQuery.toLowerCase();
                dataToRender = dataToRender.filter(user => 
                    user.username.toLowerCase().includes(lowerQ) || 
                    user.displayName.toLowerCase().includes(lowerQ)
                );
            }

            // Handle Empty States
            if (dataToRender.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.style.display = 'block';
                if (currentTab === 'friends' && searchQuery === '') {
                    emptyText.textContent = 'شما هنوز کسی را دنبال نکرده‌اید.';
                } else {
                    emptyText.textContent = 'نتیجه‌ای یافت نشد.';
                }
                return;
            } else {
                emptyState.style.display = 'none';
            }

            let myElementId = null;

            // Render List
            dataToRender.forEach((user, index) => {
                // We use globalRank for the ranking number to show consistent standing
                const rank = user.globalRank; 
                const isMe = user.username === currentUser.username;
                const avatarUrl = user.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName)}&background=161B22&color=fff&size=100`;
                const verifiedHtml = user.verified ? `<img src="${VERIFIED_TICK_URL}" class="verified-tick" alt="verified">` : '';
                
                // Status dot logic
                const statusClass = user.isOnline ? 'online' : 'offline';
                
                const elementId = `user-row-${user.username}`;
                if (isMe) myElementId = elementId;

                // Animation delay for staggered effect
                const animationDelay = index < 10 ? index * 0.05 : 0;

                const html = `
                    <div class="user-card ${isMe ? 'is-me' : ''}" 
                         id="${elementId}" 
                         data-rank="${rank}" 
                         onclick="openUserProfile('${user.username}')"
                         style="animation-delay: ${animationDelay}s">
                        <div class="rank-number">${rank}</div>
                        <div class="avatar-wrapper">
                            <img src="${avatarUrl}" class="avatar" alt="${user.displayName}" loading="lazy">
                            <div class="status-dot ${statusClass}"></div>
                        </div>
                        <div class="user-info">
                            <div class="display-name">
                                ${user.displayName} 
                                ${verifiedHtml}
                                ${isMe ? '<span class="badge-me">شما</span>' : ''}
                            </div>
                            <div class="username">@${user.username}</div>
                        </div>
                        <div class="follower-count">
                            <span class="count-value">${formatNumber(user.followerCount)}</span>
                            <span class="count-label">دنبال‌کننده</span>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            // Show 'Find Me' button only in 'All' tab and if searching is empty
            if (myElementId && currentTab === 'all' && searchQuery === '') {
                findMeBtn.classList.add('visible');
                findMeBtn.onclick = () => {
                    const el = document.getElementById(myElementId);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.style.transition = 'transform 0.3s';
                        el.style.transform = 'scale(1.02)';
                        setTimeout(() => el.style.transform = 'scale(1)', 300);
                    }
                };
            }
        }

        // --- Profile Modal Logic ---
        async function openUserProfile(username) {
            const user = usersCache[username];
            if (!user) return;

            const isMe = username === currentUser.username;
            
            // Populate Data
            const avatarUrl = user.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.username)}&background=161B22&color=fff&size=150`;
            pAvatar.src = avatarUrl;
            
            const verifiedHtml = user.verified ? `<img src="${VERIFIED_TICK_URL}" class="verified-tick" alt="verified">` : '';
            pName.innerHTML = (user.displayName || user.username) + " " + verifiedHtml;
            pUsername.textContent = `@${user.username}`;
            pBio.textContent = user.bio || "بدون بیوگرافی";

            // Stats
            const followerCnt = followersCache[username] ? Object.keys(followersCache[username]).length : 0;
            const followingCnt = followingCache[username] ? Object.keys(followingCache[username]).length : 0;
            pFollowers.textContent = formatNumber(followerCnt);
            pFollowing.textContent = formatNumber(followingCnt);

            // --- Button Logic ---
            pFollowBtn.onclick = null;
            pMessageBtn.onclick = null;

            if (isMe) {
                // Hide buttons for self
                pFollowBtn.style.display = 'none';
                pMessageBtn.style.display = 'none';
                // Adjust grid to block to remove empty space
                document.querySelector('.action-buttons').style.display = 'none';
            } else {
                document.querySelector('.action-buttons').style.display = 'grid';
                pFollowBtn.style.display = 'block';
                pMessageBtn.style.display = 'flex';

                // Message Button Action
                pMessageBtn.onclick = () => {
                    window.location.href = `pivi.html?uid=${username}`;
                };

                // Follow Button Setup
                pFollowBtn.disabled = true;
                pFollowBtn.textContent = '...';
                pFollowBtn.className = 'btn btn-follow';
                
                const isFollowing = await checkFollowStatus(username);
                updateFollowButtonUI(isFollowing);
                
                pFollowBtn.disabled = false;
                pFollowBtn.onclick = () => toggleFollow(username);
            }

            profileOverlay.classList.add('active');
        }

        function closeProfileModal() {
            profileOverlay.classList.remove('active');
        }

        async function checkFollowStatus(targetUsername) {
            if (followingCache[currentUser.username] && followingCache[currentUser.username][targetUsername]) {
                return true;
            }
            return false;
        }

        function updateFollowButtonUI(isFollowing) {
            if (isFollowing) {
                pFollowBtn.textContent = 'لغو دنبال کردن';
                pFollowBtn.className = 'btn btn-follow action-unfollow';
            } else {
                pFollowBtn.textContent = 'دنبال کردن';
                pFollowBtn.className = 'btn btn-follow';
            }
        }

        async function toggleFollow(targetUsername) {
            const isFollowing = pFollowBtn.classList.contains('action-unfollow');
            pFollowBtn.disabled = true;
            
            try {
                const valueToSet = isFollowing ? null : true;
                const payload = {
                    [`following/${currentUser.username}/${targetUsername}`]: valueToSet,
                    [`followers/${targetUsername}/${currentUser.username}`]: valueToSet
                };

                await proxyRequest('', 'PATCH', payload);

                // Update Cache
                if (!followingCache[currentUser.username]) followingCache[currentUser.username] = {};
                if (!followersCache[targetUsername]) followersCache[targetUsername] = {};

                if (isFollowing) {
                    delete followingCache[currentUser.username][targetUsername];
                    delete followersCache[targetUsername][currentUser.username];
                } else {
                    followingCache[currentUser.username][targetUsername] = true;
                    followersCache[targetUsername][currentUser.username] = true;
                }

                updateFollowButtonUI(!isFollowing);
                pFollowers.textContent = formatNumber(Object.keys(followersCache[targetUsername]).length);

                // Update List UI
                // If in friends tab and unfollowing, we might want to remove them, but for UX smoother to keep until refresh
                // But here we update the count displayed
                const listRow = document.querySelector(`#user-row-${targetUsername} .count-value`);
                if (listRow) listRow.textContent = formatNumber(Object.keys(followersCache[targetUsername]).length);
                
                // Refresh list if needed (optional, keeps data fresh)
                // renderCurrentView(searchInput.value); 

            } catch (error) {
                console.error("Follow error:", error);
                alert("خطا در انجام عملیات.");
            } finally {
                pFollowBtn.disabled = false;
            }
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

    </script>
</body>
