<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فروشگاه پرمیوم میکو</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- Premium Palette --- */
            --bg-dark: #05070a;
            --bg-panel: #0D1117;
            --bg-glass: rgba(22, 27, 34, 0.7);
            --primary: #00A3FF;
            --primary-glow: rgba(0, 163, 255, 0.4);
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --gold-gradient: linear-gradient(135deg, #FFF7CC 0%, #FFD700 40%, #B8860B 100%);
            --text-main: #F0F6FC;
            --text-muted: #8B949E;
            --border-color: rgba(240, 246, 252, 0.1);
            --success: #238636;
            --error: #DA3633;
            --card-radius: 24px;
            --btn-radius: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            /* Background Mesh Gradient */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 163, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .header-content h1 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #fff, #aeb9cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
        }

        .back-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Coin Widget --- */
        .coin-balance-widget {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-dark);
            padding: 6px 14px;
            border-radius: 50px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            color: var(--gold);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
            animation: spinCoin 4s infinite linear;
        }

        @keyframes spinCoin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .coin-amount {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            color: var(--gold);
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* --- Main Content --- */
        main {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .section-icon {
            color: var(--primary);
            background: rgba(0, 163, 255, 0.1);
            padding: 8px;
            border-radius: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* --- Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 24px;
            }
        }

        /* --- Cards --- */
        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.5;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.15);
        }

        /* Coin Packs */
        .card-coin .icon-box {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .card-coin svg {
            width: 40px;
            height: 40px;
            color: var(--gold);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
        }

        /* Subscription Packs */
        .card-sub {
            background: linear-gradient(160deg, #161b22 60%, rgba(0, 163, 255, 0.1) 100%);
        }

        .card-sub.premium {
            background: linear-gradient(160deg, #161b22 60%, rgba(255, 215, 0, 0.1) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);
        }

        .card-sub.premium .icon-box svg {
            color: var(--gold);
        }
        
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge.special { background: var(--primary); color: #fff; }
        .badge.gold { background: var(--gold-gradient); color: #000; box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3); }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin: 8px 0;
            color: #fff;
        }

        .card-price {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .price-highlight {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1em;
        }

        .card-sub.premium .price-highlight {
            color: var(--gold);
        }

        /* --- Buttons --- */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--btn-radius);
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-buy {
            background: rgba(255, 255, 255, 0.08);
            color: var(--primary);
            border: 1px solid rgba(0, 163, 255, 0.3);
        }

        .btn-buy:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-gold {
            background: var(--gold-gradient);
            color: #1a1a1a;
            border: none;
        }

        .btn-gold:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }

        /* Loading Spinner inside Button */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .btn.loading .btn-text { display: none; }
        .btn.loading .spinner { display: block; }

        /* --- Full Screen Loader --- */
        #page-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary);
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        .loader-text { margin-top: 15px; color: var(--text-muted); font-size: 0.9em; }

        /* --- Toast Notification --- */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: rgba(22, 27, 34, 0.95); border: 1px solid var(--border-color);
            padding: 12px 24px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            opacity: 0; visibility: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: var(--success); }
        #toast.success svg { color: var(--success); }
        #toast.error { border-color: var(--error); }
        #toast.error svg { color: var(--error); }

        /* --- Confirmation Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
            z-index: 2500; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: #161b22; width: 90%; max-width: 350px;
            padding: 24px; border-radius: 20px; text-align: center;
            border: 1px solid var(--border-color);
            transform: scale(0.9); transition: 0.3s;
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h3 { margin: 0 0 10px; color: var(--text-main); }
        .modal p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .modal-actions { display: flex; gap: 12px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }

    </style>
</head>

        <!-- Buy Coins Section -->

    <!-- Confirmation Modal -->

    <!-- Toast -->
    <div id="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-msg">عملیات موفقیت آمیز بود</span>
    </div>

    <script>
        /* --- CONFIGURATION --- */
        const PROXY_URL = 'https://miko.freehost.io/firebase_proxy.php';
        const SHARED_SECRET = 'miko1234';

        /* --- STATE --- */
        let currentUser = null;

        /* --- UTILS --- */
        const toPersianNum = (n) => n.toString().replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
        
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            toast.className = type;
            msgEl.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* --- API HANDLERS --- */
        async function callServer(action, data = {}) {
            try {
                // Prepare FormData for PHP POST
                const formData = new FormData();
                formData.append('secret', SHARED_SECRET);
                formData.append('action', action);
                
                // Add specific data
                for (const key in data) {
                    if (typeof data[key] === 'object') {
                        formData.append(key, JSON.stringify(data[key]));
                    } else {
                        formData.append(key, data[key]);
                    }
                }

                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('خطا در ارتباط با سرور');
                
                const result = await response.json();
                if (result.error) throw new Error(result.error);
                
                return result;

            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        async function fetchUserData(telegramId) {
            try {
                const result = await callServer('getUser', { telegramId });
                if(result.success && result.data) {
                    currentUser = result.data;
                    updateUI();
                }
            } catch (e) {
                showToast('خطا در دریافت اطلاعات کاربر', 'error');
            }
        }

        async function updateUserOnServer(telegramId, updates) {
            return await callServer('updateUser', {
                telegramId: telegramId,
                updates: updates
            });
        }

        /* --- UI LOGIC --- */
        function updateUI() {
            if (!currentUser) return;
            
            // Coin Display
            const coinEl = document.getElementById('coin-display');
            const currentVal = parseInt(coinEl.innerText.replace(/[^0-9]/g, '')) || 0;
            const targetVal = currentUser.coins || 0;
            
            // Simple animation
            coinEl.innerText = toPersianNum(targetVal.toLocaleString());
            
            // Sync LocalStorage for backup
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        }

        /* --- INITIALIZATION --- */
        document.addEventListener('DOMContentLoaded', async () => {
            const storedUser = localStorage.getItem('currentUser');
            const loader = document.getElementById('page-loader');

            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                updateUI(); // Show cached data immediately
            } else {
                // If no user, redirect to login (Uncomment in production)
                // window.location.href = 'login.html';
                // For test:
                currentUser = { telegramId: 'test_user', coins: 0, accountType: 'regular' };
            }

            if (currentUser && currentUser.telegramId) {
                await fetchUserData(currentUser.telegramId);
            }
            
            // Hide Loader
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        /* --- BUY COINS LOGIC --- */
        async function handleBuyCoins(amount, price, btn) {
            if (!currentUser) return;

            // 1. UI Loading
            btn.classList.add('loading');
            btn.disabled = true;

            // 2. Simulate Payment Gateway (2 seconds delay)
            setTimeout(async () => {
                try {
                    // 3. Payment Successful -> Update Server
                    const newBalance = (currentUser.coins || 0) + amount;
                    
                    await updateUserOnServer(currentUser.telegramId, {
                        coins: newBalance
                    });

                    // 4. Update Local State & UI
                    currentUser.coins = newBalance;
                    updateUI();
                    showToast(`${toPersianNum(amount.toLocaleString())} سکه اضافه شد!`, 'success');

                } catch (error) {
                    showToast('خطا در ثبت خرید. با پشتیبانی تماس بگیرید.', 'error');
                } finally {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }, 2000);
        }

        /* --- BUY SUBSCRIPTION LOGIC --- */
        let pendingSub = null;
        const modal = document.getElementById('confirm-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const confirmBtn = document.getElementById('modal-confirm-btn');

        function preBuySubscription(type, cost, durationName) {
            if (!currentUser) return;

            const typeName = type === 'premium' ? 'پریمیوم' : 'ویژه';

            // Check Account Type
            if (currentUser.accountType === type) {
                showToast(`شما همین الان اشتراک ${typeName} دارید!`, 'error');
                return;
            }

            // Check Balance
            if ((currentUser.coins || 0) < cost) {
                showToast('موجودی سکه کافی نیست!', 'error');
                return;
            }

            // Open Modal
            pendingSub = { type, cost, typeName, durationName };
            modalTitle.innerText = `خرید اشتراک ${typeName}`;
            modalDesc.innerText = `آیا مایلید با پرداخت ${toPersianNum(cost.toLocaleString())} سکه، اشتراک ${durationName} را فعال کنید؟`;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            pendingSub = null;
        }

        confirmBtn.addEventListener('click', async () => {
            if (!pendingSub || !currentUser) return;

            const { type, cost, typeName } = pendingSub;
            const btn = confirmBtn;

            btn.classList.add('loading');
            
            try {
                // Calculate Expiration (Simple 30 days logic for now)
                const days = type === 'premium' ? 90 : 30; // 3 months or 1 month
                const expireDate = new Date();
                expireDate.setDate(expireDate.getDate() + days);

                // Update Data
                const newBalance = currentUser.coins - cost;
                const updates = {
                    coins: newBalance,
                    accountType: type,
                    subscriptionExpireAt: expireDate.toISOString()
                };

                // Send to Server
                await updateUserOnServer(currentUser.telegramId, updates);

                // Update Local
                Object.assign(currentUser, updates);
                updateUI();
                
                closeModal();
                showToast(`تبریک! حساب شما ${typeName} شد.`, 'success');

            } catch (error) {
                showToast('خطا در فعال‌سازی اشتراک', 'error');
                console.error(error);
            } finally {
                btn.classList.remove('loading');
            }
        });

    </script>
</body>
</html>
